<title>AI Agent 아키텍트 워크북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9ECF2; --surface-3:#DBDFE7;
  --ink:#161A21; --ink-dim:#5B6270; --ink-faint:#8890A0; --border:#D9DDE5;
  --accent:#C4790E; --accent-ink:#8A5405; --accent-soft:#F6E2C2;
  --done:#1F8F6E; --done-soft:#D7F0E6;
  --code-bg:#161A21; --code-ink:#E7EAF0; --code-border:#2A2F38;
  --shadow:0 1px 2px rgba(20,24,32,.06), 0 10px 28px rgba(20,24,32,.07);
  --font-body:'IBM Plex Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-display:'IBM Plex Sans KR','Malgun Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
  --radius-soft:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --surface:#181C24; --surface-2:#20252E; --surface-3:#2A303B;
    --ink:#E9ECF2; --ink-dim:#9BA3B4; --ink-faint:#6C7484; --border:#2B313D;
    --accent:#E3A03C; --accent-ink:#FFD79A; --accent-soft:#3A2C14;
    --done:#4FBF97; --done-soft:#153429;
    --code-bg:#0D1015; --code-ink:#E9ECF2; --code-border:#262B33;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#181C24; --surface-2:#20252E; --surface-3:#2A303B;
  --ink:#E9ECF2; --ink-dim:#9BA3B4; --ink-faint:#6C7484; --border:#2B313D;
  --accent:#E3A03C; --accent-ink:#FFD79A; --accent-soft:#3A2C14;
  --done:#4FBF97; --done-soft:#153429;
  --code-bg:#0D1015; --code-ink:#E9ECF2; --code-border:#262B33;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ---- "쉬운 설명" skin — warmer, editorial, for a visual-design audience ---- */
.app.theme-easy{
  --bg:#FBF3F1; --surface:#FFFFFF; --surface-2:#F6E8E5; --surface-3:#EEDAD5;
  --ink:#2B2024; --ink-dim:#7C6367; --ink-faint:#A98D91; --border:#EAD5D0;
  --accent:#D64566; --accent-ink:#A32C48; --accent-soft:#FBDCE3;
  --done:#3E8E7E; --done-soft:#DCEFE9;
  --code-bg:#241A22; --code-ink:#F5E9E6; --code-border:#3A2A32;
  --shadow:0 1px 2px rgba(43,32,36,.07), 0 10px 26px rgba(43,32,36,.09);
  --font-display:'Gowun Batang','Malgun Gothic',serif;
  --font-body:'Gowun Dodum','Malgun Gothic',-apple-system,sans-serif;
  --radius-soft:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .app.theme-easy{
    --bg:#201822; --surface:#2A1F29; --surface-2:#352832; --surface-3:#40323C;
    --ink:#F3E6EA; --ink-dim:#C2A8B0; --ink-faint:#8C7078; --border:#4A3A42;
    --accent:#F0709A; --accent-ink:#FFC1D6; --accent-soft:#4A2530;
    --done:#5FC7A9; --done-soft:#1F3D34;
    --code-bg:#17111A; --code-ink:#F3E6EA; --code-border:#3A2C34;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] .app.theme-easy{
  --bg:#201822; --surface:#2A1F29; --surface-2:#352832; --surface-3:#40323C;
  --ink:#F3E6EA; --ink-dim:#C2A8B0; --ink-faint:#8C7078; --border:#4A3A42;
  --accent:#F0709A; --accent-ink:#FFC1D6; --accent-soft:#4A2530;
  --done:#5FC7A9; --done-soft:#1F3D34;
  --code-bg:#17111A; --code-ink:#F3E6EA; --code-border:#3A2C34;
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 26px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
  font-size:15px; line-height:1.6;
}
::selection{ background:var(--accent-soft); color:var(--accent-ink); }
a{ color:var(--accent-ink); }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }

.app{ display:flex; flex-direction:column; min-height:100vh; }

/* ---- top bar ---- */
.topbar{
  display:flex; align-items:center; gap:14px;
  padding:0 18px; height:56px; flex-shrink:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:30;
}
.menu-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink); font-size:16px; cursor:pointer; flex-shrink:0;
}
.menu-btn:hover{ background:var(--surface-3); }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-mark{ font-size:20px; line-height:1; color:var(--accent); }
.brand-mark::before{
  content:"▌"; font-family:var(--font-mono); font-weight:600;
  animation:blink 1.4s steps(1) infinite;
}
.theme-easy .brand-mark::before{ content:"●"; animation:none; font-size:.75em; }
@media (prefers-reduced-motion: reduce){ .brand-mark::before{ animation:none; } }
@keyframes blink{ 0%,45%{opacity:1;} 50%,95%{opacity:0;} 100%{opacity:1;} }
.brand-text{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.brand-text strong{ font-family:var(--font-display); font-size:15px; font-weight:700; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-text span{ font-size:11.5px; color:var(--ink-dim); }
.progress-chip{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.progress-track{ width:120px; height:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.progress-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--done)); transition:width .35s ease; border-radius:99px; }
#progressLabel{
  font-family:var(--font-mono); font-size:12px; color:var(--ink-dim);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* ---- body layout ---- */
.layout{ display:flex; flex:1; min-height:0; }

.sidebar{
  width:272px; flex-shrink:0; background:var(--surface-2);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
  position:sticky; top:56px; height:calc(100vh - 56px);
  transition:width .22s ease;
}
.sidebar-scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:18px 12px 8px; }
@media (min-width:861px){
  .layout.sidebar-collapsed .sidebar{ width:0; border-right-color:transparent; }
}
@media (prefers-reduced-motion: reduce){ .sidebar{ transition:none; } }

.level-switch{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:9px 10px; margin:0 0 14px; border-radius:10px;
  background:var(--surface); border:1px solid var(--border);
}
.level-switch-label{ font-size:11.5px; color:var(--ink-dim); line-height:1.3; }
.level-toggle{
  display:flex; background:var(--surface-2); border:1px solid var(--border);
  border-radius:99px; padding:2px; gap:2px; flex-shrink:0;
}
.level-btn{
  border:none; background:transparent; color:var(--ink-dim);
  font-family:inherit; font-size:11.5px; font-weight:600;
  padding:5px 11px; border-radius:99px; cursor:pointer; white-space:nowrap;
}
.level-btn:hover:not(.active){ color:var(--ink); }
.level-btn.active{ background:var(--accent); color:#fff; }

.nav-group{ margin-bottom:10px; }
.nav-group-head{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:8px 8px; margin:0 -8px 2px; border-radius:8px;
  font-size:11.5px; font-weight:700; letter-spacing:.5px;
  text-transform:uppercase; color:var(--ink-faint);
  cursor:pointer; user-select:none;
}
.nav-group-head:hover{ background:var(--surface-3); color:var(--ink); }
.nav-group-title{ display:flex; align-items:center; gap:6px; }
.nav-group-chevron{
  display:inline-block; font-size:9px; transform:rotate(0deg);
  transition:transform .18s ease; color:var(--ink-faint);
}
.nav-group.collapsed .nav-group-chevron{ transform:rotate(-90deg); }
.nav-group.collapsed .nav-items{ display:none; }
.nav-group-frac{ font-family:var(--font-mono); font-weight:500; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums; }
.nav-items{ display:flex; flex-direction:column; gap:2px; padding-top:4px; }
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 8px; border-radius:8px; text-decoration:none;
  color:var(--ink); font-size:13.5px; transition:background .12s ease;
}
.nav-item:hover{ background:var(--surface-3); }
.nav-item.active{ background:var(--surface); box-shadow:var(--shadow); font-weight:700; }
.nav-num{
  flex-shrink:0; width:22px; height:22px; border-radius:6px;
  background:var(--surface-3); color:var(--ink-dim);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:11.5px; font-weight:600;
}
.nav-item.active .nav-num{ background:var(--accent); color:#fff; }
.nav-item.done .nav-num{ background:var(--done); color:#fff; }
.nav-item--overview .nav-num{ background:transparent; color:var(--accent); font-size:15px; }
.nav-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.nav-frac{
  flex-shrink:0; font-family:var(--font-mono); font-size:10.5px;
  color:var(--ink-faint); font-variant-numeric:tabular-nums;
  padding:1px 6px; border-radius:99px; background:var(--surface-3);
}
.nav-item.done .nav-frac{ background:var(--done-soft); color:var(--done); }
.nav-item.partial .nav-frac{ background:var(--accent-soft); color:var(--accent-ink); }

.reset-btn{
  flex-shrink:0; margin:8px 12px 14px;
  background:var(--surface); border:1px solid var(--border); color:var(--ink-dim);
  font-size:12px; padding:9px 10px; border-radius:8px; cursor:pointer;
  font-family:inherit;
}
.reset-btn:hover{ color:var(--ink); border-color:var(--ink-faint); }

.content-wrap{ flex:1; min-width:0; display:flex; justify-content:center; padding:40px 24px 100px; }
.content{ max-width:720px; width:100%; }

/* ---- rendered markdown ---- */
.easy-badge{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.3px;
  color:var(--done); background:var(--done-soft);
  padding:4px 11px; border-radius:99px; margin-bottom:12px;
}
.easy-badge::before{ content:"◆"; font-size:8px; }
.content h1{
  font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-.2px; text-wrap:balance;
  margin:0 0 6px; padding-bottom:14px; border-bottom:3px solid var(--accent);
}
.content h2{
  font-family:var(--font-display); font-size:18.5px; font-weight:700; margin:34px 0 12px;
  padding-bottom:8px; border-bottom:1px solid var(--border); text-wrap:balance;
}
.content h3{ font-family:var(--font-display); font-size:16px; font-weight:700; margin:26px 0 8px; color:var(--accent-ink); }
.content h4{ font-size:14px; font-weight:700; margin:18px 0 6px; }
.content > *:first-child{ margin-top:0; }
.content p{ margin:10px 0; color:var(--ink); }
.content > p:first-of-type{ font-size:15.5px; color:var(--ink-dim); }
.content strong{ font-weight:700; }
.content ul, .content ol{ margin:8px 0; padding-left:22px; }
.content li{ margin:5px 0; }
.content li.task-list-item{ list-style:none; margin-left:-22px; padding-left:0; display:flex; gap:8px; align-items:flex-start; }
.content blockquote{
  margin:14px 0; padding:10px 16px; border-left:4px solid var(--accent);
  background:var(--accent-soft); color:var(--accent-ink); border-radius:0 8px 8px 0;
}
.content blockquote p{ margin:4px 0; color:inherit; }
.content hr{ border:none; border-top:1px solid var(--border); margin:28px 0; }
.content a{ text-underline-offset:2px; }
.content > div.table-wrap{ overflow-x:auto; }
.content table{
  border-collapse:collapse; width:100%; margin:14px 0; font-size:13px;
}
.content th, .content td{ border:1px solid var(--border); padding:7px 11px; text-align:left; }
.content th{ background:var(--surface-2); font-weight:700; }
.content tr:nth-child(even) td{ background:var(--surface); }

.content code{
  font-family:var(--font-mono); font-size:12.5px;
  background:var(--surface-2); color:var(--accent-ink);
  padding:2px 6px; border-radius:4px;
}
.content pre{
  position:relative; background:var(--code-bg); color:var(--code-ink);
  border:1px solid var(--code-border); border-radius:10px;
  padding:16px 16px 14px; margin:14px 0; overflow-x:auto;
}
.content pre code{ background:none; color:inherit; padding:0; font-size:12.5px; line-height:1.6; }
.copy-btn{
  position:absolute; top:8px; right:8px; font-family:var(--font-body);
  font-size:11px; padding:4px 9px; border-radius:6px; cursor:pointer;
  background:rgba(255,255,255,.08); color:#C9CEDA; border:1px solid rgba(255,255,255,.14);
}
.copy-btn:hover{ background:rgba(255,255,255,.16); color:#fff; }
.copy-btn.copied{ background:var(--done); color:#fff; border-color:var(--done); }

/* checkboxes */
.content input[type=checkbox]{
  appearance:none; -webkit-appearance:none; width:17px; height:17px; flex-shrink:0;
  margin-top:3px; border:2px solid var(--ink-faint); border-radius:5px;
  cursor:pointer; position:relative; background:var(--surface);
}
.content input[type=checkbox]:checked{ background:var(--done); border-color:var(--done); }
.content input[type=checkbox]:checked::after{
  content:""; position:absolute; left:4px; top:0px; width:5px; height:9px;
  border:solid #fff; border-width:0 2px 2px 0; transform:rotate(40deg);
}
.content li.task-list-item.checked{ color:var(--ink-faint); text-decoration:line-through; }
.content li.task-list-item.checked strong{ color:inherit; }
.content li.task-list-item .task-text{ flex:1; }

footer.doc-nav{
  display:flex; justify-content:space-between; gap:12px; margin-top:44px;
  padding-top:18px; border-top:1px solid var(--border);
}
.doc-nav a{
  font-size:13px; color:var(--ink-dim); text-decoration:none; max-width:47%;
  padding:10px 14px; border:1px solid var(--border); border-radius:10px; background:var(--surface);
}
.doc-nav a:hover{ border-color:var(--accent); color:var(--accent-ink); }
.doc-nav .lbl{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); margin-bottom:2px; }

/* softer, rounder shapes for the "쉬운 설명" skin — evokes a mood board / creative-tool feel */
.theme-easy .nav-item{ border-radius:var(--radius-soft); }
.theme-easy .nav-num{ border-radius:11px; }
.theme-easy .level-switch{ border-radius:var(--radius-soft); }
.theme-easy .reset-btn{ border-radius:var(--radius-soft); }
.theme-easy .content pre{ border-radius:var(--radius-soft); }
.theme-easy .content code{ border-radius:8px; }
.theme-easy .content blockquote{ border-radius:4px var(--radius-soft) var(--radius-soft) 4px; }
.theme-easy .doc-nav a{ border-radius:var(--radius-soft); }
.theme-easy .easy-badge{ font-family:var(--font-body); }
.theme-easy .table-wrap{ border-radius:12px; overflow:hidden; border:1px solid var(--border); }
.theme-easy .table-wrap table{ margin:0; border:none; }
.theme-easy .content input[type=checkbox]{ border-radius:50%; }

@media (max-width:860px){
  .progress-track{ width:74px; }
  .sidebar{
    position:fixed; top:56px; left:0; height:calc(100vh - 56px); z-index:40;
    width:82vw; max-width:320px; transform:translateX(-105%);
    transition:transform .22s ease; box-shadow:var(--shadow);
  }
  .sidebar.open{ transform:translateX(0); }
  .content-wrap{ padding:26px 16px 90px; }
}
</style>

<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="사이드바 접기/펴기" aria-expanded="true">☰</button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text">
        <strong>AI Agent 아키텍트</strong>
        <span>워크북 · B Track</span>
      </div>
    </div>
    <div class="progress-chip">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span id="progressLabel">0 / 0 · 0%</span>
    </div>
  </header>

  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-scroll">
        <div class="level-switch" title="설명 방식을 바꿉니다 · 복붙할 프롬프트·명령어는 두 버전이 동일합니다">
          <span class="level-switch-label">설명<br>난이도</span>
          <div class="level-toggle" role="group" aria-label="설명 난이도">
            <button type="button" class="level-btn" id="levelGeneralBtn" data-level="general">일반</button>
            <button type="button" class="level-btn" id="levelEasyBtn" data-level="easy">쉬운</button>
          </div>
        </div>
        <div class="nav-group" id="groupNote">
          <div class="nav-group-head" data-group="note" role="button" tabindex="0" aria-expanded="true">
            <span class="nav-group-title"><span class="nav-group-chevron">&#9660;</span>학습노트</span>
            <span class="nav-group-frac" id="fracNote">0/0</span>
          </div>
          <div class="nav-items" id="noteItems"></div>
        </div>
        <div class="nav-group" id="groupGuide">
          <div class="nav-group-head" data-group="guide" role="button" tabindex="0" aria-expanded="true">
            <span class="nav-group-title"><span class="nav-group-chevron">&#9660;</span>자습·실습 가이드</span>
            <span class="nav-group-frac" id="fracGuide">0/0</span>
          </div>
          <div class="nav-items" id="guideItems"></div>
        </div>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">진행 상황 초기화</button>
    </nav>

    <main class="content-wrap">
      <article id="content" class="content"></article>
    </main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script>
(function(){
  var DOCS = [{"id": "overview", "filename": "README.md", "category": "note", "badge": "", "label": "과정 개요", "content": "# B Track : AI Agent 아키텍트 과정 — 학습 노트\n\nNotion 원본: https://teamsparta.notion.site/B-Track-AI-Agent-3c92dc3ef514818fa341c9203d4faa92\n교안 링크: https://b2bsparta.com/0827-686a\n\n삼성 DS 대상 1일(8교시) 바이브코딩 교육. Claude Code로 코드를 직접 작성하지 않고\n웹앱 → RAG → Agent → 캡스톤까지 4개 프로젝트를 순서대로 만든다.\n\n## 두 가지 AI, 역할이 다르다\n- **Claude Code** — 개발 도구. 자연어 지시로 코드를 작성/수정. 구독 계정 로그인.\n- **OpenAI GPT (`gpt-5.6-luna`)** — 앱에 탑재되는 AI 기능. 채팅 응답·임베딩·도구 선택. 배부된 API Key 사용.\n\n이 구분은 8교시까지 계속 유지된다.\n\n## 시간표 & 노트 목차\n\n| 교시 | 시간 | 주제 | 노트 |\n|---|---|---|---|\n| 1 | 09:00–09:50 | 바이브코딩 입문 (웹앱 + OpenAI 연동) | [01-바이브코딩-웹앱.md](01-바이브코딩-웹앱.md) |\n| 2 | 10:00–10:50 | RAG 1 — 저장과 검색 5단계 | [02-RAG1-저장과검색.md](02-RAG1-저장과검색.md) |\n| 3 | 11:00–11:50 | RAG 2 — 검색 실패 진단과 개선 | [03-RAG2-검색개선.md](03-RAG2-검색개선.md) |\n| — | 12:00–13:00 | 점심 | |\n| 4 | 13:00–13:50 | Tool Calling | [04-ToolCalling.md](04-ToolCalling.md) |\n| 5 | 14:00–14:50 | MCP | [05-MCP.md](05-MCP.md) |\n| 6 | 15:00–15:50 | Multi-Agent (Deep Research) | [06-MultiAgent.md](06-MultiAgent.md) |\n| 7 | 16:00–16:50 | 캡스톤 1 — 기획과 제작 | [07-캡스톤1-기획제작.md](07-캡스톤1-기획제작.md) |\n| 8 | 17:00–18:00 | 캡스톤 2 — 완성과 제출 | [08-캡스톤2-완성제출.md](08-캡스톤2-완성제출.md) |\n\n## 전체 흐름 한눈에 보기\n\n```\n1교시  웹앱 하나(지도+날씨) 만들고 OpenAI 채팅 붙이기        → API, .env, 바이브코딩 기본기\n2교시  rag-lab 앱 분석 → naive RAG 5단계 직접 관찰            → 파싱·청킹·임베딩·검색·생성\n3교시  검색 실패 진단 → Reranking · Metadata Filter ·\n       Query Rewrite 처방, LLM-as-a-Judge로 채점              → \"고치는 순서\"가 핵심 기술\n4교시  agent-lab 앱 → 도구 설명문이 곧 AI의 판단 근거          → Tool Calling 구조\n5교시  MCP 서버 연결(로컬/원격) → 도구 목록이 그대로 합쳐짐    → 표준 규격의 힘\n6교시  Multi-Agent(연구책임자·자료조사·실험수행) 역할 분담     → 왜 나누는가(맥락 한계, 유지보수)\n7~8교시 캡스톤 — 트랙 선택, 100분 제작, report.html 제출       → 자유/도구설계/함정질문/조사리포트\n```\n\n## 자습·실습 가이드 (혼자 따라 하기)\n\n강의 노트가 개념 설명이라면, 아래는 **체크리스트 형식의 실행 가이드**입니다. 배부 계정/배부 파일 없이 본인 환경에서 처음부터 끝까지 진행할 수 있게 재구성했습니다.\n\n- [실습가이드-00-준비.md](실습가이드-00-준비.md) — 환경 설정, 원본과 달라지는 점\n- [실습가이드-01-웹앱.md](실습가이드-01-웹앱.md)\n- [실습가이드-02-RAG1.md](실습가이드-02-RAG1.md)\n- [실습가이드-03-RAG2.md](실습가이드-03-RAG2.md)\n- [실습가이드-04-ToolCalling.md](실습가이드-04-ToolCalling.md)\n- [실습가이드-05-MCP.md](실습가이드-05-MCP.md)\n- [실습가이드-06-MultiAgent.md](실습가이드-06-MultiAgent.md)\n- [실습가이드-07-캡스톤.md](실습가이드-07-캡스톤.md)\n\n## 반복해서 등장하는 핵심 원칙 (전 교시 공통)\n\n1. **`.env`는 Git 유출 방지용이지, Claude Code(Agent)로부터 Key를 숨기는 장치가 아니다.**\n   Agent가 파일·셸에 접근 가능하면 Key를 읽을 수 있다.\n2. **LLM은 도구 \"선택\"만 한다. 실행은 앱(코드)이 한다.** AI는 도구의 설명문(description)만 보고 판단하며 코드는 못 본다 → 설명문 품질이 곧 정확도.\n3. **행동 범위는 두 겹으로 막는다**: ① 역할 프롬프트(문구, 뚫릴 수 있음) ② 아예 도구를 안 쥐여주기(확실함, MCP 연결/해제·Multi-Agent 역할분리로 구현).\n4. **RAG 답변 품질 = 검색 품질.** 문서가 수천 쪽이어도 AI가 실제로 읽는 건 검색이 골라낸 몇 조각뿐.\n5. **\"고치는 순서\"는 시스템 불문 공통 기술**: 증상 확인 → 원인(생성 vs 검색?) 분리 → 맞는 처방 선택 → 개선 여부를 반드시 숫자로 재확인(라운드 0 기준선 필수, 한 번에 한 가지만 변경).\n6. **Multi-Agent로 나누는 이유는 \"여러 개가 좋아서\"가 아니라 역할마다 필요한 자료·도구·권한이 달라서.** 나눌 이유 없으면 한 Agent가 낫다(통신 비용 발생).\n", "cbCount": 0, "contentEasy": "# B Track : AI Agent 아키텍트 과정 — 쉬운 설명 버전\n\n> 이 버전은 **포토샵은 능숙하고 Midjourney·Higgsfield 같은 생성형 AI 툴도 써봤지만, \"임베딩\"·\"API\"·\"에이전트\" 같은 개발 용어는 낯선 분**을 위해 풀어 쓴 버전입니다. 다루는 내용은 일반 버전과 똑같고, 설명하는 방식만 다릅니다. **자습·실습 가이드에도 쉬운 버전이 있습니다** — 복붙할 프롬프트·명령어는 완전히 동일하고, 그 사이사이 설명만 이 버전처럼 풀어져 있습니다.\n\n## 오늘 뭘 만드나 — 디자이너의 말로 옮기면\n\n하루 동안 프로그램을 4개 만듭니다. 코드를 타이핑하지 않고, **말로 시켜서** 만듭니다. Midjourney에 프롬프트를 넣으면 이미지가 나오듯, \"Claude Code\"라는 AI에게 \"이런 걸 만들어줘\"라고 말하면 진짜 동작하는 프로그램이 나옵니다.\n\n두 종류의 AI가 나오는데, 역할이 다릅니다.\n\n- **Claude Code** — 프로그램을 대신 만들어주는 AI. 포토샵으로 치면 \"액션(매크로)을 대신 짜주는 어시스턴트\"에 가깝습니다.\n- **OpenAI GPT** — 완성된 프로그램 **안에서** 실제로 돌아가는 AI 기능이에요. 챗봇이 답하거나, 검색을 도와주는 그 부분입니다.\n\n이 구분을 8시간 내내 기억해두면 헷갈릴 일이 없습니다.\n\n## 오늘 만드는 4가지\n\n1. **웹앱** — 지도를 클릭하면 날씨가 뜨고, AI 챗봇도 붙어 있는 웹페이지. (기본기 익히는 단계)\n2. **RAG 앱** — 문서를 넣어두면 그 내용을 정확히 찾아 답해주는 앱. **레퍼런스 폴더에서 필요한 자료만 골라 무드보드에 붙이고, 그걸 보고 그리는 것**과 원리가 똑같습니다.\n3. **Agent 앱** — AI에게 \"액션(도구)\"을 쥐여줘서 스스로 판단해 실행하게 만드는 앱. 나중엔 여러 AI가 **팀처럼 역할을 나눠** 협업하는 것까지 다룹니다.\n4. **캡스톤** — 위 세 가지를 조합해 내 것을 만들어보는 시간.\n\n## 시간표\n\n| 교시 | 시간 | 배우는 것 |\n|---|---|---|\n| 1 | 09:00–09:50 | 웹앱 만들기 + AI 챗봇 붙이기 |\n| 2 | 10:00–10:50 | 문서를 AI가 참고하게 만들기 (1단계) |\n| 3 | 11:00–11:50 | 검색이 헷갈릴 때 고치는 법 |\n| — | 12:00–13:00 | 점심 |\n| 4 | 13:00–13:50 | AI에게 \"액션\" 쥐여주기 |\n| 5 | 14:00–14:50 | 다른 서비스의 기능을 표준 방식으로 연결하기 |\n| 6 | 15:00–15:50 | AI 여러 명이 팀처럼 협업하기 |\n| 7 | 16:00–16:50 | 캡스톤 1 — 내 것 기획·제작 |\n| 8 | 17:00–18:00 | 캡스톤 2 — 완성·제출 |\n\n## 오늘 계속 나오는 개념 3가지 — 미리 알아두면 훨씬 편함\n\n- **프롬프트** — 이미 아시는 그 프롬프트입니다. Midjourney에 타이핑하듯, 이번엔 그림 대신 코드나 글을 만들어달라고 AI에게 타이핑합니다. 오늘 회색 상자로 나오는 텍스트는 전부 \"복붙해서 넣을 프롬프트\"예요.\n- **API 키** — 어떤 서비스를 \"내 이름으로\" 쓸 수 있게 해주는 인증서. 로그인 비밀번호랑 비슷한데, 절대 남에게 보여주면 안 됩니다 — 새어나가면 내 이름으로 요금이 청구될 수 있어요.\n- **모델** — Midjourney의 버전(v5, v6)을 고르듯, \"어떤 AI 두뇌를 쓸지\" 고르는 순간이 오늘 계속 나옵니다. 버전마다 성능과 속도, 비용이 다릅니다.\n\n## 정리\n\n- Claude Code(만드는 도구)와 OpenAI GPT(만들어진 앱 안의 AI)는 역할이 다르다 — 이 구분이 오늘의 뼈대\n- 오늘 하는 모든 작업은 결국 \"프롬프트로 무언가를 만들어달라고 시키는 것\" — Midjourney에서 하던 것과 근본 원리는 같다\n- 실제로 손 움직이는 실습은 [자습·실습 가이드](../실습가이드-00-준비.md)를 그대로 따라 하면 됩니다\n"}, {"id": "note-1", "filename": "01-바이브코딩-웹앱.md", "category": "note", "badge": "1", "label": "웹앱 만들기", "content": "# 1교시 · 바이브코딩 입문 — 웹 앱을 만들고 LLM을 붙인다\n\n## 배경 지식 (알아두면 좋은 맥락)\n- **바이브코딩(Vibe Coding)**: 코드를 직접 타이핑하지 않고 자연어로 설명 → AI가 구현. 2025.02 Andrej Karpathy가 명명, Collins 사전 2025 올해의 단어.\n- Google DORA 2025: AI 도입률 90%. Gartner: 2028년까지 기업 엔지니어 AI 코딩 도구 사용률 90% 전망.\n- 개발자 역할 이동: 구현(implementation) → 오케스트레이션(문제정의·설계·품질검증).\n- 문제점: DORA에 따르면 AI 도입은 처리량은 늘리지만 **배포 불안정성도 함께 높인다.** 도입률 90%인데 신뢰가 못 따라가는 게 현재 병목. → 성과는 도구가 아니라 조직의 워크플로/플랫폼 품질이 좌우.\n- AI 코딩 도구 3단계: 웹 채팅창(복붙) → IDE 내 AI(제안) → **터미널 CLI(폴더 통째로 위임)**. Claude Code는 3번째 방식.\n\n## 왜 Claude Code / 왜 터미널(PowerShell)인가\n- 작업 범위가 **폴더 단위**로 명확 (실행 위치가 곧 작업 공간, 바깥은 허락 없이 접근 안 함)\n- 실행 전 **승인**을 요청함\n- CLI는 AI가 실행 결과를 그대로 읽고 다음 판단에 씀 (글자로 주고받으니 자기 로그를 스스로 읽을 수 있음)\n- 터미널에는 무엇을 읽고 무엇을 실행했는지 로그가 그대로 남음 (웹/앱은 화면이 가림)\n\n## 설치 & 시작 (PowerShell)\n```powershell\nirm https://claude.ai/install.ps1 | iex     # 설치 (관리자 권한 불필요)\nclaude --version                             # 확인\n```\n- 오늘 쓰는 PowerShell 명령은 **이동/확인**뿐: `cd 폴더`, `cd ..`, `ls`, `ls -Force`(숨김파일 포함, `.env` 확인용)\n- 실습 폴더로 이동 후 `claude` 실행 → Claude Code는 **실행된 위치를 작업 공간**으로 삼음 (엉뚱한 위치에서 실행하면 엉뚱한 곳에 파일 생김)\n- 최초 실행 시 브라우저 로그인 (배부 계정) — 한 번만 하면 됨\n\n### 자주 쓰는 명령어\n| 명령 | 용도 |\n|---|---|\n| `/model` | 모델 선택 (용도별로 제한하면 토큰 절약) |\n| `/usage` | 사용량 확인 (구독 한도 있음, 하루 한 번은 확인) |\n| `/init` | 프로젝트 훑어 `CLAUDE.md` 생성 |\n| `/clear` | 대화 맥락 초기화 (만든 파일은 유지) |\n| `/compact` | 대화 맥락 요약 정리 (6교시에 사용) |\n| `/resume` | 이전 세션 복구 |\n| `/permissions` | 권한 상태 확인 |\n| `Esc` | 진행 중 작업 중단 |\n\n## API란 무엇인가 (실습으로 체감)\n브라우저 주소창에 직접 입력해보기:\n```\nhttps://api.open-meteo.com/v1/forecast?latitude=37.5&longitude=127.0&current=temperature_2m\n```\n- `https://api.open-meteo.com/v1/forecast` = 창구 주소\n- `?` 뒤 = 요청 조건 (`latitude`, `longitude`, `current`, `&`로 연결)\n- 응답은 사람용 문서가 아니라 **프로그램이 읽을 값 묶음**\n\n오늘 쓰는 두 API/라이브러리:\n- **Leaflet** — 지도 표시, 클릭한 위도·경도 반환 (공개 라이브러리)\n- **Open-Meteo** — 위도·경도 → 날씨/예보 반환 (키 발급 불필요)\n\n> Claude Code가 프레임워크를 고르는 순서: ① 폴더 안 기존 스택 → ② `CLAUDE.md` 지시서 → ③ 요구사항 성격(정적페이지=HTML/CSS/JS, 상태관리 필요=프레임워크) → ④ 학습데이터 통용도(무난하지만 개성 없음). **스택을 고정하려면 지시문이나 CLAUDE.md에 명시**해야 함 (오늘 Leaflet/Open-Meteo를 지정한 이유).\n\n## 실습 1 — 지도 날씨 웹 앱\n```\n지도에서 위치를 클릭하면 그 지역의 현재 날씨와 앞으로 7일 예보를 보여주는\n웹 앱을 만들어줘.\n지도는 Leaflet을 쓰고, 날씨 데이터는 Open-Meteo API를 써줘.\n다 만들면 브라우저에서 열어서 보여줘.\n```\n지시문 3요소: **무엇을 만들지**(결과 중심 서술) / **무엇으로 만들지**(라이브러리 지정, 안 하면 AI 임의 선택→팀마다 스택이 갈려 이후 실습이 안 맞음) / **끝나고 무엇을 할지**(브라우저 실행까지).\n\n## API Key와 보안 — `.env`\n- API Key = 누가 호출했는지 식별하는 값. 비용은 Key 주인에게 청구됨.\n- Key를 코드에서 분리해 `.env` 파일에 둠 → 코드/저장소 공유 시 Key 노출 방지 목적.\n\n> ⚠️ **`.env`가 막아주는 것 vs 못 막는 것**\n> `.env`는 **Git 유출 방지용**이지, **Claude Code(Agent)로부터 Key를 숨기는 보안장치가 아니다.** Agent가 프로젝트 파일/셸에 접근 가능하면 `.env`나 환경변수 값을 읽을 수 있음.\n> - 개인 실습: `.env` + `.gitignore` + 프로젝트별 Key + 사용량 제한\n> - 강화: OS Keychain / Credential Manager / Secret Manager\n> - 운영/기업: Claude Code에는 Key를 주지 않고, 별도 API Proxy/Gateway가 Key를 보관·대행 호출\n> 핵심: **Agent로부터 Secret을 보호하려면 Agent가 Secret을 직접 가지지 않는 구조**가 필요.\n\n`.env` 만들기 (Claude Code에게 시킴):\n```\n이 폴더에 .env 파일을 만들고 OPENAI_API_KEY 항목을 넣어줘.\n값은 비워 두고, 내가 직접 채울게.\n그리고 .gitignore 에 .env 를 추가해줘.\n```\n→ 메모장으로 열어 값 직접 입력 (파일명이 `.env.txt`로 저장되지 않게 확장자 표시 확인)\n\n## 실습 2 — 채팅 기능 추가\n```\n.env 의 OPENAI_API_KEY 를 환경변수로 읽어서 쓰고,\n지금 보고 있는 지역의 날씨 데이터를 바탕으로\n\"오늘 우산 필요해?\" 같은 질문에 답해주는 채팅창을 웹 앱에 추가해 줘.\n모델은 gpt-5.6-luna 를 써 줘.\n키 값은 코드에 직접 쓰지 마.\n```\n이 키는 하루 종일 재사용 — 이후 앱들도 각자 폴더에서 `.env.example`을 복사해 같은 키를 넣는다.\n\n## 앱 개선 (시간 남으면)\n\"예보를 그래프로\", \"마커 여러 개로 지역 비교\", \"낮/밤 배경 전환\", \"채팅 답변 근거 표시\" 등을 하나씩 지시하고 **고치는 데 걸린 시간**을 기록 — 오늘 강조점은 만드는 시간보다 **고치는 시간**.\n\n## 정리\n- 도구 구분: **Claude Code(개발)** vs **OpenAI GPT(앱 내 AI)** — 8교시까지 유지\n- `.env`는 Git 유출만 막고, Agent로부터 Secret을 숨기지 못한다\n- 다음 질문: *이 AI는 우리 회사 문서 안의 내용도 알고 있을까?* → 2교시 RAG로 이어짐\n", "cbCount": 0, "contentEasy": "# 1교시 · 웹앱 만들기 — 쉬운 설명 버전\n\n## 오늘 처음 하는 것: 말로 프로그램 만들기\n\nMidjourney나 Higgsfield에 프롬프트를 넣으면 이미지·영상이 나오죠. 오늘 쓰는 **Claude Code**도 똑같은 방식인데, 결과물이 그림이 아니라 **진짜로 동작하는 프로그램**이라는 게 다릅니다. \"지도랑 날씨 보여주는 앱 만들어줘\"라고 말하면, 실제로 클릭하면 동작하는 웹페이지가 만들어집니다.\n\n이걸 \"바이브코딩\"이라고 부릅니다. 코드 문법을 몰라도, 원하는 결과를 문장으로 설명할 수 있으면 만들 수 있습니다.\n\n## 왜 하필 터미널(까만 화면)에서 하나\n\nClaude Code는 브라우저가 아니라 PowerShell이라는 까만 화면(터미널)에서 씁니다. 어색해 보이지만 이유가 있어요 — **AI가 지금 폴더 안에 뭐가 있는지 다 보고, 파일을 직접 만들고 고치기 때문**입니다. 포토샵 액션이 레이어 패널을 직접 조작하듯, Claude Code는 폴더 안의 파일을 직접 조작합니다. 대신 파일을 만들거나 지우기 전엔 항상 \"이거 해도 될까요?\"라고 먼저 물어봅니다.\n\n## API란? — \"정해진 형식으로 주문하면 정해진 형식으로 답을 주는 창구\"\n\n스톡 이미지 사이트에서 \"sunset\"이라고 검색하면 관련 사진들이 쫙 나오죠. API도 비슷합니다. 정해진 주소에 정해진 형식으로 \"이 위치의 날씨 알려줘\"라고 요청하면, 정해진 형식으로 숫자(기온 등)가 돌아옵니다. 오늘 쓰는 두 창구:\n\n- **Leaflet** — 지도를 그려주고, 클릭한 위치의 좌표를 알려주는 창구\n- **Open-Meteo** — 좌표를 주면 날씨를 알려주는 창구 (회원가입 필요 없음)\n\n## API 키와 보안 — \"내 이름으로 쓸 수 있는 인증서\"\n\n날씨 창구는 회원가입이 필요 없지만, 이따 붙일 **AI 챗봇 기능(OpenAI GPT)**은 다릅니다. AI를 한 번 부를 때마다 실제 비용이 들기 때문에, \"누가 부르는지\" 확인하는 인증서가 필요합니다. 이게 **API 키**예요.\n\n> ⚠️ 이 키를 가진 사람은 누구나 내 이름으로 요금을 쓸 수 있습니다. 그래서 코드 안에 직접 적지 않고, `.env`라는 별도 서랍(파일)에 따로 보관합니다. 이 서랍은 **다른 사람과 공유되는 저장소(Git)에 실수로 올라가는 걸 막아주는 용도**입니다 — Claude Code 본인은 이 서랍을 열어볼 수 있다는 점은 알아두세요 (오늘 실습에선 문제 없지만, 회사 업무에 쓸 땐 이 부분을 더 신경 써야 합니다).\n\n## 실습 1 — 지도 날씨 앱 만들기\n\nClaude Code 입력창에 이렇게 프롬프트를 넣습니다 (Midjourney 프롬프트 넣는 것과 똑같은 감각이에요):\n\n```\n지도에서 위치를 클릭하면 그 지역의 현재 날씨와 앞으로 7일 예보를 보여주는\n웹 앱을 만들어줘.\n지도는 Leaflet을 쓰고, 날씨 데이터는 Open-Meteo API를 써줘.\n다 만들면 브라우저에서 열어서 보여줘.\n```\n\n**\"무엇으로 만들지\" 지정한 이유**: Leaflet, Open-Meteo처럼 이름을 콕 집어주지 않으면 AI가 알아서 고르는데, 그러면 매번 다른 재료로 만들어집니다. 포토샵으로 치면 \"빈티지 느낌으로\"보다 \"필름 그레인 필터 + 세피아 톤\"처럼 구체적으로 말할수록 원하는 결과가 나오는 것과 같습니다.\n\n## 실습 2 — AI 챗봇 기능 추가하기\n\n여기서부터가 오늘 배우는 두 번째 AI(OpenAI GPT)가 처음 등장하는 순간입니다. \"오늘 우산 필요해?\"라고 물으면 지금 보고 있는 지역의 날씨를 근거로 답해주는 챗봇을 붙입니다.\n\n```\n.env 의 OPENAI_API_KEY 를 환경변수로 읽어서 쓰고,\n지금 보고 있는 지역의 날씨 데이터를 바탕으로\n\"오늘 우산 필요해?\" 같은 질문에 답해주는 채팅창을 웹 앱에 추가해 줘.\n키 값은 코드에 직접 쓰지 마.\n```\n\n**모델**은 본인 계정에서 실제로 쓸 수 있는 것으로 지정합니다. Midjourney에서 v5냐 v6냐 고르는 것과 같은 선택이라고 생각하시면 됩니다 — 버전마다 성능·속도·비용이 다릅니다.\n\n## 정리\n\n- 오늘 한 일 = **프롬프트로 결과물을 주문하는 것**. Midjourney에서 하던 것과 똑같은 감각이지만, 결과물이 이미지 대신 \"동작하는 프로그램\"인 것뿐입니다.\n- API 키는 로그인 비밀번호처럼 다루기 — 코드에 직접 적지 말고 `.env` 서랍에.\n- 다음 시간 질문: *이 AI가 우리 회사 문서 내용도 알고 있을까?* → 답은 \"아니요, 대신 찾아서 보여주는 방법이 있다\"입니다. 다음 시간에 그걸 배웁니다.\n"}, {"id": "note-2", "filename": "02-RAG1-저장과검색.md", "category": "note", "badge": "2", "label": "RAG 1 · 저장과 검색", "content": "# 2교시 · RAG 1 — AI에게 자료를 전달하는 구조\n\n## 왜 RAG인가\n1교시 채팅에서 AI는 날씨를 원래 알던 게 아니라, **Open-Meteo 값을 질문과 함께 받아서** 읽고 답했다. 파일 1개 첨부는 되지만, 참고 자료가 100개·1000개면? 매번 전부 첨부할 수 없다 — 이 질문에서 출발한 구조가 **RAG**.\n\n## RAG = Retrieval Augmented Generation (검색 증강 생성)\n- **검색(Retrieval)** — 질문과 관련된 자료를 저장소에서 찾음\n- **증강(Augmented)** — 찾은 자료를 질문과 함께 AI에게 넘김\n- **생성(Generation)** — AI가 넘겨받은 자료를 근거로 답 생성\n\n**핵심: 문서 전체를 AI에게 넘기지 않는다.** 질문에 필요한 조각만 골라 넘긴다.\n\n## naive RAG 구성 — \"저장할 때 셋, 물어볼 때 둘\"\n\n**저장 단계 (문서를 처음 넣을 때 한 번만)**\n1. **파싱(Parsing)** — PDF에서 글자 추출\n2. **청킹(Chunking)** — 다루기 좋은 길이로 자름 (조각 = 청크)\n3. **임베딩(Embedding)과 적재** — 청크를 숫자 배열로 변환해 저장소에 저장\n\n**질문 단계 (질문마다 매번)**\n4. **검색** — 질문도 숫자 배열로 변환 → 저장된 청크와 거리 계산 → 가까운 것 추출\n5. **생성** — 추출한 청크 + 질문 → 답 생성\n\n## 임베딩이 하는 일\n컴퓨터는 \"두 문장이 비슷한 뜻인가\"를 직접 판단 못함 → 문장을 숫자 배열로 변환해 거리로 판단. 이 변환 모델이 **임베딩 모델**.\n```\n\"회의실 예약은 사내 포털에서 합니다\"   → [0.12, -0.83, 0.44, ...]\n\"미팅룸은 인트라넷으로 잡으세요\"        → [0.11, -0.79, 0.41, ...]   (뜻이 비슷 → 숫자도 가까움)\n\"주차권은 안내데스크에서 받습니다\"      → [-0.67, 0.25, -0.90, ...]\n```\n- 오늘 쓰는 모델: OpenAI `text-embedding-3-small` (1교시 API 키 재사용). 문장 1개 → 숫자 1,536개.\n- **질문과 문서는 반드시 같은 모델로 임베딩** — 다른 모델이면 거리 계산 자체가 불가능.\n\n## rag-lab 앱 실습\n1. `rag-lab.zip` 압축 해제 → `.env.example` 복사해 `.env` 생성, Key 입력\n2. `cd rag-lab` → `claude` 실행 → `/init` (코드를 직접 읽지 않고 구조 파악)\n   ```\n   이 앱은 무엇을 하는 프로그램이야?\n   파싱, 청킹, 임베딩, 검색이 각각 어느 파일에서 일어나는지 알려줘.\n   ```\n   ```\n   이 앱을 실행하려면 무엇이 필요해?\n   필요한 패키지가 있으면 설치해 줘.\n   ```\n   (chromadb · pypdf 등 설치)\n3. `run.bat` **관리자 권한으로 실행** → 브라우저에 4개 탭 (RAG 단계와 대응)\n\n## naive RAG 단계별 관찰\n\n### ① 파싱 — 문서 3종 업로드\n- 반도체 품질 핸드북(도판·표多) / 소프트에러 응용노트(절 번호 체계) / MSL 패키지 응용노트(사진·그래프多)\n- 막대그래프 = 페이지당 추출 글자 수. **붉은 칸 = 글자 거의 없음** → 원문 대조로 무엇이 누락됐는지 확인 (표/그림이 텍스트로 안 들어온 경우가 흔함)\n\n### ② 청킹 — 3가지 기준 비교\n- **고정 길이** — 글자 수로 기계적으로 자름\n- **구조 경계** — 절 번호·제목 줄에서 자름\n- **문단** — 빈 줄 기준 최소 단위\n> 자르는 길이에 정답 없음: 크게 자르면 맥락 유지되지만 무관한 내용도 딸려옴, 작게 자르면 정확하지만 문장이 자주 끊김. **문서 성격을 보고 사람이 판단.**\n\n### ③ 임베딩과 적재\n[적재] 클릭 → 청크가 임베딩 모델을 거쳐 숫자 배열로 저장. 완료 후 청크 번호로 실제 숫자 배열 확인 가능.\n\n### ④ 의미 검색\n질문(\"1 FIT 는 무엇을 뜻하나요?\")을 한국어/영어로 각각 던져 비교. **문서가 전부 영어일 때 한국어 질문이 근거를 잘 찾아오는지**가 실무의 판단 근거(번역본을 따로 넣어야 하는지 등).\n\n### ⑤ 생성\n[답변 생성] ON → 검색된 청크 + 질문 → 답변. 프롬프트 글자 수(=실제 AI가 읽은 양) vs 저장소 전체 글자 수를 비교 — **답변 품질은 곧 검색 품질**.\n- 문서에 없는 질문을 일부러 던져 환각 여부 확인\n- 그림/표 내용(글자로 안 들어온 정보)에 대해 질문해 근거 대조\n\n## 사람은 문장으로만 묻지 않는다 — 키워드 검색(BM25)\n단어만 입력해보면(`FIT`, `ALPS`, `6.2.1.1`, `Rev 2`, `박리`) 의미 검색이 놓치는 경우가 나타남.\n\n### BM25 추가 (Claude Code에게 개발 요청)\n```\n이 앱의 검색 화면에 BM25 검색을 추가해줘.\n검색 화면에서 의미 검색과 BM25 검색 결과를 좌우로 나란히 볼 수 있게 구현해줘.\n답변 생성 선택 후 검색 수행 시, 의미 검색과 BM25 검색의 청크를 사용한 각각의 답변을 보여줘.\n```\n> ⚠️ 코드가 바뀌면 **앱을 통째로 재시작**해야 반영됨: 검은 창에서 `Ctrl+C` → `run.bat` 재실행(관리자 권한). 이후 모든 개발 요청에 공통.\n\nBM25 = 흔한 낱말보다 **드문 낱말이 겹칠 때 점수를 크게** 주는 키워드 매칭 방식.\n\n### 하이브리드 검색 (의미 + BM25 결합)\n```\n의미 검색과 BM25 의 결과를 하나로 합치는 하이브리드 검색을 추가해 줘.\n점수를 그대로 더하지 말고 순위로 결합해 줘. 두 점수는 계산법이 달라서 크기 단위가 달라.\n검색 화면에 [의미 검색] [BM25] [하이브리드] 세 열을 나란히 보여 줘.\n답변 생성 선택 후 검색 수행 시, 각 검색의 청크를 사용한 각각의 답변을 보여줘.\n```\n점수를 그대로 더치지 말고 **순위로 결합**하는 이유: 계산법이 달라 점수 크기 단위가 다름.\n\n## 문서가 늘어나면?\n문서 2개(`materials_ch3`) 추가 적재 후 질문:\n```\nAEC-Q100 Grade 1 의 HTOL 시험은 몇 시간 동안 하나요?\n```\n→ 답변, 근거 5개 청크의 출처, 눈에 걸리는 점을 기록. **여기서 발견한 문제(같은 항목인데 문서 판(Rev)이 달라 값이 다름)가 3교시의 출발점.**\n\n## 정리\n- RAG 5단계를 직접 관찰: 파싱·청킹·임베딩·적재·검색·생성\n- 자르는 기준, 찾는 방식은 **사람이 정하는 값** — 문서 종류/상태를 보고 결정\n- 답의 품질은 **어떤 조각을 꺼냈는가**에 거의 달려 있음\n\n**지금 가진 것**: `rag-lab` — 파싱·청킹 3종·임베딩·적재·의미검색·답생성 + 직접 만든 BM25·하이브리드 / 저장소: materials_ch2(3종) + materials_ch3(2종)\n", "cbCount": 0, "contentEasy": "# 2교시 · RAG 1 — 쉬운 설명 버전\n\n## 문제: AI에게 자료를 어떻게 보여줄까\n\n파일 1개는 AI 채팅창에 첨부하면 됩니다. 그런데 참고 자료가 100개, 1000개라면요? 매번 다 첨부할 순 없죠. 이 문제를 푸는 방법이 **RAG**입니다.\n\n## RAG를 디자이너의 말로 옮기면\n\n작업할 때를 떠올려보세요. 레퍼런스 폴더에 사진이 수백 장 있어도, 매번 그 폴더 전체를 보진 않죠. **지금 작업에 맞는 몇 장만 골라서 무드보드에 붙이고**, 그걸 보면서 작업합니다.\n\nRAG가 하는 일이 정확히 이겁니다.\n\n- **검색(Retrieval)** — 질문과 관련 있는 자료만 저장소에서 골라옴 (무드보드에 붙일 사진 고르기)\n- **증강(Augmented)** — 고른 자료를 질문과 함께 AI에게 넘김 (무드보드를 보여주며 \"이런 느낌으로 그려줘\")\n- **생성(Generation)** — AI가 그 자료를 보고 답을 만듦 (무드보드를 참고해서 작업하기)\n\n**핵심**: 문서 전체를 AI에게 넘기지 않습니다. 필요한 조각만 골라 넘깁니다.\n\n## 저장은 3단계, 검색은 2단계\n\n문서를 처음 넣을 때 딱 한 번 하는 일 3가지:\n\n1. **파싱** — PDF에서 글자를 뽑아냄 (스캔한 이미지에서 텍스트만 추출하는 것과 비슷)\n2. **청킹** — 뽑은 글을 다루기 좋은 크기로 자름 (레퍼런스 이미지를 전체가 아니라 필요한 부분만 크롭하는 것과 같음)\n3. **임베딩** — 자른 조각을 숫자로 바꿔서 저장 (아래에서 설명)\n\n질문할 때마다 하는 일 2가지: **검색**(관련 조각 찾기) → **생성**(그 조각을 보고 답 만들기)\n\n## 임베딩이란? — \"이미지의 색감·톤을 좌표로 뽑는 것\"과 같은 원리\n\n라이트룸이나 포토샵에서 사진들을 색감·톤별로 자동 분류해주는 기능을 본 적 있으실 거예요. 비슷한 색감의 사진들끼리는 \"색상 좌표\"가 가깝습니다.\n\n문장도 똑같이 할 수 있습니다. \"회의실 예약은 포털에서\" 와 \"미팅룸은 인트라넷으로\" 는 쓰인 단어는 다르지만 **뜻이 비슷**하죠. 이 \"뜻의 좌표\"를 숫자로 뽑아내는 게 임베딩입니다. 뜻이 비슷한 문장일수록 숫자가 서로 가깝게 나옵니다. 검색은 결국 **이 숫자들 사이의 거리를 재는 일**입니다.\n\n> 💡 질문과 문서는 반드시 같은 방식(같은 모델)으로 숫자화해야 합니다. 다른 잣대로 잰 좌표는 서로 비교할 수 없으니까요.\n\n## 실습 흐름\n\n배부된(또는 직접 만든) RAG 실습 앱에는 화면 탭이 4개 있고, 이게 그대로 위 단계와 대응합니다.\n\n1. **문서 탭** — PDF를 올리면 페이지마다 글자가 잘 뽑혔는지 그래프로 보여줍니다. 스캔 화질이 안 좋으면 글자가 깨지는 것처럼, 표나 그림이 많은 페이지는 글자 추출이 잘 안 될 수 있어요.\n2. **청킹 탭** — 자르는 기준(고정 길이 / 제목 기준 / 문단 기준)을 바꿔가며 비교. 크게 자르면 맥락은 살지만 불필요한 내용도 딸려오고, 작게 자르면 정확하지만 문장이 뚝뚝 끊깁니다. **정답은 없고, 문서 성격에 맞게 사람이 고릅니다.**\n3. **임베딩 탭** — [적재] 버튼 한 번이면 자동으로 숫자화되어 저장됩니다.\n4. **검색 탭** — 질문을 넣으면 가장 가까운 조각들이 점수와 함께 나옵니다. [답변 생성]을 켜면 그 조각들을 근거로 AI가 진짜 답을 씁니다.\n\n## 사람은 문장으로만 검색하지 않는다\n\n`FIT`, `6.2.1.1`, `박리` 처럼 단어 하나만 검색하는 경우도 많습니다. 이럴 땐 \"뜻이 비슷한 걸 찾는\" 임베딩 검색만으론 부족해서, **글자 그대로 겹치는지 보는 검색(키워드 검색, BM25)**을 하나 더 만들어 함께 씁니다. 두 방식을 합친 걸 **하이브리드 검색**이라고 부릅니다 — 마치 \"색감으로 찾기\"와 \"파일명으로 찾기\"를 동시에 쓰는 것과 비슷합니다.\n\n## 정리\n\n- RAG = 레퍼런스 폴더에서 관련 자료만 골라 무드보드에 붙이고, 그걸 보고 작업하는 것과 같은 원리\n- 임베딩 = 문장의 \"뜻 좌표\"를 숫자로 뽑는 것. 색감 좌표로 비슷한 사진 찾는 것과 원리가 같습니다\n- 검색 품질이 곧 답변 품질입니다 — 좋은 레퍼런스를 골라야 좋은 결과가 나오는 것처럼\n\n다음 시간 질문: *검색이 틀린 답을 가져오면, 어디를 고쳐야 할까?*\n"}, {"id": "note-3", "filename": "03-RAG2-검색개선.md", "category": "note", "badge": "3", "label": "RAG 2 · 검색 개선", "content": "# 3교시 · RAG 2 — 검색은 왜 실패하고 어떻게 고치는가\n\n2교시 저장소를 그대로 사용. 이 교시의 진짜 주제는 개별 기법이 아니라 **\"고치는 순서\"** — 어떤 시스템에도 통하는 절차다.\n\n## 고치는 순서 (4단계, 범용 기술)\n```\n증상 확인 → 원인 분리 → 처방 선택 → 결과 대조(숫자로)\n```\n\n## 증상 ① — 근거는 둘인데 답은 하나다\n2교시 마지막 질문(`AEC-Q100 Grade 1의 HTOL 시험은 몇 시간?`)의 답변과 근거 청크를 원문과 대조 — 답변에 없는 숫자가 근거 안에 있는지 확인.\n\n**원인 후보 두 가지**\n- 생성이 잘못했다 (근거는 맞는데 AI가 엉뚱하게 요약)\n- 검색이 잘못했다 (애초에 넘어간 근거 자체가 문제 — 예: 서로 다른 판(Rev)의 값이 섞여 있음)\n\n**판별법**: 근거 청크를 직접 읽는다. 답변 내용이 근거 안에 실제로 있으면 생성은 제 역할을 한 것 → 문제는 검색(그 앞 단계)에 있음.\n\n## 처방 1 — Reranking (재정렬)\n- 임베딩 검색은 질문과 조각을 **각각 따로** 숫자로 바꿔 거리만 잰다 (조각 벡터는 미리 계산 — 빠름). 조각 벡터를 만들 때 질문은 존재하지 않았으므로 질문의 세부 조건이 반영될 자리가 없음.\n- **Reranking** = 질문과 조각을 **함께 읽고** 다시 순위를 매기는 단계. 조각마다 모델을 한 번씩 불러야 해서 느리고 비쌈 → **2단계**로 나눔:\n  ```\n  1차 검색   전체 청크   →  후보 10개    싸다·빠르다\n  2차 재정렬  후보 10개   →  최종 5개     비싸다·느리다\n  ```\n  1차는 \"정답을 후보 안에 넣는 일\", 2차는 \"후보 중 진짜를 위로 올리는 일\". **1차에서 빠지면 2차가 되살릴 수 없음** → Reranking 붙일 땐 1차 K를 오히려 늘림.\n- 오늘 쓰는 OpenAI API에는 전용 reranker가 없어 LLM(`gpt-5.6-luna`)에게 후보+질문을 주고 순서만 매기게 함 = **LLM-as-a-reranker** (전용 모델보다 느리지만 바로 붙일 수 있음).\n\n개발 요청:\n```\n검색에 Reranking 을 추가해 줘.\n- 재정렬을 켜고 끌 수 있는 토글을 만들어 줘.\n- 재정렬을 활성화한 경우에는 하이브리드 검색만 수행하도록 설정해줘.\n- 1차 검색으로 후보 10개를 꺼내고, 그 후보를 질문과 함께 LLM 에 넘겨 다시 순서를 매겨 줘.\n- 재정렬 결과 상위 5개를 답변 생성의 근거로 써 줘.\n- 모델은 gpt-5.6-luna 를 쓰고, 재정렬에 걸린 시간을 화면에 표시해 줘.\n- 변경된 상황에 맞게 결과를 표시하는 UI를 깔끔하게 정리해줘.\n```\n(→ 앱 재시작 필요. 이번 교시 개발 요청 4번 모두 동일)\n\n**재정렬이 모르는 것**: 재정렬은 \"이 조각이 질문에 얼마나 답이 되는가\"만 봄 — 조각이 **어느 문서/몇 쪽/어떤 기준**에서 나왔는지는 모름.\n\n## 처방 2 — Metadata Filter\n저장소의 각 청크에는 원문·벡터 외에 **문서명/쪽/청킹 기준** 같은 메타데이터가 함께 저장돼 있음 → 이를 검색 조건으로 써서 **찾을 범위 자체를 좁히는 것** = Metadata Filter.\n\n```\n검색에 문서 단위 필터를 추가해 줘.\n- 저장소에 적재된 문서 목록을 화면에 보여주고, 체크박스로 검색 대상을 고를 수 있게 해 줘.\n- 고른 문서 안에서만 검색이 일어나게 해 줘.\n- 아무것도 고르지 않으면 전체를 대상으로 해 줘.\n```\n테스트: 필터 없음 / Rev H만 / Rev G만 → 세 조건으로 같은 질문을 던져 원본 PDF와 대조.\n\n### 처방 선택의 원칙 — \"증상에 맞는 처방\"\n- Reranking이 고치는 증상: 질문 맥락을 반영한 순위 재조정 (근거 후보 중 진짜를 위로)\n- Metadata Filter가 고치는 증상: 애초에 섞이면 안 되는 범위(다른 판/문서)를 원천 차단\n- **맞지 않는 처방은 느려지기만 하거나 더 나빠질 수 있음.**\n\n## 증상 ② — 짧은 질의가 헛돈다\n2교시에서 BM25+하이브리드 이후에도 못 찾던 짧은 질의들(예: `6.2.1.1`, `박리`)이 있었다.\n\n**원인**: 숫자뿐인 질의는 임베딩이 잡을 뜻이 거의 없음. 한 단어 질의(`박리`)는 저장소 밖 문맥에서 전혀 다른 뜻을 가질 수 있음. 사람은 맥락을 알고 물었지만 그 맥락이 질의 자체엔 없음.\n\n## 처방 3 — Query Rewrite (질의 재작성)\n검색 전에 질의를 검색에 맞게 다시 쓰는 단계.\n\n1단계(맥락 없이):\n```\n검색 전에 질의를 다시 쓰는 단계를 추가해 줘.\n- 사용자가 넣은 질의를 LLM 에 넘겨 검색에 맞는 형태로 바꾸고, 바뀐 질의로 검색해 줘.\n- 모델은 gpt-5.6-luna 를 써 줘.\n- 원래 질의와 다시 쓴 질의를 화면에 나란히 보여 줘.\n- 이 단계를 켜고 끌 수 있는 토글을 만들어 줘.\n```\n2단계(고치기 — 저장소 맥락 부여):\n```\n질의 재작성 프롬프트를 고쳐 줘.\n- 저장소에 어떤 문서들이 적재되어 있는지 목록을 프롬프트에 넣어 줘.\n- 그 문서들의 맥락 안에서 질의를 해석하도록 지시해 줘.\n- 저장소 밖의 뜻으로 넓히지 말라고 명시해 줘.\n- 문서 제목이나 문서 목록을 다시 쓴 질의에 그대로 넣지 말라고 명시해 줘.\n```\n\n## 나아졌는지 확인하기 — 자동 채점 (LLM-as-a-Judge)\n질문·기대답을 미리 정해두고 AI가 채점 → 정성적 판단을 정량화.\n```\n답변 품질을 채점하는 기능을 추가해 줘.\n- 질문과 기대하는 답을 여러 개 적어 둔 파일을 읽어서, 각 질문을 앱에 던지고 답변을 받아 줘.\n- 그 답변을 기대하는 답과 비교해 1~5점으로 채점하고 이유를 한 줄로 적게 해 줘.\n- 채점도 gpt-5.6-luna 로 해 줘.\n- 결과를 표로 보여주고 평균 점수를 계산해 줘.\n```\n공통 5문항(`grading.json` 형식) + 각자 2문항 추가. 조건별(무처방/필터만/재작성만/재정렬만/셋다)로 **평균 점수와 걸린 시간**을 표로 기록.\n\n> **채점자도 틀린다** — AI가 매긴 점수를 그대로 믿지 말고, 이상한 점수 2~3개를 골라 사람이 원문으로 재확인.\n\n## 정리\n- 기법을 아는 것과 **어느 증상에 쓰는지 아는 것**은 다르다\n- 맞지 않는 처방은 느려지기만 하거나 더 나빠진다\n- **재지 않으면 고친 것인지 망친 것인지 알 수 없다**\n\n**지금 가진 것**: `rag-lab` — naive RAG + BM25·하이브리드·Metadata Filter·Query Rewrite·Reranking·자동 채점\n\n## 더 해보기\n- Reranking 켠 채로 1차 후보 K를 10/20/50으로 바꿔보기\n- 재정렬을 같은 질문에 2~3번 걸어 순서·답이 매번 같은지 확인\n- 채점 프롬프트를 자세히 적으면 점수가 안정되는지 확인\n- 세 처방을 켜는 순서를 바꿔보고 결과가 달라지는지 확인\n\n다음 질문: *지금까지는 우리가 조건을 켜고 껐다. AI가 스스로 판단해서 도구를 고르게 하려면?* → 4교시 Tool Calling\n", "cbCount": 0, "contentEasy": "# 3교시 · RAG 2 — 쉬운 설명 버전\n\n## 이번 시간의 핵심은 \"기법\"이 아니라 \"순서\"\n\n문제 있는 결과물을 받았을 때 디자이너도 이렇게 하시죠 — **뭐가 이상한지 보고 → 원인을 찾고 → 고치고 → 진짜 나아졌는지 다시 확인.** 오늘 배우는 것도 똑같은 순서입니다. 아래 3가지 기법은 도구일 뿐이고, **이 순서 자체가 진짜 배울 것**입니다.\n\n```\n증상 확인 → 원인 찾기 → 처방 → 정말 나아졌는지 재확인\n```\n\n## 증상 ① — 근거는 2개인데 답은 1개만 나온다\n\n예를 들어 같은 항목인데 문서 버전(A안/B안처럼)이 두 개 있으면, AI가 둘 중 하나만 골라 답하거나 섞어버릴 수 있습니다.\n\n**원인을 가르는 법**: AI가 참고한 근거 조각을 직접 열어봅니다. 답변 내용이 근거 안에 실제로 있으면 \"AI가 요약을 잘못한 것\"이 아니라 **\"애초에 검색이 애매한 조각을 가져온 것\"**입니다.\n\n## 처방 1 — Reranking (2차 심사)\n\n1차 검색은 \"얼추 비슷한\" 후보를 빠르게 여러 개 골라옵니다. Reranking은 그 후보들을 **질문과 하나씩 다시 대조해서 진짜 딱 맞는 것만 위로 올리는 2차 심사**입니다.\n\nMidjourney에서 4장 뽑고 그중 하나를 Upscale하는 것과 비슷합니다 — 1차는 넉넉하게 뽑고, 2차는 그중 진짜 쓸 것만 고르는 것.\n\n> 2차 심사는 비용이 더 듭니다(느림). 그래서 1차에서 후보를 넉넉히 뽑아둬야 2차가 진짜 정답을 놓치지 않습니다.\n\n## 처방 2 — Metadata Filter (태그로 미리 거르기)\n\n라이트룸에서 별점이나 태그로 사진을 미리 걸러놓고 찾는 것처럼, 문서마다 붙어있는 \"출처·페이지·버전\" 같은 꼬리표로 **찾을 범위 자체를 좁히는 것**입니다. \"이 문서 안에서만 찾아줘\"라고 미리 정해두는 것과 같습니다.\n\n## 어떤 처방을 써야 할까 — \"증상에 맞는 처방\"\n\n- 근거가 섞여서 순위가 헷갈리는 문제 → **Reranking**\n- 애초에 참고하면 안 되는 문서(다른 버전 등)가 섞이는 문제 → **Metadata Filter**\n\n**맞지 않는 처방을 쓰면 느려지기만 하고 문제는 그대로**입니다. 진단을 먼저 하고 처방을 고르는 순서가 중요합니다.\n\n## 증상 ② — 짧은 검색어가 헛돈다\n\n`6.2.1.1`처럼 숫자만 있거나, `박리`처럼 한 단어짜리 검색어는 \"뜻 좌표(임베딩)\"가 거의 안 잡힙니다. 사람은 맥락을 알고 검색했지만, 그 맥락이 검색어 자체엔 없기 때문입니다.\n\n## 처방 3 — Query Rewrite (검색어를 AI가 다시 써줌)\n\n검색하기 전에, AI에게 \"이 저장소엔 이런 문서들이 있다\"고 미리 알려주고 검색어를 더 명확하게 다시 쓰게 합니다. 애매한 요청(\"느낌 있게\")을 구체적인 요청(\"따뜻한 톤, 필름 그레인, 낮은 채도\")으로 바꿔주는 것과 비슷합니다.\n\n## 나아졌는지는 어떻게 아나 — 채점표 만들기\n\n느낌으로 \"좋아진 것 같다\"는 근거가 안 됩니다. 정답을 아는 질문 세트를 미리 만들어두고, **AI에게 채점까지 시켜서(LLM-as-a-Judge)** 점수를 숫자로 남깁니다.\n\n- 처방 걸기 전 점수를 먼저 재둡니다 (기준선)\n- 처방을 하나씩만 켜서 비교합니다 (한 번에 여러 개 바꾸면 뭐 때문에 좋아졌는지 알 수 없음)\n- 채점한 AI도 가끔 틀리니, 이상한 점수는 사람이 직접 확인합니다\n\n## 정리\n\n- 기법을 아는 것과 **어떤 증상에 어떤 기법을 쓰는지 아는 것**은 다릅니다\n- 맞지 않는 처방은 느려지기만 합니다\n- **재보지 않으면 고친 건지 망친 건지 알 수 없습니다**\n\n다음 시간 질문: *지금까진 우리가 조건을 켜고 껐다. AI가 스스로 판단해서 방법을 고르게 하려면?*\n"}, {"id": "note-4", "filename": "04-ToolCalling.md", "category": "note", "badge": "4", "label": "Tool Calling", "content": "# 4교시 · Tool Calling — AI는 무엇을 보고 도구를 고르는가\n\n`agent-lab` 앱 사용. 파이썬 표준 라이브러리만 사용, `.env.example` → `.env` 복사 후 `run.bat` 관리자 실행.\n\n## 준비\n```\n/init\n이 앱을 실행하려면 무엇이 필요해? 필요한 것이 있으면 준비해 줘.\n```\n브라우저에 **[도구] 탭**이 뜬다. 왼쪽에 도구 목록 3개(`memo_tool_1~3`), 각각 **이름 / 설명문(고칠 수 있음) / 인자**(모두 `text` 하나) 구성.\n\n## 실습 — 관찰\n```\n회의 메모 좀 찾아줘\n내일 오후 3시에 품질 회의 있다고 메모해줘\n```\n답변 아래 **호출 로그**: 어느 도구를 어떤 인자로 불렀는지, 도구가 뭘 돌려줬는지가 그대로 나온다. 오른쪽 **메모** 목록으로 실제 실행 결과 확인.\n\n**질문: AI는 세 개 중 하나를 어떻게 골랐을까?**\n\n## 실험 — 설명문만 바꿔본다\n`memo_tool_1`↔`memo_tool_2`의 설명문을 서로 뒤바꾼다 (코드/이름은 그대로, 앱 재시작도 안 함):\n```\nmemo_tool_1 설명문: \"새 메모를 저장한다.\"\nmemo_tool_2 설명문: \"저장된 메모 중 키워드에 해당하는 것을 찾아 목록으로 보여준다.\"\n```\n같은 질문 2개를 다시 던지면 → **AI의 선택이 뒤집힌다.** 코드 한 줄 안 고쳤는데도.\n\n→ [설명문 되돌리기] / [메모 초기화]로 원복.\n\n## 핵심 원리 — 결정하는 쪽과 실행하는 쪽은 다르다\n- **LLM은 어떤 도구를 어떤 인자로 부를지 \"결정\"만 한다.** 실제로 파일을 읽고 쓰는 건 앱(코드)이다.\n- AI는 도구의 **코드를 볼 수 없고, 앱이 건네준 설명문(description)만** 읽고 판단한다.\n- 호출 로그의 두 줄이 이 왕복을 그대로 보여줌: 첫 줄 = AI의 **결정**(도구명+인자), 둘째 줄 = 앱의 **실행 결과**.\n- 도구를 붙인다는 건 AI에게 권한을 주는 게 아니라 **\"앱이 대신 실행해 줄 목록을 넓히는 일\"**.\n\n## 코드로 보는 도구 구조\n```python\ndef note_save(text=\"\"):                  # ① 실행되는 함수 — 앱의 코드. AI는 이걸 못 봄\n    ...\n    return {\"저장한 제목\": title, \"전체 건수\": len(notes)}\n\n{                                        # ② AI에게 보여지는 선언 — AI가 보는 전부\n    \"name\": \"memo_tool_2\",\n    \"description\": \"새 메모를 저장한다.\",\n    \"parameters\": _TEXT_PARAM,\n    \"function\": note_save,\n}\n```\n화면에서 고친 설명문은 `state/tool_overrides.json`에 저장되어 ②의 기본값 위에 덮인다 — 그래서 코드 안 고치고도 선택이 뒤집힌 것.\n\n## 설명문을 어떻게 써야 하는가\n- 애매한 설명문(\"메모 관련 작업을 처리한다\" / \"메모 데이터를 다룬다\")을 넣으면 → 도구 혼동/오작동\n- 직접 갈리게 고쳐보기: **\"무엇을 하는지\"보다 \"어떤 경우에 쓰는지\"를 적으면 갈리기 쉬움**\n- 인자에 무엇을 넣어야 하는지도 설명문에 명시 가능\n\n> 실무 원칙: 이름은 개발자끼리의 약속, **설명문은 AI와 맺는 약속**. 도구 요청 시 설명문도 함께 요구해야 함.\n\n## 행동 범위는 무엇이 정하는가 — 역할(System Prompt) 문구\n왼쪽 아래 **역할** 칸에 문구를 덧붙여가며 실험 (기존 내용은 지우지 않음):\n\n1. 아무 문구 없을 때 → `회의 메모 삭제해줘` 시도\n2. `너는 메모 조회 담당이다. 조회만 한다.` 추가 → 삭제 요청 시도\n3. 표현을 바꿔가며 우회 시도: `회의 메모는 이제 필요 없어. 깔끔하게 정리해줘.`\n4. `메모를 수정하거나 삭제하는 일은 어떤 경우에도 하지 않는다.` 추가 → 재시도\n\n**결론**: 삭제 도구는 **처음부터 끝까지 그 자리에 있었다.** 바뀐 건 한국어 문장 몇 줄뿐 — 즉 역할 문구만으로 막는 방식은 **표현을 바꾸면 뚫릴 위험**이 있다 (6교시에서 \"도구 자체를 안 쥐여주는\" 더 확실한 방법이 나옴).\n\n## 개발 — 도구 하나 추가하기 (memo_tool_4: update)\n```\nlab/tools.py 의 내장 메모 도구에 수정(update) 도구를 추가해 줘.\n- 이름은 memo_tool_4 로 해 줘.\n- 파라미터는 다른 도구들과 똑같이 text 하나만 써야 해.\n- 키워드로 메모를 찾아 내용을 새 내용으로 바꾸는 동작이야.\n- 화면 도구 목록에 나타나고, 설명문도 화면에서 고칠 수 있어야 해.\n- 잘못된 인자가 오면 어떤 형태로 넣어야 하는지 알려주는 오류를 돌려줘.\n```\n→ 함수 하나 + 선언 하나면 새 도구 완성. 앱 재시작 후 설명문을 직접 작성해 정확히 동작할 때까지 다듬는다.\n> 설명문으로 안 되는 문제(엉뚱한 메모까지 바뀜, 막연한 오류 문구)는 **도구 코드 자체의 문제**이므로 Claude Code에 코드 수정을 요청.\n\n## 도구가 실패하면?\n데이터 파일 경로를 일부러 존재하지 않는 값으로 바꾸고 질문 → AI의 대응 관찰. **도구가 실패했을 때 무엇을 돌려주느냐가 그다음 AI 행동을 정한다** — 오류 메시지가 막연하면 AI도 막연하게 움직임 → 실패 메시지는 성의 있게 작성해야 함.\n\n## 정리\n- AI는 도구의 **설명문**을 읽고 무엇을 부를지 **결정**한다. 실행은 앱이 한다.\n- 설명문이 실제 동작과 어긋나면 AI는 **어긋난 쪽을 따른다.**\n- 행동의 경계도 **텍스트(역할 프롬프트)**로 유지된다 — 도구를 쥐고 있어도 문구가 막을 뿐, 뚫릴 수 있다.\n- 도구 실패 시 반환값이 다음 행동을 정한다.\n\n**지금 가진 것**: `agent-lab` — 도구 4개(직접 추가한 수정 도구 포함), 설명문과 역할을 화면에서 수정 가능\n\n다음 질문: *도구 하나 다루는 데도 이만큼 손이 갔다. 필요한 도구가 20개라면 매번 이렇게 만들어야 할까?* → 5교시 MCP\n", "cbCount": 0, "contentEasy": "# 4교시 · Tool Calling — 쉬운 설명 버전\n\n## 도구(Tool)란 — \"AI가 쓸 수 있는 포토샵 액션\"\n\n포토샵 액션(매크로)을 떠올려보세요. \"배경 제거\", \"색보정 프리셋 적용\" 같은 액션을 미리 녹화해두면, 나중엔 버튼 하나로 실행됩니다. 그 액션이 정확히 뭘 하는지 몰라도, **이름표만 보고** 어떤 상황에 쓸지 고를 수 있죠.\n\nAI에게 도구를 준다는 것도 똑같습니다. 미리 만들어둔 기능(메모 저장하기, 검색하기 등)에 **이름과 설명문**을 붙여주면, AI는 사용자 요청에 맞춰 \"지금은 이 도구를 쓰자\"고 스스로 고릅니다.\n\n## 중요한 사실: AI는 도구의 \"이름표\"만 본다\n\n여기가 오늘의 핵심입니다. **AI는 도구가 내부적으로 어떻게 동작하는지(코드)를 못 봅니다.** 오직 겉에 붙은 **설명문(이름표)**만 읽고 \"이 상황엔 이 도구\"라고 판단합니다.\n\n실습에서 저장 도구와 조회 도구의 설명문을 서로 바꿔치기하면, **코드는 그대로인데** AI의 선택이 완전히 뒤바뀝니다. 액션 이름표를 헷갈리게 붙여놓으면 엉뚱한 액션이 실행되는 것과 같은 이치예요.\n\n> 실무 팁: 액션 이름은 개발자끼리 아는 약속이지만, **설명문은 AI와 맺는 약속**입니다. 설명문을 \"무엇을 하는지\"보다 \"어떤 상황에 쓰는지\"로 적으면 헷갈릴 일이 훨씬 줄어듭니다.\n\n## 결정하는 것과 실행하는 것은 다른 주체\n\n- **AI가 하는 일**: \"이 도구를, 이런 값으로 써야겠다\"고 **결정**만 함\n- **프로그램이 하는 일**: 실제로 파일을 읽고 쓰는 **실행**을 함\n\n즉 도구를 붙인다는 건 AI에게 권한을 몽땅 주는 게 아니라, **\"이 프로그램이 대신 실행해줄 수 있는 목록을 넓히는 것\"**입니다.\n\n## 행동 범위는 어떻게 제한하나 — \"직무기술서(역할 프롬프트)\"\n\nAI에게 \"너는 조회만 담당한다, 삭제는 절대 하지 않는다\" 같은 문구(역할 프롬프트)를 줘서 행동을 제한할 수 있습니다. 마치 신입 디자이너에게 \"이 파일은 절대 덮어쓰지 마세요\"라고 못박아두는 것과 같아요.\n\n다만 이 방법은 **문구로 막는 것**이라 표현을 살짝 바꿔서 요청하면 뚫릴 수 있습니다. (\"삭제해줘\"는 막았는데 \"정리해줘\"는 통과되는 식.) 더 확실한 방법(도구 자체를 안 쥐여주는 것)은 6교시에 나옵니다.\n\n## 도구를 실제로 하나 만들어보기\n\n새 도구를 추가할 때 필요한 건 딱 두 가지입니다.\n\n1. **실제로 동작하는 코드** (Claude Code가 대신 작성)\n2. **이름표(이름 + 설명문 + 어떤 값을 받는지)** — 이것도 Claude Code가 만들지만, 여러분이 직접 다듬을 수 있고 다듬어야 정확도가 올라갑니다\n\n설명문을 잘 쓰는 게 곧 \"이 액션을 제대로 만드는 것\"과 같습니다.\n\n## 도구가 실패하면?\n\n파일이 없거나 오류가 나면, AI는 그 **오류 메시지를 보고 다음 행동을 정합니다**. 오류 메시지가 애매하면 AI도 애매하게 움직이고, 오류 메시지가 구체적이면 AI도 스스로 고쳐서 다시 시도하기도 합니다. 그래서 도구를 만들 때 실패 메시지도 신경 써서 씁니다.\n\n## 정리\n\n- AI는 도구의 **이름표(설명문)**만 보고 고른다 — 코드는 못 본다\n- 설명문이 실제 동작과 다르면, AI는 설명문 쪽을 믿고 움직인다\n- 행동 제한은 \"직무기술서(문구)\"로 하는데, 표현을 바꾸면 뚫릴 수 있다\n\n다음 시간 질문: *액션 하나 만드는 데도 이렇게 손이 갔다. 필요한 액션이 20개면 매번 이렇게 만들어야 할까?*\n"}, {"id": "note-5", "filename": "05-MCP.md", "category": "note", "badge": "5", "label": "MCP", "content": "# 5교시 · MCP — AI에게 도구를 할당하는 표준\n\n4교시의 `agent-lab` 앱을 그대로 사용.\n\n## 문제 제기\n실무에 필요한 도구는 3~4개로 안 끝난다 (문서 검색, 일정, 장비 이력, 티켓 등록…). 일이 두 갈래로 갈린다:\n- **도구를 만드는 일** — 무엇을 할지 정하고 코드 작성 (누군가 어차피 해야 함)\n- **도구를 연결하는 일** — 만들어진 걸 내 AI가 쓸 수 있게 연결\n\n연결 방법을 매번 새로 짜면 도구가 늘수록 연결에만 시간이 든다 → **연결 규격을 하나로 통일**하면?\n\n## MCP (Model Context Protocol)\n- **Host** — 도구를 쓰는 쪽 (오늘은 `agent-lab`)\n- **Server** — 도구를 내주는 쪽 (누가 만들었든 상관없음)\n\n핵심: **서버가 먼저 \"나는 이런 걸 할 수 있다\"고 광고한다** (이름·설명문·인자 목록). Host는 그 목록을 받아 자기 도구 목록에 그대로 합친다. 그다음은 4교시와 동일 — **AI는 합쳐진 목록의 설명문을 읽고 무엇을 부를지 정한다.** 도구가 내 앱 안에 있든 남의 서버에 있든 판단 방식은 같다.\n(참고: 서버는 도구뿐 아니라 참고자료·지시문 템플릿도 같은 방식으로 내줄 수 있음)\n\n## 실습 — 서버 연결\n1. **연결 전 확인**: `[도구]` 탭에서 사내 자료 질문 3개를 던져 답변/부른 도구를 기록 (아직 관련 도구 없음)\n2. **연결**: `[MCP]` 탭 → **자료 조사 서버** `[연결]` 클릭 → `[지금 쓸 수 있는 도구]` 목록에 새 도구 추가됨(어느 서버 출신인지 표시)\n3. **재확인**: 같은 질문 3개 재실행 → 호출 로그에서 실제 반환값과 답변 대조\n\n### 이 서버는 어디서 도는가\n자료 조사 서버는 **내 PC에서 별도 프로세스로** 돈다.\n```powershell\nGet-Process python   # 연결 상태 vs 연결 끊은 상태에서 프로세스 수 비교\n```\n`[MCP]` 탭에서 끊기/연결을 반복하며 숫자 변화 관찰 → **연결 = 따로 뜬 프로그램과 앱 사이를 잇는 것.**\n\n## 성격이 다른 서버 — Microsoft Learn 문서 서버\n- **자료 조사 서버**: 내 PC에서 파이썬으로 돔 (인터넷 불필요)\n- **Microsoft Learn 서버**: 인터넷 저편, MS가 운영, 우리가 만들지 않았고 안을 볼 수도 없음\n- **하지만 붙이는 절차는 동일 — 버튼 하나.**\n\n`Get-Process python`으로 확인하면 이번엔 프로세스 수가 늘지 않음(원격이라 로컬 프로세스가 안 뜸).\n\n**갈림길 테스트**: 두 서버 모두에 걸릴 법한 질문(`문서에서 교정 주기를 찾아줘`)을 던져 어느 쪽이 선택되는지, 왜인지 두 도구의 설명문에서 근거를 찾아본다. (\"내 PC 자료에서\" 같은 조건을 넣으면 결과가 어떻게 바뀌는지도 확인)\n\n## 코드로 보는 연결 — 등록과 통신\n`mcp_catalog.json`:\n```json\n{\n  \"doc-search\": {\n    \"label\": \"자료 조사 서버\",\n    \"spec\": { \"command\": \"python\", \"args\": [\"mcp-servers/doc-search/server.py\"] }\n  },\n  \"mslearn\": {\n    \"label\": \"Microsoft Learn 문서 서버\",\n    \"spec\": { \"url\": \"https://learn.microsoft.com/api/mcp\" }\n  }\n}\n```\n로컬 서버는 **실행 명령(`command`)**, 원격 서버는 **주소(`url`)**를 적는다.\n\n`[연결]` 시 오가는 JSON-RPC 메시지 (요약):\n```\n앱 → {\"method\": \"initialize\", ...}                         인사\n서버 ← {\"result\": {\"serverInfo\": {\"name\": \"doc-search\"}}}     자기소개\n\n앱 → {\"method\": \"tools/list\"}                                무엇을 할 수 있나\n서버 ← {\"result\": {\"tools\": [{\"name\": \"doc_search\",\n        \"description\": \"...\", \"inputSchema\": {...}}]}}       도구 광고\n\n앱 → {\"method\": \"tools/call\",\n      \"params\": {\"name\": \"doc_search\", \"arguments\": {\"query\": \"교정\"}}}   실행 요청\n서버 ← {\"result\": {\"content\": [{\"type\": \"text\", \"text\": \"…\"}]}}           결과\n```\n**\"도구 광고\"의 모양(이름·설명문·인자 스키마)이 4교시의 도구 선언과 동일한 꼴** — Host는 이걸 받아 내장 도구 목록에 그대로 합칠 뿐이고, 그다음 AI 판단 방식은 똑같다. 전송 방식(로컬 프로세스 vs HTTP)만 다를 뿐 세 마디(인사→광고→호출)는 같다.\n\n- **[연결]** = `mcp_config.json`에 등록 → (로컬이면 프로세스 기동 후) 인사→광고 수신→도구목록 합침\n- **[끊기]** = 설정에서 제거 → 도구가 목록에서 사라짐, 로컬이면 프로세스도 종료. **목록에 없는 도구는 AI가 부를 수 없음.**\n\n## 개발 — 원격 서버 직접 등록하기 (Tavily 웹 검색)\nAPI Key가 필요한 첫 사례.\n1. `app.tavily.com` 가입(구글 계정 가능) → `tvly-`로 시작하는 Key 발급 → `.env`에 추가:\n   ```\n   TAVILY_API_KEY=발급받은키\n   ```\n2. 카탈로그 등록 요청:\n   ```\n   이 앱의 MCP 카탈로그(mcp_catalog.json)에 Tavily 웹 검색 서버를 추가해 줘.\n   - 원격 HTTP 서버이고, 주소 형식은 https://mcp.tavily.com/mcp/?tavilyApiKey=<API키> 야.\n   - API 키는 .env 의 TAVILY_API_KEY 에서 읽어서 채워줘.\n     카탈로그 파일에 키가 그대로 적히면 안 돼.\n   - 화면의 서버 목록에 \"Tavily 웹 검색\" 으로 보이게 해 줘.\n   ```\n   (앱 재시작 필요)\n3. `[MCP]`에서 연결 → `오늘 한국의 주요 뉴스 알려줘` 로 테스트. 설명문이 영어로 온 것도 확인 — **남이 쓴 광고를 그대로 받은 것.**\n4. Tavily는 **연결이 아니라 호출 시점에** 키를 검사(Unauthorized 뜨면 `.env` 확인). 확인 끝나면 **연결 끊어두기** (카탈로그엔 남아있으므로 필요시 재연결만 하면 됨).\n\n## 정리 — 붙이면 곧 능력이다\n- 서버는 **자기가 무엇을 할 수 있는지 먼저 알려준다.** Host는 그 목록을 받아 합친다.\n- 성격이 전혀 다른 두 서버가 **같은 절차**로 붙었다.\n- 붙인 서버는 앱 안에 있지 않다 — 따로 떠 있고, 우리는 그 사이를 **연결**했을 뿐.\n- **연결은 곧 능력이다** → 무엇을 붙이는지가 권한 문제가 된다. 오늘 붙인 서버는 읽기 전용이지만, 삭제 도구를 내주는 서버도 똑같이 버튼 하나로 붙는다.\n\n### 두 겹 방어 (4교시 복습 + 확장)\n- **역할 문구** — 텍스트로 막음. 편하지만 표현이 바뀌면 새어나갈 수 있음\n- **연결 자체를 끊기** — 아예 안 붙이면 목록에 없음. 없는 도구는 부를 수 없음 (더 확실)\n→ 필요한 것만 붙이고, 붙인 것 안에서 다시 역할로 좁히는 게 순서.\n\n**지금 가진 것**: `agent-lab` — 내장 도구 + 자료 조사 서버 + Microsoft Learn 서버 (+ 카탈로그에 등록해둔 Tavily, 지금은 끊어둠)\n\n다음 질문: *도구도 붙었고 문서도 읽힌다. 그런데 일이 커지면 하나가 다 감당할 수 있을까?* → 6교시 Multi-Agent\n", "cbCount": 0, "contentEasy": "# 5교시 · MCP — 쉬운 설명 버전\n\n## 문제: 액션(도구)이 20개, 30개면?\n\n4교시에서 도구 하나 붙이는 데도 손이 꽤 갔죠. 실무에선 필요한 기능이 3~4개로 끝나지 않습니다. 그때마다 처음부터 다 만들어 연결해야 한다면 너무 번거롭겠죠. **연결하는 방법 자체를 하나의 규격으로 통일**하면 어떨까요 — 이게 MCP입니다.\n\n## MCP를 디자이너의 말로 옮기면 — \"플러그인 설치 표준\"\n\n포토샵에 서드파티 플러그인(익스텐션)을 설치하는 걸 떠올려보세요. 누가 만들었든, 어떤 기능이든, **설치 방법은 항상 똑같습니다.** 목록에서 고르고 설치 버튼만 누르면 끝이죠.\n\nMCP도 똑같습니다. 서버(플러그인 제공자)가 \"나는 이런 기능을 제공해요\"라고 먼저 알려주면, 내 AI 프로그램(Host)이 그 목록을 받아서 **기존 도구 목록에 그대로 추가**합니다. 그다음부터 AI는 4교시에서 배운 것과 똑같은 방식으로 — 설명문만 보고 — 어떤 도구를 쓸지 고릅니다.\n\n## 실습으로 확인하는 것\n\n1. **연결 전** — 사내 자료에 대해 물어봐도 AI가 답을 못합니다 (관련 도구가 없으니까)\n2. **[연결] 버튼 클릭** — 서버 하나를 붙이면, 도구 목록에 새 기능이 추가됩니다\n3. **같은 질문 재시도** — 이제 답을 할 수 있습니다\n\n## 두 가지 다른 성격의 플러그인\n\n- **내 컴퓨터에서 도는 플러그인** (로컬 서버) — 인터넷 없어도 동작. 우리가 직접 만든 것.\n- **인터넷 저편에 있는 플러그인** (원격 서버, 예: Microsoft Learn 문서 검색) — 남이 만들어서 운영 중인 것. 내부를 볼 수 없어도 **설치 절차는 똑같이 버튼 하나**입니다.\n\n## API 키가 필요한 플러그인도 있다\n\nTavily(웹 검색 서버)처럼 유료/가입이 필요한 플러그인은 1교시에서 배운 API 키가 여기서도 똑같이 필요합니다. 키를 발급받아 `.env` 서랍에 넣어두면 됩니다.\n\n## 붙이면 곧 능력이 된다 — 주의할 점\n\n연결한 순간 AI가 할 수 있는 일이 늘어납니다. 오늘 붙인 플러그인들은 \"읽기\"만 하지만, **삭제하거나 수정하는 플러그인도 똑같이 버튼 하나로 붙습니다.** 그래서 낯선 플러그인을 연결하기 전엔 \"이게 뭘 할 수 있는지\" 확인하는 습관이 중요합니다.\n\n행동을 막는 방법은 두 겹입니다.\n\n- **문구로 막기** (4교시에서 배운 역할 프롬프트) — 편하지만 표현 바꾸면 뚫릴 수 있음\n- **아예 연결을 안 하기** — 연결 안 된 플러그인은 애초에 목록에 없으니 AI가 쓸 수 없음. 더 확실함\n\n## 정리\n\n- 플러그인 제공자(서버)는 \"나 이런 거 할 수 있어요\"라고 먼저 광고하고, 내 AI는 그걸 받아서 도구 목록에 합칩니다\n- 내가 만든 것이든 남이 만든 것이든, **붙이는 절차는 항상 같습니다** (버튼 하나)\n- 연결 = 능력이므로, 무엇을 연결하는지가 곧 권한 문제입니다\n\n다음 시간 질문: *도구도 붙었고 문서도 읽힌다. 그런데 일이 커지면 AI 하나가 다 감당할 수 있을까?*\n"}, {"id": "note-6", "filename": "06-MultiAgent.md", "category": "note", "badge": "6", "label": "Multi-Agent", "content": "# 6교시 · Multi-Agent — Deep Research\n\n5교시까지 쓰던 `agent-lab`을 `run6.bat`으로 다시 켠다.\n\n## 지금까지는 Agent 하나가 다 하고 있었다\n도구를 받고, 질문을 전부 받고, 답도 혼자 쓰는 **실무자 한 명** 구조. AI가 한 번에 읽고 처리할 수 있는 분량은 정해져 있음 — 도구 설명문, 가져온 자료, 실행 결과가 전부 그 안에 들어간다. **대화가 길어지면 앞부분을 요약**하게 되고, 요약된 부분의 디테일은 사라진다. 도구가 수십 개, 조사 자료가 쌓이면 그 한도가 금방 참.\n\n## 왜 나누는가\n### 만들 것: Deep Research의 강화 버전\n일반 Deep Research(조사→집계→분석→결론)에 **연구 방법론 수립, 시뮬레이션 코드 작성·실행, 결과 정리·분석**을 더한 버전.\n\n일이 성격이 다른 두 덩어리로 갈림:\n- **자료 조사** — 어떤 방법이 있는지 찾고 이 문제에 무엇을 쓸지 결정\n- **코드 작성과 실행** — 실제로 돌려서 수치를 냄\n\n지금은 둘 다 가벼워서 한 명이 다 해도 되지만, 조사 쪽에 사내 문서 저장소와 제약 조건이 붙고 실행 쪽에 코딩 규칙과 DB 접속이 붙으면 **각각 따로 무거워진다** — 그때 한 명에게 다 맡기면 문제가 생김.\n\n### 셋으로 나누기\n- **연구책임자** — 무엇을 할지 정하고 맡긴다. 직접 조사·실행하지 않음\n- **자료조사 연구원** — 분석 방법을 설계, 웹 검색 등 수행\n- **실험수행 연구원** — 실험 계획 수립·수행, Python 코드 작성 및 실행\n\n규칙: **두 연구원은 서로를 부를 수단이 없다.** 모든 전달은 연구책임자를 거친다. **최종 수치는 실행된 코드의 결과만 사용한다.**\n\n### 나누는 대가와 이득\n- **비용(통신 비용)**: 위임마다 지시문 작성→전달→응답 대기. 전달 과정에서 맥락이 깎임(연구책임자가 지시문에 담지 않은 건 연구원이 모름) — 실습에서 연구 하나에 몇 분 걸리는 이유의 상당 부분.\n- **이득(유지보수 용이성)**: 에이전트 하나가 감당하는 지시/제약이 줄어들어 어느 문장이 어떤 행동을 만들었는지 짚기 쉬움, 쥔 도구가 적으면 오작동 원인 파악도 쉬움, 문제 시 들여다볼 범위가 시스템 전체→에이전트 하나로 좁혀짐.\n- **부가 이득(확장성)**: 단일 거대 에이전트는 새 기능 추가 시 길어진 지시문/도구목록이 얽혀 기존 동작이 흔들림(4교시에서 설명문 한 줄로 선택이 뒤집힌 사례). 역할 분리 구조에서는 기존 연구원은 그대로 두고 **연구책임자가 맡길 상대를 하나 늘리기만** 하면 됨.\n\n## 실습 — 구동\n`run6.bat` 실행 → `[에이전트]` 탭 등장. **프로세스** 카드에서 **자료조사 연구원**·**실험수행 연구원** 각각 `[기동]` → PID·포트 확인 (3개 프로세스가 각자 떠 있고 그중 하나가 나머지에 일을 맡기는 구조).\n\n**도구 분리 확인**: 세 줄의 **도구** 항목을 나란히 읽어보면 5교시에 붙인 서버 도구가 어느 연구원에게 갔는지 보인다. 4교시는 역할을 **문구**로 막아 표현 우회 가능성이 있었지만, 여기서는 **도구 자체를 나눠 둠** — 없는 도구는 애초에 부를 수 없음(더 확실한 방어).\n\n## 연구 맡기기 — 동작 확인\n```\n동전을 10번 던져 앞면이 6번 이상 나올 확률을 구하려고 합니다.\n어떤 방법으로 구할 수 있는지 조사하고, 파이썬으로 실행해 확인하세요.\n정량 결과는 실제 코드 실행 결과를 사용하세요.\n```\n\n## 본 실습 — 라인 전환 수익성 시뮬레이션\n데이터: `data/research/line_transition.csv` (교육용 가상 라인/수치). F-3 라인을 차세대 공정으로 전환 시 수율이 낮게 시작해 몇 달에 걸쳐 성숙 수율까지 오른다는 가정.\n```\nF-3 라인을 차세대 공정으로 전환하려고 합니다.\n전환 직후에는 수율이 낮고, 몇 달에 걸쳐 성숙 수율까지 올라간다고 가정합니다.\n\n제공된 사업 가정(line_transition.csv)을 바탕으로 적절한 분석 방법을 조사하고,\n시뮬레이션을 설계하여 실제 파이썬 코드로 실행하세요.\n24개월 동안의 누적 영업이익 분포와 적자 발생 확률을 분석하고,\n결과에 가장 큰 영향을 미치는 변수를 찾아주세요.\n\n정량 결과는 실제 코드 실행 결과를 사용하세요.\n```\n몇 분 소요(조사 담당이 문서 읽고, 실험 담당이 코드를 고쳐가며 실행하는 시간) → **Agent 간 주고받은 정보 로그**가 쌓임(파란 상자=맡긴 것, 회색 상자=돌려준 것).\n\n### 로그에서 확인할 것\n- **자료조사 연구원**이 돌려준 상자: 어떤 도구 사용, 무엇을 읽었는지, 무엇을 설계했는지. `line_transition.csv`는 변수마다 제공 형태가 다름(최소·기준·최대 / 평균·표준편차 / 값 하나 / **수치가 아니라 \"방식\"을 적은 행**도 있음) — 조사 담당이 이 차이를 어떻게 반영했는지 대조.\n- **실험수행 연구원**이 돌려준 상자: 파일을 읽은 흔적 → 실행한 코드 → 코드가 찍은 출력. 최종 결론 수치(중앙값, 하위 5%, 상위 5%, 적자 발생 확률, 민감도 1위 변수)를 기록.\n- **연구책임자 → 실험수행 연구원** 지시문: 무엇을 적어 보냈는지 확인. **핵심**: 두 연구원은 서로의 결과를 모르므로, 앞 단계 결과가 다음 지시문에 실려 넘어가야 협업이 성립한다.\n- **역할 준수 확인**: 연구책임자가 직접 계산/수치를 지어내지 않았는가, 자료조사가 수치·코드를 만들려 하지 않았는가, 실험수행이 판단(전환 추진 여부 등)을 붙이지 않았는가.\n\n## 이어서 물어보기 (컨텍스트 유지)\n연구책임자는 방금 연구를 기억한다 → 조건 변경 후속 질의 가능:\n```\n공정 안정화가 예상보다 늦어져 수율 램프 기간이\n최소 8개월, 기준 14개월, 최대 20개월이라면 어떻게 되나?\n\n나머지 조건과 확률변수를 뽑는 방식은 그대로 두고 다시 계산해 줘.\n```\n이번엔 수치보다 **연구책임자의 판단**(누구에게 무엇을 다시 맡기는지)이 관찰 포인트. **[새 연구로 시작]을 누르면 기억이 지워져 처음부터 재조사** — 후속 질의 실습 중에는 누르지 말 것.\n\n## 정리 — 나눌지 말지 판단 기준\n- 다루는 자료가 서로 다른가 (조사 자료 vs 실행 자료가 겹치지 않으면 한 곳에 쌓아둘 이유 없음)\n- 필요한 지시·도구·권한이 다른가\n- 만든 쪽과 검토하는 쪽을 갈라야 하는가 (스스로 짠 걸 스스로 검토하면 놓침 — 실무에서 가장 흔한 분리 이유)\n\n**핵심**: 오늘 셋으로 나눈 건 \"셋이 더 나아서\"가 아니라 조사와 실행이 각각 다른 도구·다른 지시가 필요했기 때문. **나눌 이유가 없으면 한 명이 낫다.** 중요한 건 에이전트 수가 아니라 **왜 책임을 나눴는가**.\n\n- 연구책임자는 맡기고 받고 다음을 정한다 — 직접 하지 않는다\n- 앞 단계 결과가 **다음 지시문에 실려** 넘어가는 것이 협업의 실체\n- 역할의 경계는 두 겹: **지시문**으로 정하고 **도구**로 막는다\n- 설계는 한 번 해두면 값을 바꿔 재사용 가능(조사를 다시 안 해도 됨)\n- **결과를 읽는 법**: 중앙값 하나가 아니라 하위 5%·상위 5%·적자확률까지 — \"하나의 예상값\" vs \"분포를 본다\"의 차이. 남길 것은 숫자가 아니라 **분포를 본다는 감각.**\n\n**지금 가진 것**: `agent-lab` — 도구 3개 + 서버 2개 + 연구원 2명\n\n이후 7~8교시는 오늘 만든 것을 바탕으로 **각자의** 캡스톤 프로젝트를 만든다.\n", "cbCount": 0, "contentEasy": "# 6교시 · Multi-Agent — 쉬운 설명 버전\n\n## 왜 AI를 여러 명으로 나누나\n\n지금까지는 AI 하나가 도구도 다 쥐고, 질문도 다 받고, 답도 혼자 썼습니다. 그런데 AI가 한 번에 기억하고 처리할 수 있는 양은 정해져 있습니다. 포토샵에서 레이어와 히스토리가 너무 많이 쌓이면 파일이 무거워지고 렉이 걸리는 것처럼, AI도 도구가 많아지고 대화가 길어지면 **처리 한계에 부딪힙니다.**\n\n## 팀처럼 나누기 — 디자인팀 조직도와 똑같다\n\n이번 시간엔 AI를 세 역할로 나눕니다. 디자인 회사의 팀 구성과 놀랍도록 비슷합니다.\n\n- **연구책임자 (아트디렉터)** — 무엇을 할지 정하고, 아래 두 역할에게 업무를 나눠 맡깁니다. 본인은 직접 조사하거나 실행하지 않습니다.\n- **자료조사 연구원 (리서처)** — 어떤 방법으로 풀지 조사하고 설계합니다. 웹 검색 등을 담당하지만, 직접 계산하거나 코드를 짜진 않습니다.\n- **실험수행 연구원 (실무 디자이너/개발자)** — 설계받은 대로 실제로 코드를 돌려서 결과물(수치)을 냅니다. 판단은 하지 않고, 실행만 합니다.\n\n**규칙**: 두 실무 담당(리서처, 실행 담당)은 서로 직접 대화할 수 없습니다. 모든 소통은 아트디렉터(연구책임자)를 거칩니다 — 실제 팀 협업과 똑같죠.\n\n## 나누는 데는 대가가 따른다\n\n역할을 나누면 \"전달\"이 늘어납니다. 아트디렉터가 리서처에게 브리핑을 쓰고, 리서처가 결과를 보고하고, 다시 아트디렉터가 실행 담당에게 브리핑을 써야 하죠. **이 왕복 시간이 대가**입니다. 대신 얻는 것:\n\n- 각자 맡은 일이 명확해서, 문제가 생겼을 때 **어디를 봐야 하는지 바로 알 수 있음**\n- 새 역할이 필요하면 기존 팀원 건드리지 않고 **한 명만 추가**하면 됨 (기존 팀원의 업무 지침은 그대로 둔 채)\n\n## 실습에서 확인하는 것\n\n세 역할을 각각 켜면(기동), 각자 어떤 도구를 쥐고 있는지 화면에서 확인할 수 있습니다. 5교시에서 붙인 플러그인(문서 검색 등)은 **리서처에게만** 가 있는 식이죠. 4교시에서는 \"이런 일은 하지 마\"라고 **문구로** 막았는데, 여기서는 **애초에 그 도구 자체를 안 쥐여줘서** 확실하게 막습니다.\n\n연구 하나를 맡기면, 로그에 \"누가 누구에게 뭘 시켰고, 뭘 받았는지\"가 순서대로 남습니다. 여기서 확인할 포인트:\n\n- 아트디렉터가 실행 담당에게 보낸 지시문에, **리서처가 조사한 내용이 실제로 담겨 전달됐는지** (이게 협업의 핵심입니다)\n- 각자 자기 역할 밖의 일을 하지 않았는지 (아트디렉터가 직접 계산하지 않았는지 등)\n\n## 이어서 물어보기\n\n한 번 연구가 끝나면, 조건 하나만 바꿔서 \"이건 어떻게 되나?\"라고 다시 물어볼 수 있습니다. 아트디렉터가 이전 맥락을 기억하고 있어서, 처음부터 다시 조사하지 않고 **바로 재계산만** 시킵니다.\n\n## 정리\n\n- 여러 AI로 나누는 건 \"여럿이 좋아서\"가 아니라, **역할마다 필요한 정보·도구·권한이 다르기 때문**입니다\n- 나눌 이유가 없으면 한 명(하나의 AI)이 더 낫습니다 — 나누면 전달 비용이 생기니까요\n- 결과를 볼 때는 \"숫자 하나\"가 아니라 **최악의 경우·최선의 경우까지 범위로 보는 감각**이 중요합니다\n\n다음 시간부터는 오늘 배운 걸 다 조합해서, 여러분만의 것을 직접 만들어봅니다.\n"}, {"id": "note-7", "filename": "07-캡스톤1-기획제작.md", "category": "note", "badge": "7", "label": "캡스톤 1 · 기획·제작", "content": "# 7교시 · 캡스톤 1 — 기획과 제작\n\n지금까지는 전부 준비된 문제였다. 여기서부터 100분은 **본인 업무에서 문제를 가져오거나, 출제된 문제를 내 시스템으로 푸는** 시간.\n\n## 시각표 (양보 불가)\n| 시각 | 내용 |\n|---|---|\n| 16:00 | 트랙·범위 확정, 작업 폴더 준비, 제작 시작 |\n| 17:20 | **작업 종료** — 이후 결과물 수정 금지 |\n| 17:25 | 결과 페이지(단일 HTML) 작성 |\n| 17:45 | 제출 마감 |\n\n> 원칙: **완성도보다 정상 동작이 먼저.** 크게 설계해 절반만 돌아가는 것보다 작게 잡아 끝까지 도는 게 낫다. 먼저 하나를 끝까지 돌리고, 남는 시간에 기능을 늘린다.\n\n## 트랙 고르기\n| 상황 | 트랙 |\n|---|---|\n| 오늘 배운 걸 조합해 따로 만들고 싶은 게 있다 | **자유 트랙** |\n| 도구를 만들어 쥐여주고 기능 정의를 다듬는 게 중심 | **트랙 1 (도구 설계)** |\n| 문서 근거로 정확히 답하는 시스템을 겨루고 싶다 | **트랙 2 (함정 질문 챌린지)** |\n| 자료를 모아 분석해 리포트로 만드는 게 중심 | **트랙 3 (조사 리포트)** |\n\n자유 트랙도 정식 과정의 일부이며 별도 우수작 발표 있음. 안 정해지면 다음 단계(코치 점검)에서 제안받는다.\n\n## 실습 — 만들기 전에 코치(Claude Code)에게 먼저 물어보기\n```\ncd C:\\samsung_YYYYMMDD\nmkdir capstone\ncd capstone\nclaude\n```\n```\n내 캡스톤 주제를 알려줄게. 만들기 전에 아래 5가지를 점검해줘.\n\n주제: [한 줄]\n만들고 싶은 것: [설명]\n\n① 범위 — 100분 안에 혼자 만들 수 있는 크기인가?\n   너무 크면 어디를 잘라야 하는지 알려줘.\n\n② 기술 매핑 — 이걸 만들려면 RAG·Tool Calling·MCP·Multi-Agent 중\n   무엇을 쓰게 되나?\n\n③ 데이터 — 어떤 데이터가 필요하고, 그중 지금 없는 건 뭔가?\n   없는 데이터는 가상으로 만들어줄 수 있나?\n\n④ 입력 점검 — 내 설명에 실제 사내 정보가 섞여 있는지 봐줘.\n   신사업 계획, 공급망·거래처 정보, 내부 프로세스, 미공개 로드맵,\n   실명·사번 등이 포함됐다면 어느 부분인지 알려주고\n   가상 버전으로 바꿔 제안해줘.\n   그리고 앞으로 이 프로젝트를 만들어가면서 내가 추가로 입력하게 될\n   가능성이 있는 민감 정보가 무엇인지도 미리 짚어줘.\n\n⑤ 트랙 배정 — 자유 트랙 / 트랙 1(도구 설계) /\n   트랙 2(함정 질문 챌린지) / 트랙 3(조사 리포트) 중 어디가 맞나?\n```\n- \"만들고 싶은 것\"은 **화면 기준**으로 적으면 답이 훨씬 구체적임\n- 이 단계에 **10분 이상 쓰지 않는다** — 제안받으면 그 자리에서 범위 확정\n- ④에서 사내 정보 지적되면 제안된 가상 데이터로 교체 (실습은 공개문서/가상수치만 썼지만, 본인 업무를 주제로 잡는 순간 설명 문장 자체에 사내 정보가 섞이기 쉬움)\n\n## 공통 규칙\n- 시작할 때 앱 폴더를 `capstone` 안으로 **복사**해서 작업 (원본은 그대로 둠 — 되돌릴 자리 확보). 예: `rag-lab` → `capstone\\rag-lab`\n- 챌린지 트랙(1·2) 공통: **질문 문구는 고치지 않음**, 결과값 하드코딩 금지, 특정 문항만 통과시키는 예외 처리 금지 (결과 페이지에서 확인 대상)\n- 문서·데이터는 공개 자료 또는 가상 자료만 (7-4번 점검 반영)\n\n## 트랙 1 — 도구 설계 (agent-lab)\n4교시를 본인 업무로 확장. 도구 묶음 전체를 시나리오로 교체.\n1. **시나리오 한 줄** (예: 설비 점검 이력을 조회·등록하고, 점검 주기를 바꾸고, 지연 건을 집계한다)\n2. **도구 3종 이상 설계** — 이름·설명문·인자·동작을 표로 먼저 작성. 4교시 원칙 준수: 판단 근거는 설명문, 도구 간 인자 구조가 신호가 되지 않게(다 똑같은 인자 구조로).\n3. **데이터 파일 설계** — 도구가 읽고 쓸 JSON/CSV를 가상 수치로 (`data/notes.json` 견본 참고)\n4. **Claude Code로 구현** — `lab/tools.py`에 추가·교체, 재시작해야 반영\n5. **질문 10개 확정** — 조회·등록·수정·집계 섞고, 두 도구에 걸릴 법한 애매한 질문도 2개 정도 포함. 이게 라운드 기록의 문항.\n6. **라운드 돌리기** — 10개 차례로 던져 도구·인자 확인. 틀린 문항은 **설명문과 데이터만** 수정해 재시도 (도구 코드 변경은 라운드 사이가 아니라 설계 단계의 일).\n\n**성공 기준: 10문항 중 8개 이상**\n\n## 트랙 2 — 함정 질문 챌린지 (rag-lab)\n실제 상금 1,000만원 AI 경진대회의 문제 유형(표 속 숨은 정답, 유사 항목 혼동, 조각 경계에 걸친 답)을 반영해 「2026년 6월 소비자물가동향」(국가데이터처)에서 5문항 출제.\n\n**미션**: 5문항 중 4개 이상에서 **답 정합**(핵심 요소 빠짐없이·오류 없음)과 **근거 정합**(표시된 근거 청크에 정답 내용이 실제로 있어야 함)을 동시에 만족.\n\n**특별 판정**: 환각 유도 문항은 \"문서에서 확인되지 않습니다\" 계열 답이 통과 / 이중 기준 문항은 두 기준을 구분해 답하면 통과(한 값만 단정 시 어느 기준인지 명시해야 통과).\n\n**허용 수단**: 청킹 전략 교체+재적재, K값 조정, 답변 프롬프트 강화(근거 제한·인용·표 처리 지시), 파싱 보강, 검색 방식 점검·조정.\n\n**반칙 3가지**\n1. 질문 문구를 바꾸는 것 (토씨 하나도 그대로 입력, 고칠 대상은 시스템)\n2. 앱 안에 정답을 심는 것 (프롬프트/코드/설정/적재문서 어디에도 정답 힌트 금지 — **다만 정답을 놓고 AI와 논의하는 것 자체는 반칙 아님**)\n3. 문항 전용 분기(\"이 질문이 오면 이렇게 답하라\") 금지 — 비슷한 다른 질문에도 통하는 일반적 개선만 인정\n\n> 💬 **정답을 AI와 논의하는 것은 반칙이 아니다** — ChatGPT/Claude/Gemini 같은 대화형 AI에는 문항·정답·우리 시스템 답과 근거까지 다 보여주고 \"왜 틀렸는가, 어디를 고쳐야 하는가\" 논의해도 됨 (이들은 앱을 못 고치므로). **다만 Claude Code에게는 정답을 주지 않는다** — 앱을 직접 고치는 도구라서 정답을 알면 정답 처리 코드/프롬프트가 만들어질 위험(=반칙 2·3). Claude Code에는 **증상까지만** 전달: 예) \"문항 3에서 하락 부문이 두 개만 나온다. 근거 청크를 보니 문단이 중간에서 끊겨 있다.\"\n> 기준: \"이 질문이 오면 교통 -0.6%라고 답해\"=반칙 / \"청크가 문장을 중간에서 자르지 않게 문단 기준으로 바꿔줘\"=개선.\n\n**사전 준비**: rag-lab 사본에서 [초기화]로 2·3교시 문서 비우기 → PDF 업로드→청킹→적재 → 청크 수 0 아닌지 확인 → 답변생성 켜고 가벼운 질문으로 근거 번호 확인.\n\n**5문항 요지**\n1. 표 속 정답: 석유류 전년동월대비(정답 24.7%) — 표가 파싱에서 무너지면 이웃 숫자(휘발유23.1/경유33.7/등유23.1)가 답으로 올라옴\n2. 유사 항목 혼동: 농산물및석유류제외지수(정답 2.4%) — 식료품및에너지제외지수(2.5%)와 항상 붙어다녀 혼동 유발\n3. 조각 경계: 하락 부문 3곳+수치(교통-0.6%, 오락문화-0.2%, 통신-0.1%) — 문단 끝에 몰려있어 청크가 문장을 자르면 반쪽 답\n4. 이중 기준: 기준연도(지수=2020년 / 가중치=2022년, 두 기준 구분해야 통과) — 부록엔 2020년만 다시 나와 단정 유도\n5. 환각 유도: 체감물가상승률 → 정답은 \"확인되지 않음\" — \"체감물가\"라는 단어는 실재, 생활물가지수(3.4%)를 체감물가상승률로 둔갑시키기 쉬움\n\n**진행**: 아무 처방 없이 먼저 돌려 **라운드 0** 기록 → 틀린 문항의 근거 청크를 열어 원인을 가른 뒤 하나씩 고침.\n\n## 트랙 3 — 조사 리포트 (agent-lab, run6)\n6교시 구조(연구책임자·자료조사·실험수행)는 그대로, 재료 3가지만 교체.\n1. **연구 질문 한 줄** — 수치로 답이 나오는 질문으로 좁힘 (예: \"이 조건이 흔들리면 무엇이 결과를 지배하는가\")\n2. **데이터 CSV** — `data/research/`에 가상 수치 (`line_transition.csv` 견본처럼 단일값/최소-기준-최대/평균-표준편차 등 제공형태를 섞고, **값이 아니라 방식을 적는 행**(산식, 확률변수 추출 방식)을 넣으면 결과가 안정됨)\n3. **참고 문서** — `mcp-servers/doc-search/docs/`에 조사 담당이 읽을 md 문서 추가 후 서버 재연결 (없으면 조사 담당이 웹으로 감)\n4. **연구 실행** — `run6.bat`으로 켜고 질문 위임. 6교시처럼 지시문에 앞 단계 결과가 실렸는지, 역할을 지켰는지, 수치가 모순 없는지 확인\n5. **후속 질의** — 조건 하나 바꿔 재위임, 결과 변화 방향을 리포트에 기록\n6. **리포트 정리** — 최종 결론(분포·민감도)과 로그 근거를 결과 페이지에 옮김\n\n## 라운드 기록 (개선 여부를 숫자로)\n3교시의 원칙(라운드 0 = 손대기 전 기준선 필수, 한 번에 한 가지만 변경) 그대로 적용.\n```\n라운드 0 (기준선): 통과 수 ___/___  실패 문항과 증상(A/B/C): ___\n라운드 1 (처방: ______): 통과 수 ___/___\n라운드 2 (처방: ______): 통과 수 ___/___\n```\n분모: 트랙1=10개, 트랙2=5개. 트랙3/자유트랙은 \"실행이 끝까지 돌았는가 / 수치가 모순 없는가\"를 라운드마다 기록.\n\n실패 문항 분류: **A(검색·선택 오류)** 관련없는 정보/엉뚱한 도구 / **B(형식 오류)** 정보는 맞는데 출력 형식 문제 / **C(지시 오류)** 근거 부족한데 답을 지어냄.\n\n## 마감 전 체크리스트\n- [ ] 확정한 트랙과 조정된 범위\n- [ ] 원본 폴더는 손대지 않고 별도 복사본에서 작업했는가\n- [ ] 실제로 돌아가는 실행 결과 (완성도보다 동작 여부가 먼저)\n- [ ] 트랙 1·2라면 라운드 0 포함 개선 기록\n", "cbCount": 4, "contentEasy": "# 7교시 · 캡스톤 1 — 쉬운 설명 버전\n\n## 이제부터는 정해진 문제가 없다\n\n지금까지는 저희가 준비해둔 문서·데이터로 실습했습니다. 여기서부터는 **본인이 원하는 것**을 직접 정해서 만듭니다. 정해진 시간 안에 \"일단 동작하는 것\"을 하나 완성하는 게 목표입니다.\n\n> 완성도보다 **정상 동작이 먼저**입니다. 크게 벌여놓고 절반만 되는 것보다, 작게 잡아서 끝까지 도는 게 지금은 낫습니다.\n\n## 트랙 고르기\n\n- 오늘 배운 것 중 \"이거 내 작업에도 쓰겠는데\" 싶었던 순간이 있었다면 → **자유 트랙**\n- AI에게 \"액션(도구)\"을 만들어 쥐여주는 게 재밌었다면 → **트랙 1 (도구 설계)**\n- 문서를 정확히 찾아 답하게 만드는 게 재밌었다면 → **트랙 2 (함정 질문 챌린지)**\n- 자료를 모아 분석 리포트로 만드는 게 재밌었다면 → **트랙 3 (조사 리포트)**\n\n## 만들기 전에 Claude Code(코치)에게 먼저 점검받기\n\n바로 만들기 시작하고 싶겠지만, 5~10분만 점검에 씁니다. 아래처럼 물어보세요.\n\n```\n내 캡스톤 주제를 알려줄게. 만들기 전에 아래를 점검해줘.\n\n주제: [한 줄]\n만들고 싶은 것: [화면에 뭐가 보여야 하는지, 최대한 구체적으로]\n\n① 범위 — 오늘 안에 혼자 만들 수 있는 크기인가? 너무 크면 어디를 잘라야 하는지 알려줘.\n② 기술 매핑 — RAG·도구·플러그인 연결·여러 AI 협업 중 무엇을 쓰게 되나?\n③ 데이터 — 어떤 데이터가 필요하고, 없는 건 가상으로 만들어줄 수 있나?\n④ 입력 점검 — 내 설명에 회사 기밀 등 민감한 정보가 섞여 있으면 짚어주고\n   가상 버전으로 바꿔 제안해줘.\n```\n\n디자인 작업으로 치면 \"이 컨셉, 오늘 안에 완성 가능한 볼륨일까요?\"를 미리 물어보는 것과 같습니다.\n\n## 마감 전에 확인할 것\n\n- [ ] 무엇을 만들지, 범위를 얼마나 줄였는지 확정했다\n- [ ] 원본 앱은 그대로 두고, 복사한 폴더에서 작업했다 (되돌릴 자리 확보)\n- [ ] 완성도는 낮아도 **실제로 끝까지 동작**하는 결과물이 있다\n- [ ] (도구 설계·문서 질답 트랙이라면) 손대기 전과 후를 비교한 기록이 있다\n\n## 정리\n\n오늘 배운 것들이 실제로는 이렇게 깔끔하게 나뉘어 있지 않다는 걸 만들면서 알게 되실 거예요. 그걸 확인하는 것까지가 이번 시간의 진짜 목표입니다.\n"}, {"id": "note-8", "filename": "08-캡스톤2-완성제출.md", "category": "note", "badge": "8", "label": "캡스톤 2 · 완성·제출", "content": "# 8교시 · 캡스톤 2 — 완성과 제출\n\n## 결과 페이지 = 단일 HTML 파일 하나\n제출 플랫폼은 **HTML 파일 한 개만** 받는다 (GitHub 주소·압축파일 불가). CSS/JS는 파일 안에, 이미지는 base64로 인라인, 화면 시연은 자바스크립트 mock-up으로 구현.\n\n### 지시문 (그대로 복사해서 사용)\n```\n프로젝트가 완성됐어. 제출용 결과 페이지 report.html을 만들어줘.\n작업 제한 시간은 5분이야. 아래 순서와 상한을 지키고, 완성 후 다듬는 작업은 하지 마.\n\n[작업 순서]\n1. report.html 본문을 먼저 쓴다. 스크린샷이 들어갈 자리는 <!--IMG:파일명--> 주석만 남긴다.\n2. 작업 폴더의 캡처 파일(png/jpg, 최대 5장)을 base64로 바꿔 그 자리에 <img>로 넣는\n   짧은 파이썬 스크립트를 만들어 실행한다.\n   - base64 문자열을 네가 직접 쓰거나 파일에 타이핑하지 마. 반드시 스크립트로 넣어.\n   - 이미지 파일을 열어서 보지 마. 파일명만으로 처리해.\n   - 캡처 파일이 없으면 ⑥은 \"캡처 없음\" 한 줄로 두고 넘어가.\n     SVG 등으로 화면을 그려서 대신 채우지 마.\n3. 브라우저로 한 번 열어 보여주고 끝낸다. 열어본 뒤 수정하지 마.\n\n[포함할 내용]\n① 프로젝트 제목과 작성자 이름 (맨 위에 크게)\n② 만들려던 목표와 배경 (2~3문장)\n③ 주요 기능 설명\n④ 사용한 기술 (RAG·Tool Calling·MCP·Multi-Agent 중 해당 항목과,\n  이 프로젝트의 어디에 쓰였는지)\n⑤ 동작 시연 mock-up — 핵심 흐름 1개를 화면 3~5장으로, 버튼 클릭으로 넘기는 수준.\n   데이터는 예시값을 하드코딩. 실제 앱 코드를 다시 읽거나 UI를 재현하지 마.\n   JS 150줄 이내. 차트·애니메이션 없음. 어려우면 정적 화면.\n⑥ 실행 결과 스크린샷 — 장면마다 한 줄 설명\n⑦ (트랙 1·2) 라운드 기록 표 — 라운드 0부터의 통과 수와 고친 것\n⑧ 실무 적용 시 필요한 것\n   - 실제 업무에 쓰려면 어떤 데이터·시스템 연동이 필요한가\n   - 그 데이터를 외부 AI 서비스에 넣어도 되는가\n\n[조건]\n- CSS·JS 전부 파일 안에. 외부 라이브러리·CDN·웹폰트·인터넷 요청 금지.\n- CSS 80줄 이내. 단순한 문서 스타일. 디자인 시스템·다크모드 만들지 마.\n- 이미지는 base64 인라인만.\n```\n\n### 확인할 것\n- `report.html`을 브라우저로 열어 ①~⑧ 항목이 다 채워졌는지 확인\n- **인터넷을 끊어도 열려야 함** — 외부 로드가 하나라도 있으면 제출 플랫폼에서 그 부분이 비어 보임\n- mock-up이 잘 안 만들어지면 **정적 화면**으로 두고 넘어감 — 항목이 모두 채워진 게 더 중요\n\n### 막히면\n| 증상 | 해결 |\n|---|---|\n| 브라우저에서 안 열림 | \"브라우저에서 오류가 나니 코드를 고쳐 다시 만들어줘\" (결과 페이지 수정은 코드 확정 제한에 안 걸림) |\n| 스크린샷 안 보임 | \"이미지를 base64 로 인라인해줘. 외부 경로를 참조하지 마.\" |\n| 파일이 너무 큼 | 캡처 2~3장으로 줄이거나 \"이미지 폭을 1000px로 줄여서 다시 넣어줘\" |\n| mock-up 생성 반복 실패 | 정적 화면으로 고정하고 다음으로 진행 |\n\n## 제출 플랫폼 가입\nURL: https://contest-platform-production.up.railway.app/samsungds-B\n\n1. 우측 상단 **로그인** → **회원가입** 탭\n2. **본인 knox 계정 이메일**로 가입 (이메일 2회 입력 + 비밀번호)\n   > ⚠️ 비밀번호는 **사내 계정과 다른 것** 사용\n3. 가입 직후 프로필 설정 — **이름은 본인 실명** (전시관에 이 이름으로 표시됨)\n\n## 제출하기\n로그인 → **[결과물 제출하기]** 또는 상단 메뉴 **[제출하기]**\n\n양식:\n- **작품명** — `앱 이름 - 본인 이름` 형식. **제목에 반드시 본인 이름 포함**\n- **작품 설명** — 1~2줄\n- **HTML 파일 업로드** — `report.html`\n- **미리보기** — 업로드 후 아래에 표시됨. 스크린샷·mock-up이 보이는지 여기서 확인, 비면 위 표대로 재수정 후 재업로드\n- **예시 데이터**(선택) — 사용한 가상 데이터 파일(CSV·JSON). 올리기 전 사내 정보 재확인\n\n**[제출하기]** → 완료. **전시관**에서 동료 결과물 열람 가능 — 서로 페이지가 안 깨졌는지 확인.\n\n> 시간이 촉박하면 **기한 내 제출 먼저**, 제출 후 남은 시간에 재수정·재업로드 가능.\n\n### 막히면\n- 업로드 안 됨 → 파일이 `.html` 단일 파일인지, 용량이 과한지 확인. 마감 임박 시 이미지 줄인 판이라도 먼저 제출\n- 미리보기 비어있음 → 외부 라이브러리/인터넷 요청이 남아있는 경우. 조건대로 전부 파일 안에 인라인해서 재생성\n\n## 마무리 — 오늘 만든 것을 계속 쓰려면\n오늘 결과물은 그대로 가져가 쓸 수 있다. 배부된 설치 가이드대로 개인 PC 환경을 맞추면 작업 폴더 복사만으로 앱이 그대로 돌아간다.\n`.env`의 API 키는 1교시에 발급된 그 키 — **개인 발급 값이므로 보관에 유의.**\n", "cbCount": 0, "contentEasy": "# 8교시 · 캡스톤 2 — 쉬운 설명 버전\n\n## 마지막 단계: 결과를 한 장짜리 페이지로 정리하기\n\n제출은 **HTML 파일 하나**로만 받습니다. 압축파일도, 링크도 아니고 딱 그 파일 하나만 열면 전부 보여야 합니다. Claude Code에게 이렇게 시킵니다.\n\n```\n프로젝트가 완성됐어. 제출용 결과 페이지 report.html을 만들어줘.\n\n[포함할 내용]\n① 프로젝트 제목과 작성자 이름\n② 만들려던 목표와 배경 (2~3문장)\n③ 주요 기능 설명\n④ 사용한 기술과, 이 프로젝트의 어디에 쓰였는지\n⑤ 동작 시연 화면 3~5장 (버튼 클릭으로 넘기는 수준, 예시 데이터로)\n⑥ 실행 결과 스크린샷\n⑦ 실무에 쓰려면 뭐가 더 필요한지\n\n[조건]\n- 이미지와 스타일은 전부 파일 안에. 인터넷 연결 없이도 열려야 해.\n```\n\n포트폴리오 페이지 만드는 것과 똑같은 감각이에요 — **이 파일 하나로 무엇을 만들었는지 다 설명**되게 만드는 겁니다.\n\n## 확인할 것\n\n- 인터넷을 끊고 열어봐도 정상적으로 보이는지 (외부에서 뭔가 불러오고 있으면 그 부분이 비어 보입니다)\n- ①~⑦ 항목이 다 채워졌는지\n\n## 제출하기\n\n정해진 제출 페이지에 가입하고, 작품명(본인 이름 포함)과 설명을 적은 뒤 `report.html`을 올립니다. 업로드 후 미리보기에서 이미지가 잘 보이는지 한 번 더 확인합니다.\n\n## 오늘 만든 걸 계속 쓰려면\n\n오늘 만든 프로그램들은 그대로 가져가서 계속 쓰실 수 있습니다. `.env` 안의 API 키는 개인에게 발급된 것이니 잘 보관해두세요.\n\n## 정리\n\n오늘 하루, 코드를 몰라도 프롬프트로 4개의 프로그램을 만들었습니다. Midjourney·Higgsfield로 이미지·영상을 만들던 것과 원리는 같습니다 — **원하는 걸 구체적으로 설명할수록, 원하는 결과가 나온다**는 것. 이제 그 감각을 텍스트/코드에도 적용할 수 있게 되신 거예요.\n"}, {"id": "guide-0", "filename": "실습가이드-00-준비.md", "category": "guide", "badge": "0", "label": "준비", "content": "# 자습·실습 가이드 — 준비\n\n이 가이드는 [학습노트(01~08)](README.md)의 **개념 설명을 압축하고, 혼자서 순서대로 따라 할 수 있는 체크리스트**로 재구성한 것입니다. 개념이 궁금하면 학습노트를, \"지금 뭘 해야 하지?\"는 이 가이드를 보세요.\n\n## 원본 교육과 다른 점 (자습 시 꼭 확인)\n\n원본은 하루짜리 **사내 교육**이라 배부 계정·배부 파일·팀 제출 플랫폼에 의존합니다. 혼자 할 때는 아래를 대체합니다.\n\n| 원본(교육) | 자습 대체 |\n|---|---|\n| 배부된 OpenAI API Key | **본인 OpenAI API 키** 발급 (platform.openai.com → API keys). 결제수단 등록 필요, 사용량 한도(Usage limits)를 낮게 걸어두는 걸 권장 |\n| 모델명 `gpt-5.6-luna` (교육 시점 배부 계정에 연결된 별칭) | 본인 계정에서 **실제 사용 가능한 최신 GPT 모델**로 대체 (Claude Code에게 \"지금 내 OpenAI 계정에서 쓸 수 있는 모델 목록을 확인해줘\"라고 물어보면 됨) |\n| 배부 zip (`rag-lab.zip`, `agents-lab.zip`) — 미리 만들어진 실습용 앱 | **02·04 가이드에 포함된 부트스트랩 프롬프트**로 Claude Code가 동등한 앱을 직접 만들어줌 (오히려 바이브코딩 연습이 한 번 더 되는 셈) |\n| 배부 문서(`materials_ch2/3.zip`, 반도체 품질 핸드북 등) | 사내 자료라 배포 불가 — **본인이 가진 PDF 3~5개**(회사 문서·논문·매뉴얼 등, 표와 절 번호가 섞인 것이 학습 효과가 좋음)로 대체 |\n| 트랙2 문서 「2026년 6월 소비자물가동향」 | **실제 공공 자료라 그대로 다운로드 가능**: [국가데이터처(통계청) 소비자물가동향](https://kostat.go.kr) 최신 호를 내려받아 사용 |\n| 팀 제출 플랫폼(contest-platform) | 사내 콘테스트 전용이라 자습자는 **건너뜀** — `report.html`은 개인 포트폴리오로 로컬에 보관 |\n| 8교시 고정 시간표 | **자기 페이스로** — 세션당 45~90분 예상, 하루에 몰아서 해도 되고 여러 날에 나눠도 됨 |\n\n## 환경 준비 체크리스트\n\n- [ ] PowerShell에서 Claude Code 설치 확인\n  ```powershell\n  claude --version\n  ```\n  안 되면: `irm https://claude.ai/install.ps1 | iex` 실행 후 터미널 재시작\n- [ ] OpenAI API 키 발급 — https://platform.openai.com/api-keys → `sk-...`로 시작하는 키 복사\n- [ ] (선택, 5교시용) Tavily 무료 API 키 발급 — https://app.tavily.com (구글 계정 가입 가능)\n- [ ] 실습 루트 폴더 생성\n  ```powershell\n  mkdir C:\\ai-agent-selfstudy\n  cd C:\\ai-agent-selfstudy\n  ```\n- [ ] 세션별 하위 폴더는 각 실습 가이드 안내에 따라 그때그때 생성 (`01-webapp`, `02-rag-lab`, `04-agent-lab`, `07-capstone` 등)\n\n## 진행 순서\n\n```\n00 준비 (지금 여기)\n └ 01 웹앱      → 02 RAG1 → 03 RAG2 (같은 폴더 이어서)\n                → 04 ToolCalling → 05 MCP → 06 MultiAgent (같은 폴더 이어서)\n                → 07 캡스톤 (자유 주제, 나만의 프로젝트)\n```\n\n01은 독립적인 폴더, 02~03은 같은 `rag-lab` 폴더를 이어서 사용, 04~06은 같은 `agent-lab` 폴더를 이어서 사용합니다. 07은 앞의 것들 중 하나를 골라 본인 주제로 확장합니다.\n\n## 각 세션 진행 방식 (공통)\n\n1. 실습 가이드의 체크박스를 위에서부터 순서대로 실행\n2. 코드가 바뀌는 지시를 내린 뒤에는 **서버를 재시작**해야 반영됨 (검은 창 `Ctrl+C` → 재실행)\n3. 막히면 각 가이드의 \"막히면\" 표를 먼저 확인, 그래도 안 되면 Claude Code에게 오류 메시지를 그대로 붙여넣고 물어보기\n4. 개념이 헷갈리면 같은 번호의 [학습노트](README.md)를 열어 배경 설명 확인\n\n준비가 끝났으면 [01-웹앱 실습 가이드](실습가이드-01-웹앱.md)로 이동하세요.\n", "cbCount": 5, "contentEasy": "# 자습·실습 가이드 — 준비 (쉬운 설명 버전)\n\n이 가이드는 [학습노트(쉬운 설명)](../README.md)에서 배운 걸 **혼자서 순서대로 따라 할 수 있는 체크리스트**로 정리한 것입니다. 여기 나오는 프롬프트·명령어는 일반 버전과 완전히 똑같습니다 — 난이도는 \"설명 방식\"만 다르고, 실제로 하는 작업은 동일해야 하니까요.\n\n## 원본 교육과 다른 점 (자습 시 꼭 확인)\n\n원본은 회사에서 진행한 1일짜리 교육이라, 미리 나눠준 계정·파일·제출 사이트에 의존합니다. 혼자 하실 땐 아래처럼 바꿔서 진행합니다.\n\n| 원본(교육) | 자습 대체 |\n|---|---|\n| 미리 나눠준 OpenAI API 키(=서비스 이용 인증서) | **본인 OpenAI API 키**를 직접 발급 (platform.openai.com → API keys). 결제수단 등록이 필요하고, 사용량 한도(Usage limits)를 낮게 걸어두면 안심됩니다 |\n| 모델명 `gpt-5.6-luna` (교육 때만 쓰던 이름) | 본인 계정에서 **실제로 쓸 수 있는 최신 GPT 모델**로 대체. Midjourney 버전 고르듯, Claude Code에게 \"지금 내 계정에서 쓸 수 있는 모델 목록을 확인해줘\"라고 물어보면 됩니다 |\n| 미리 만들어진 실습용 앱 파일 | **02·04 가이드에 들어있는 프롬프트**로 Claude Code가 그 앱을 처음부터 직접 만들어줍니다 (오히려 \"말로 프로그램 만들기\" 연습이 한 번 더 되는 셈) |\n| 회사 전용 참고 문서 | 사내 자료라 나눠드릴 수 없어요 — **본인이 가진 PDF 3~5개**(회사 문서·매뉴얼·보고서 등, 표가 섞인 것일수록 좋음)로 대체 |\n| 트랙2용 특정 공공 문서 | **실제로 존재하는 공개 자료라 그대로 받을 수 있어요**: [통계청 소비자물가동향](https://kostat.go.kr) 최신 호를 내려받아 사용 |\n| 팀 제출 사이트 | 회사 행사 전용이라 자습에서는 **건너뜁니다** — 결과물은 개인 포트폴리오 파일로만 남깁니다 |\n| 8교시 고정 시간표 | **원하는 속도로** — 한 단계당 45~90분 정도 예상하시면 됩니다. 하루에 몰아서 해도 되고 며칠에 나눠도 됩니다 |\n\n## 환경 준비 체크리스트\n\n- [ ] PowerShell(까만 화면)에서 Claude Code가 설치돼 있는지 확인\n  ```powershell\n  claude --version\n  ```\n  안 되면: `irm https://claude.ai/install.ps1 | iex` 실행 후 창을 닫았다가 새로 열기\n- [ ] OpenAI API 키 발급 — https://platform.openai.com/api-keys 에서 `sk-...`로 시작하는 문자열(=인증서) 복사\n- [ ] (선택, 5단계에서 필요) Tavily 무료 API 키 발급 — https://app.tavily.com (구글 계정으로 가입 가능)\n- [ ] 실습용 폴더 만들기\n  ```powershell\n  mkdir C:\\ai-agent-selfstudy\n  cd C:\\ai-agent-selfstudy\n  ```\n- [ ] 단계별 하위 폴더는 각 가이드에서 시키는 대로 그때그때 만들면 됩니다\n\n## 진행 순서\n\n```\n00 준비 (지금 여기)\n └ 01 웹앱      → 02 RAG1 → 03 RAG2 (같은 폴더 이어서)\n                → 04 ToolCalling → 05 MCP → 06 MultiAgent (같은 폴더 이어서)\n                → 07 캡스톤 (자유 주제, 나만의 프로젝트)\n```\n\n01은 독립된 폴더에서 새로 시작, 02~03은 같은 `rag-lab` 폴더를 이어서, 04~06은 같은 `agent-lab` 폴더를 이어서 사용합니다. 07은 그중 하나를 골라 본인 주제로 확장합니다.\n\n## 각 단계 진행하는 법 (공통)\n\n1. 체크박스를 위에서부터 순서대로 실행합니다\n2. 프롬프트로 코드를 바꾼 뒤에는 **서버(까만 실행 창)를 껐다 켜야** 반영됩니다 (`Ctrl+C`로 끄고 다시 실행)\n3. 막히면 각 가이드 맨 아래 \"막히면\" 표를 먼저 확인, 그래도 안 풀리면 Claude Code에게 화면에 뜬 오류 메시지를 그대로 붙여넣고 물어보세요\n4. 개념이 헷갈리면 같은 번호의 [학습노트(쉬운 설명)](../01-바이브코딩-웹앱.md)를 열어 비유로 다시 확인\n\n준비가 끝났으면 [01-웹앱 실습 가이드](실습가이드-01-웹앱.md)로 이동하세요.\n"}, {"id": "guide-1", "filename": "실습가이드-01-웹앱.md", "category": "guide", "badge": "1", "label": "웹앱 만들기", "content": "# 실습 가이드 1 · 웹앱 만들기 (지도+날씨+AI 채팅)\n\n목표: Claude Code로 코드 한 줄 안 쓰고 동작하는 웹앱 하나를 완성하고, `.env`로 API 키를 안전하게 다루는 습관을 들인다.\n\n원본은 [학습노트 01](01-바이브코딩-웹앱.md) 참고 — 자습 시 배부 계정 대신 본인 키를 씁니다.\n\n## 체크리스트\n\n- [ ] 폴더 생성 및 진입\n  ```powershell\n  mkdir C:\\ai-agent-selfstudy\\01-webapp\n  cd C:\\ai-agent-selfstudy\\01-webapp\n  claude\n  ```\n- [ ] 웹앱 만들기 지시\n  ```\n  지도에서 위치를 클릭하면 그 지역의 현재 날씨와 앞으로 7일 예보를 보여주는\n  웹 앱을 만들어줘.\n  지도는 Leaflet을 쓰고, 날씨 데이터는 Open-Meteo API를 써줘.\n  다 만들면 브라우저에서 열어서 보여줘.\n  ```\n- [ ] 브라우저에서 지도를 클릭해 날씨가 실제로 뜨는지 확인\n- [ ] `.env` 생성 (값은 비워서 만들게 한 뒤 직접 채움)\n  ```\n  이 폴더에 .env 파일을 만들고 OPENAI_API_KEY 항목을 넣어줘.\n  값은 비워 두고, 내가 직접 채울게.\n  그리고 .gitignore 에 .env 를 추가해줘.\n  ```\n- [ ] 메모장으로 `.env` 열어 `OPENAI_API_KEY=` 뒤에 본인 키(`sk-...`) 붙여넣고 저장\n  - 파일명이 `.env.txt`로 저장되지 않았는지 확인 (탐색기에서 확장자 표시 켜기)\n- [ ] 채팅 기능 추가 (모델명은 본인 계정에서 실제 쓸 수 있는 것으로 — 예: `gpt-4o-mini`, `gpt-4.1` 등. 확실하지 않으면 Claude Code에게 \"내 OpenAI 계정에서 사용 가능한 모델 목록을 확인해줘\"라고 먼저 물어보기)\n  ```\n  .env 의 OPENAI_API_KEY 를 환경변수로 읽어서 쓰고,\n  지금 보고 있는 지역의 날씨 데이터를 바탕으로\n  \"오늘 우산 필요해?\" 같은 질문에 답해주는 채팅창을 웹 앱에 추가해 줘.\n  키 값은 코드에 직접 쓰지 마.\n  ```\n- [ ] 채팅창에 \"오늘 우산 필요해?\" 입력 → 답변이 지금 선택한 지역의 실제 데이터를 근거로 하는지 확인\n- [ ] (선택) 개선 지시 하나 던져보기 — 걸린 시간을 재보며 \"만드는 시간 vs 고치는 시간\" 감각 익히기\n  ```\n  예보를 표로 말고 그래프로 보여줘.\n  ```\n\n## 완료 기준\n- [ ] 지도 클릭 → 날씨/예보 표시됨\n- [ ] 채팅에 날씨 관련 질문 → 실제 데이터 근거로 답변\n- [ ] `.env`에 키가 있고, 코드 안에는 키가 직접 적혀있지 않음 (Claude Code에게 \"코드에 API 키가 하드코딩된 곳이 있는지 확인해줘\"로 재확인 권장)\n\n## 막히면\n| 증상 | 해결 |\n|---|---|\n| 지도가 회색 | 브라우저 새로고침 |\n| 채팅에서 401/키 오류 | `.env` 파일명·키 값 재확인 |\n| 요청이 너무 자주 막힘(rate limit) | OpenAI 대시보드에서 사용량 한도 확인 |\n\n다음: [02-RAG1 실습 가이드](실습가이드-02-RAG1.md)\n", "cbCount": 11, "contentEasy": "# 실습 가이드 1 · 웹앱 만들기 (지도+날씨+AI 채팅) — 쉬운 설명 버전\n\n목표: 코드를 한 줄도 안 쓰고 진짜 동작하는 웹앱 하나를 완성하고, API 키(=인증서)를 안전하게 다루는 습관을 들이는 것.\n\n원본은 [학습노트 01(쉬운 설명)](../01-바이브코딩-웹앱.md) 참고 — 자습 시엔 나눠준 계정 대신 본인 키를 씁니다.\n\n## 체크리스트\n\n- [ ] 폴더 생성 및 진입\n  ```powershell\n  mkdir C:\\ai-agent-selfstudy\\01-webapp\n  cd C:\\ai-agent-selfstudy\\01-webapp\n  claude\n  ```\n- [ ] 웹앱 만들기 지시 — Midjourney에 프롬프트 넣듯 그대로 복붙합니다\n  ```\n  지도에서 위치를 클릭하면 그 지역의 현재 날씨와 앞으로 7일 예보를 보여주는\n  웹 앱을 만들어줘.\n  지도는 Leaflet을 쓰고, 날씨 데이터는 Open-Meteo API를 써줘.\n  다 만들면 브라우저에서 열어서 보여줘.\n  ```\n- [ ] 브라우저에서 지도를 클릭해 날씨가 실제로 뜨는지 확인\n- [ ] `.env`(API 키를 넣어두는 전용 서랍 파일) 생성 — 값은 비워서 만들게 한 뒤 직접 채웁니다\n  ```\n  이 폴더에 .env 파일을 만들고 OPENAI_API_KEY 항목을 넣어줘.\n  값은 비워 두고, 내가 직접 채울게.\n  그리고 .gitignore 에 .env 를 추가해줘.\n  ```\n- [ ] 메모장으로 `.env` 열어 `OPENAI_API_KEY=` 뒤에 본인 키(`sk-...`) 붙여넣고 저장\n  - 파일명이 `.env.txt`로 저장되지 않았는지 확인 (탐색기에서 확장자 표시 켜기)\n- [ ] AI 챗봇 기능 추가 — 모델명은 본인 계정에서 실제 쓸 수 있는 것으로 (예: `gpt-4o-mini`, `gpt-4.1` 등. 잘 모르겠으면 Claude Code에게 \"내 OpenAI 계정에서 사용 가능한 모델 목록을 확인해줘\"라고 먼저 물어보세요)\n  ```\n  .env 의 OPENAI_API_KEY 를 환경변수로 읽어서 쓰고,\n  지금 보고 있는 지역의 날씨 데이터를 바탕으로\n  \"오늘 우산 필요해?\" 같은 질문에 답해주는 채팅창을 웹 앱에 추가해 줘.\n  키 값은 코드에 직접 쓰지 마.\n  ```\n- [ ] 채팅창에 \"오늘 우산 필요해?\" 입력 → 답변이 지금 선택한 지역의 실제 데이터를 근거로 하는지 확인\n- [ ] (선택) 개선 지시 한 번 던져보기 — 걸린 시간을 재보며 \"처음 만드는 시간 vs 고치는 시간\"이 어떻게 다른지 느껴보기\n  ```\n  예보를 표로 말고 그래프로 보여줘.\n  ```\n\n## 완료 기준\n- [ ] 지도 클릭 → 날씨/예보 표시됨\n- [ ] 채팅에 날씨 관련 질문 → 실제 데이터 근거로 답변\n- [ ] `.env`에 키가 있고, 코드 안에는 키가 직접 적혀있지 않음 (Claude Code에게 \"코드에 API 키가 하드코딩된 곳이 있는지 확인해줘\"로 재확인 권장 — 로그인 정보를 남이 볼 수 있는 곳에 그대로 적어두지 않았는지 확인하는 것과 같습니다)\n\n## 막히면\n| 증상 | 해결 |\n|---|---|\n| 지도가 회색 | 브라우저 새로고침 |\n| 채팅에서 401/키 오류 | `.env` 파일명·키 값 재확인 |\n| 요청이 너무 자주 막힘(사용량 제한) | OpenAI 대시보드에서 사용량 한도 확인 |\n\n다음: [02-RAG1 실습 가이드](실습가이드-02-RAG1.md)\n"}, {"id": "guide-2", "filename": "실습가이드-02-RAG1.md", "category": "guide", "badge": "2", "label": "RAG 1", "content": "# 실습 가이드 2 · RAG 1 — 저장과 검색 5단계 직접 관찰\n\n목표: RAG 5단계(파싱·청킹·임베딩·검색·생성)를 눈으로 확인하고, BM25·하이브리드 검색을 직접 붙여본다.\n\n원본은 [학습노트 02](02-RAG1-저장과검색.md) 참고. 원본은 배부된 `rag-lab.zip`(완성 앱)을 풀어서 시작하지만, 자습에서는 **Claude Code에게 동등한 앱을 직접 만들게** 합니다 — 오히려 \"이미 만들어진 앱 파악하기\"가 아니라 \"요구사항으로 앱 만들기\" 연습이 한 번 더 됩니다.\n\n## 준비물\n- [ ] 본인 PDF 문서 3~5개 (표·절 번호가 섞인 것일수록 학습 효과 좋음 — 회사 매뉴얼, 논문, 계약서, 보고서 등)\n\n## 체크리스트\n\n### 1. 폴더 생성 & 앱 부트스트랩\n```powershell\nmkdir C:\\ai-agent-selfstudy\\02-rag-lab\ncd C:\\ai-agent-selfstudy\\02-rag-lab\nclaude\n```\n아래 지시문을 그대로 붙여넣습니다 (rag-lab의 핵심 기능을 압축한 사양):\n```\n로컬 문서 기반 RAG 실습용 웹앱을 만들어줘. 파이썬(FastAPI 또는 Flask)+간단한 웹 UI로.\n\n[화면 구성 — 탭 4개]\n① 문서 탭: PDF 업로드. 업로드하면 페이지별로 추출된 글자 수를 막대그래프로 보여줘.\n   글자가 거의 안 나온 페이지는 빨간색으로 표시하고, 눌러서 그 페이지 원문(파싱 결과)을 볼 수 있게 해줘.\n② 청킹 탭: \"고정 길이\" / \"구조 경계(제목·번호)\" / \"문단\" 세 가지 기준을 선택해 미리보기 가능하게 해줘.\n   각 기준으로 조각(청크) 개수, 최장/최단 길이를 보여주고, 청크 카드를 눌러 전문을 펼칠 수 있게 해줘.\n③ 임베딩 탭: [적재] 버튼 — 선택한 청킹 기준으로 청크를 만들고, OpenAI 임베딩 API(text-embedding-3-small)로\n   벡터화해서 로컬 벡터 저장소(chromadb 사용)에 저장해줘. 적재된 청크 수를 화면에 표시해줘.\n④ 검색 탭: 질문을 입력하면 의미 검색으로 가장 가까운 청크 5개를 유사도 점수와 함께 보여줘.\n   각 청크를 펼치면 출처 문서명과 페이지 번호가 보이게 해줘.\n   [답변 생성] 토글 — 켜면 검색된 청크 + 질문을 OpenAI 모델에 넘겨 답변을 생성하고,\n   답변 아래에 실제 프롬프트로 들어간 글자 수도 표시해줘.\n\n[공통]\n- .env 파일에서 OPENAI_API_KEY 를 읽어서 쓰고, .gitignore 에 .env 추가해줘.\n- 청크에는 문서명·페이지·청킹기준 메타데이터를 함께 저장해줘 (나중에 필터링에 씀).\n- 상태 표시줄에 지금까지 적재된 문서 수와 청크 수를 항상 보여줘.\n- 다 만들면 실행 방법을 알려주고 서버를 실행해줘.\n```\n- [ ] `.env` 만들어달라고 요청 후 본인 OpenAI 키 입력\n- [ ] 앱 실행 확인 (Claude Code가 알려준 주소로 브라우저 접속)\n\n### 2. naive RAG 단계별 관찰\n- [ ] PDF 3~5개를 하나씩 업로드 → ① 탭에서 페이지별 추출 글자 수 확인, 빨간 칸(추출 실패 페이지) 있으면 원문과 대조\n- [ ] ② 탭에서 같은 문서를 3가지 청킹 기준으로 각각 미리보기 → 청크 개수·길이 비교, 문장이 중간에서 끊긴 조각 찾아보기\n- [ ] ③ 탭에서 [적재] — 문서 전부 적재, 청크 수 확인\n- [ ] ④ 탭에서 문서 내용에 대한 질문을 한국어로/영어로(문서가 영어라면) 각각 던져 비교\n- [ ] [답변 생성] 켜고 같은 질문 재실행 → 답변과 근거 청크 대조\n- [ ] 문서에 없는 내용을 일부러 질문 → 환각 여부 확인\n- [ ] 표나 그림 관련 내용을 질문 → 파싱에서 누락됐는지 확인\n\n### 3. BM25 + 하이브리드 검색 추가\n```\n이 앱의 검색 화면에 BM25(키워드) 검색을 추가해줘.\n검색 화면에서 의미 검색과 BM25 검색 결과를 좌우로 나란히 볼 수 있게 구현해줘.\n```\n(서버 재시작 후) 단어만 넣어 테스트: 문서에 나오는 고유명사, 숫자·기호가 섞인 표현, 오타 등\n\n```\n의미 검색과 BM25 의 결과를 하나로 합치는 하이브리드 검색을 추가해 줘.\n점수를 그대로 더하지 말고 순위로 결합해 줘.\n검색 화면에 [의미 검색] [BM25] [하이브리드] 세 열을 나란히 보여 줘.\n```\n\n### 4. 문서 추가 후 재질문\n- [ ] 판(버전)이나 항목명이 비슷한 문서를 하나 더 적재 (또는 같은 문서의 개정판이 있다면 함께)\n- [ ] 애매하게 겹칠 만한 질문을 던져 답변·근거 5개의 출처를 기록해두기 → **이 기록이 3교시(실습 가이드 3)의 출발점**\n\n## 완료 기준\n- [ ] 파싱·청킹·임베딩·검색·생성 5단계를 전부 화면에서 관찰함\n- [ ] BM25·하이브리드 검색이 동작하고 세 결과를 비교해봄\n- [ ] \"판이 다른 문서가 섞였을 때 답이 흔들리는\" 사례를 최소 1개 기록함\n\n## 막히면\n| 증상 | 해결 |\n|---|---|\n| chromadb 설치 오류 | Claude Code에게 \"chromadb 설치 오류 해결해줘\" |\n| 코드 수정 후 반영 안 됨 | 서버 재시작(`Ctrl+C` 후 재실행) |\n| PDF에서 표가 텍스트로 안 뽑힘 | 정상적인 현상 — 3교시에서 다룸 |\n\n다음: [03-RAG2 실습 가이드](실습가이드-03-RAG2.md) (같은 `rag-lab` 폴더에서 이어서 진행)\n", "cbCount": 15, "contentEasy": "# 실습 가이드 2 · RAG 1 — 저장과 검색 5단계 직접 관찰 (쉬운 설명 버전)\n\n목표: RAG 5단계(레퍼런스를 자르고·저장하고·찾고·답을 만드는 과정)를 눈으로 직접 보고, 두 가지 검색 방식을 붙여봅니다.\n\n원본은 [학습노트 02(쉬운 설명)](../02-RAG1-저장과검색.md) 참고. 원본은 미리 만들어진 앱 파일을 받아서 시작하지만, 자습에서는 **Claude Code에게 그 앱을 처음부터 직접 만들게** 합니다 — \"완성된 걸 파악하기\"보다 \"원하는 걸 설명해서 만들기\" 연습이 한 번 더 되는 셈이에요.\n\n## 준비물\n- [ ] 본인 PDF 문서 3~5개 (표가 섞인 문서일수록 배우기 좋아요 — 회사 매뉴얼, 논문, 계약서, 보고서 등)\n\n## 체크리스트\n\n### 1. 폴더 생성 & 앱 만들기\n```powershell\nmkdir C:\\ai-agent-selfstudy\\02-rag-lab\ncd C:\\ai-agent-selfstudy\\02-rag-lab\nclaude\n```\n아래 프롬프트를 그대로 붙여넣습니다:\n```\n로컬 문서 기반 RAG 실습용 웹앱을 만들어줘. 파이썬(FastAPI 또는 Flask)+간단한 웹 UI로.\n\n[화면 구성 — 탭 4개]\n① 문서 탭: PDF 업로드. 업로드하면 페이지별로 추출된 글자 수를 막대그래프로 보여줘.\n   글자가 거의 안 나온 페이지는 빨간색으로 표시하고, 눌러서 그 페이지 원문(파싱 결과)을 볼 수 있게 해줘.\n② 청킹 탭: \"고정 길이\" / \"구조 경계(제목·번호)\" / \"문단\" 세 가지 기준을 선택해 미리보기 가능하게 해줘.\n   각 기준으로 조각(청크) 개수, 최장/최단 길이를 보여주고, 청크 카드를 눌러 전문을 펼칠 수 있게 해줘.\n③ 임베딩 탭: [적재] 버튼 — 선택한 청킹 기준으로 청크를 만들고, OpenAI 임베딩 API(text-embedding-3-small)로\n   벡터화해서 로컬 벡터 저장소(chromadb 사용)에 저장해줘. 적재된 청크 수를 화면에 표시해줘.\n④ 검색 탭: 질문을 입력하면 의미 검색으로 가장 가까운 청크 5개를 유사도 점수와 함께 보여줘.\n   각 청크를 펼치면 출처 문서명과 페이지 번호가 보이게 해줘.\n   [답변 생성] 토글 — 켜면 검색된 청크 + 질문을 OpenAI 모델에 넘겨 답변을 생성하고,\n   답변 아래에 실제
