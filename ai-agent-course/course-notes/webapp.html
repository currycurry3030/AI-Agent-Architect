 프롬프트로 들어간 글자 수도 표시해줘.\n\n[공통]\n- .env 파일에서 OPENAI_API_KEY 를 읽어서 쓰고, .gitignore 에 .env 추가해줘.\n- 청크에는 문서명·페이지·청킹기준 메타데이터를 함께 저장해줘 (나중에 필터링에 씀).\n- 상태 표시줄에 지금까지 적재된 문서 수와 청크 수를 항상 보여줘.\n- 다 만들면 실행 방법을 알려주고 서버를 실행해줘.\n```\n- [ ] `.env`(API 키 서랍) 만들어달라고 요청 후 본인 OpenAI 키 입력\n- [ ] 앱 실행 확인 (Claude Code가 알려준 주소로 브라우저 접속)\n\n### 2. 5단계를 하나씩 눈으로 확인하기\n- [ ] PDF 3~5개를 하나씩 업로드 → ① 탭에서 페이지별 추출 글자 수 확인, 빨간 칸(글자가 잘 안 뽑힌 페이지) 있으면 원문과 대조\n- [ ] ② 탭에서 같은 문서를 3가지 청킹 기준(크롭 방식)으로 각각 미리보기 → 조각 개수·길이 비교, 문장이 중간에서 뚝 끊긴 조각 찾아보기\n- [ ] ③ 탭에서 [적재] — 문서 전부 저장, 조각 수 확인\n- [ ] ④ 탭에서 문서 내용에 대한 질문을 한국어로/영어로(문서가 영어라면) 각각 던져 비교\n- [ ] [답변 생성] 켜고 같은 질문 재실행 → 답변과 근거 조각 대조\n- [ ] 문서에 없는 내용을 일부러 질문 → AI가 지어내는지(환각) 확인\n- [ ] 표나 그림 관련 내용을 질문 → 처음부터 텍스트로 안 뽑혀서 답을 못 하는지 확인\n\n### 3. 두 번째 검색 방식(키워드 검색) 추가\n```\n이 앱의 검색 화면에 BM25(키워드) 검색을 추가해줘.\n검색 화면에서 의미 검색과 BM25 검색 결과를 좌우로 나란히 볼 수 있게 구현해줘.\n```\n(서버 재시작 후) 단어만 넣어 테스트: 문서에 나오는 고유명사, 숫자·기호가 섞인 표현, 오타 등\n\n```\n의미 검색과 BM25 의 결과를 하나로 합치는 하이브리드 검색을 추가해 줘.\n점수를 그대로 더하지 말고 순위로 결합해 줘.\n검색 화면에 [의미 검색] [BM25] [하이브리드] 세 열을 나란히 보여 줘.\n```\n\n### 4. 문서를 늘리고 다시 질문하기\n- [ ] 버전이나 항목명이 비슷한 문서를 하나 더 저장 (또는 같은 문서의 개정판이 있다면 함께)\n- [ ] 애매하게 겹칠 만한 질문을 던져 답변·근거 5개의 출처를 적어두기 → **이 기록이 3단계 가이드의 출발점**\n\n## 완료 기준\n- [ ] 5단계(자르고·저장하고·찾고·답 만들기)를 전부 화면에서 직접 관찰함\n- [ ] 두 검색 방식을 붙여서 세 결과를 비교해봄\n- [ ] \"버전이 다른 문서가 섞였을 때 답이 흔들리는\" 사례를 최소 1개 기록함\n\n## 막히면\n| 증상 | 해결 |\n|---|---|\n| 벡터 저장소(chromadb) 설치 오류 | Claude Code에게 \"chromadb 설치 오류 해결해줘\" |\n| 코드 수정 후 반영 안 됨 | 서버 재시작(`Ctrl+C` 후 재실행) |\n| PDF에서 표가 텍스트로 안 뽑힘 | 정상적인 현상 — 3단계 가이드에서 다룸 |\n\n다음: [03-RAG2 실습 가이드](실습가이드-03-RAG2.md) (같은 `rag-lab` 폴더에서 이어서 진행)\n"}, {"id": "guide-3", "filename": "실습가이드-03-RAG2.md", "category": "guide", "badge": "3", "label": "RAG 2", "content": "# 실습 가이드 3 · RAG 2 — 검색 실패 진단과 처방\n\n목표: \"증상 확인 → 원인 분리 → 처방 선택 → 숫자로 재확인\"의 고치는 순서를 직접 실행해본다. 02에서 만든 `rag-lab` 폴더를 이어서 사용.\n\n원본은 [학습노트 03](03-RAG2-검색개선.md) 참고.\n\n## 체크리스트\n\n### 1. 증상 확인 (02 마지막에 기록해둔 것부터)\n- [ ] 02-4단계에서 발견한 \"답이 흔들리는\" 질문을 다시 던져 답변과 근거 5개를 원문과 대조\n- [ ] 판별: 근거 청크 안에 답변 내용이 실제로 있는가? → 있으면 검색 문제, 없으면 생성 문제\n\n### 2. Reranking 붙이기\n```\n검색에 Reranking 을 추가해 줘.\n- 재정렬을 켜고 끌 수 있는 토글을 만들어 줘.\n- 1차 검색으로 후보 10개를 꺼내고, 그 후보를 질문과 함께 LLM 에 넘겨 다시 순서를 매겨 줘.\n- 재정렬 결과 상위 5개를 답변 생성의 근거로 써 줘.\n- 재정렬에 걸린 시간을 화면에 표시해 줘.\n```\n(서버 재시작) 토글 켜고/끄고 같은 질문 비교 → 답변, 근거, 걸린 시간 기록\n\n### 3. Metadata Filter 붙이기\n```\n검색에 문서 단위 필터를 추가해 줘.\n- 적재된 문서 목록을 화면에 보여주고, 체크박스로 검색 대상을 고를 수 있게 해 줘.\n- 고른 문서 안에서만 검색이 일어나게 해 줘.\n- 아무것도 고르지 않으면 전체를 대상으로 해 줘.\n```\n(서버 재시작) 같은 질문을 \"필터 없음\" / \"문서 A만\" / \"문서 B만\" 세 조건으로 비교\n\n### 4. 처방 비교 정리\n- [ ] Reranking이 고친 것 vs Metadata Filter가 고친 것을 한 문장씩 적어보기\n- [ ] 02에서 발견한 증상에는 어느 처방이 맞았는지 결론 내기\n\n### 5. Query Rewrite 붙이기 (짧은 질의 문제)\n- [ ] 02에서 단어 검색(숫자·한 단어 질의)이 헛돌았던 사례가 있으면 재확인, 없으면 새로 시도\n```\n검색 전에 질의를 다시 쓰는 단계를 추가해 줘.\n- 사용자가 넣은 질의를 LLM 에 넘겨 검색에 맞는 형태로 바꾸고, 바뀐 질의로 검색해 줘.\n- 원래 질의와 다시 쓴 질의를 화면에 나란히 보여 줘.\n- 이 단계를 켜고 끌 수 있는 토글을 만들어 줘.\n```\n개선(저장소 맥락 부여):\n```\n질의 재작성 프롬프트를 고쳐 줘.\n- 저장소에 적재된 문서 목록을 프롬프트에 넣어 줘.\n- 그 문서들의 맥락 안에서 질의를 해석하도록 지시해 줘.\n- 저장소 밖의 뜻으로 넓히지 말라고 명시해 줘.\n```\n\n### 6. 자동 채점 (LLM-as-a-Judge)\n- [ ] 본인 문서에 대한 질문-정답 5개를 직접 만들어 `grading.json` 형태로 정리 (아래 형식 참고)\n```json\n[\n  {\"q\": \"질문1\", \"expected\": \"기대하는 답의 핵심 요소\"},\n  {\"q\": \"질문2\", \"expected\": \"...\"}\n]\n```\n```\n답변 품질을 채점하는 기능을 추가해 줘.\n- grading.json 을 읽어서, 각 질문을 앱에 던지고 답변을 받아 줘.\n- 그 답변을 기대하는 답과 비교해 1~5점으로 채점하고 이유를 한 줄로 적게 해 줘.\n- 결과를 표로 보여주고 평균 점수를 계산해 줘.\n```\n- [ ] 조건별(무처방/필터만/재작성만/재정렬만/셋다)로 라운드를 돌려 평균 점수·시간 기록\n  ```\n  라운드 0 (기준선): 평균 ___점\n  라운드 1 (Reranking): 평균 ___점\n  라운드 2 (Metadata Filter): 평균 ___점\n  라운드 3 (Query Rewrite): 평균 ___점\n  라운드 4 (셋 다): 평균 ___점\n  ```\n- [ ] 점수가 이상한 문항 1~2개는 사람이 직접 원문 대조 (채점자도 틀린다)\n\n## 완료 기준\n- [ ] Reranking·Metadata Filter·Query Rewrite 세 처방을 모두 붙여봄\n- [ ] 자동 채점으로 최소 2개 조건 이상을 숫자로 비교함\n- [ ] \"이 증상엔 이 처방\"이라는 결론을 최소 1개 문장으로 정리함\n\n다음: [04-ToolCalling 실습 가이드](실습가이드-04-ToolCalling.md) (새 폴더 `agent-lab`에서 시작)\n", "cbCount": 11, "contentEasy": "# 실습 가이드 3 · RAG 2 — 검색 실패 진단과 처방 (쉬운 설명 버전)\n\n목표: \"증상 확인 → 원인 찾기 → 처방 → 진짜 나아졌는지 재확인\" 순서를 직접 실행해봅니다. 02에서 만든 `rag-lab` 폴더를 이어서 사용.\n\n원본은 [학습노트 03(쉬운 설명)](../03-RAG2-검색개선.md) 참고.\n\n## 체크리스트\n\n### 1. 증상 확인 (02 마지막에 기록해둔 것부터)\n- [ ] 02-4단계에서 발견한 \"답이 흔들리는\" 질문을 다시 던져 답변과 근거 5개를 원문과 대조\n- [ ] 판별: 근거 조각 안에 답변 내용이 실제로 있는가? → 있으면 \"검색이 애매한 걸 골라온 문제\", 없으면 \"AI가 요약을 잘못한 문제\"\n\n### 2. Reranking (2차 심사) 붙이기\n```\n검색에 Reranking 을 추가해 줘.\n- 재정렬을 켜고 끌 수 있는 토글을 만들어 줘.\n- 1차 검색으로 후보 10개를 꺼내고, 그 후보를 질문과 함께 LLM 에 넘겨 다시 순서를 매겨 줘.\n- 재정렬 결과 상위 5개를 답변 생성의 근거로 써 줘.\n- 재정렬에 걸린 시간을 화면에 표시해 줘.\n```\n(서버 재시작) 토글 켜고/끄고 같은 질문 비교 → 답변, 근거, 걸린 시간 기록\n\n### 3. Metadata Filter (태그로 미리 거르기) 붙이기\n```\n검색에 문서 단위 필터를 추가해 줘.\n- 적재된 문서 목록을 화면에 보여주고, 체크박스로 검색 대상을 고를 수 있게 해 줘.\n- 고른 문서 안에서만 검색이 일어나게 해 줘.\n- 아무것도 고르지 않으면 전체를 대상으로 해 줘.\n```\n(서버 재시작) 같은 질문을 \"필터 없음\" / \"문서 A만\" / \"문서 B만\" 세 조건으로 비교\n\n### 4. 처방 비교 정리\n- [ ] Reranking이 고친 것 vs Metadata Filter가 고친 것을 한 문장씩 적어보기\n- [ ] 02에서 발견한 증상에는 어느 처방이 맞았는지 결론 내기\n\n### 5. Query Rewrite (검색어 다시 쓰기) 붙이기 — 짧은 검색어 문제\n- [ ] 02에서 단어 검색(숫자·한 단어짜리 질문)이 헛돌았던 사례가 있으면 재확인, 없으면 새로 시도\n```\n검색 전에 질의를 다시 쓰는 단계를 추가해 줘.\n- 사용자가 넣은 질의를 LLM 에 넘겨 검색에 맞는 형태로 바꾸고, 바뀐 질의로 검색해 줘.\n- 원래 질의와 다시 쓴 질의를 화면에 나란히 보여 줘.\n- 이 단계를 켜고 끌 수 있는 토글을 만들어 줘.\n```\n개선(저장소 맥락을 미리 알려주기):\n```\n질의 재작성 프롬프트를 고쳐 줘.\n- 저장소에 적재된 문서 목록을 프롬프트에 넣어 줘.\n- 그 문서들의 맥락 안에서 질의를 해석하도록 지시해 줘.\n- 저장소 밖의 뜻으로 넓히지 말라고 명시해 줘.\n```\n\n### 6. 자동 채점 (AI에게 채점까지 시키기)\n- [ ] 본인 문서에 대한 질문-정답 5개를 직접 만들어 `grading.json`(채점용 답안지 파일) 형태로 정리\n```json\n[\n  {\"q\": \"질문1\", \"expected\": \"기대하는 답의 핵심 요소\"},\n  {\"q\": \"질문2\", \"expected\": \"...\"}\n]\n```\n```\n답변 품질을 채점하는 기능을 추가해 줘.\n- grading.json 을 읽어서, 각 질문을 앱에 던지고 답변을 받아 줘.\n- 그 답변을 기대하는 답과 비교해 1~5점으로 채점하고 이유를 한 줄로 적게 해 줘.\n- 결과를 표로 보여주고 평균 점수를 계산해 줘.\n```\n- [ ] 조건별(무처방/필터만/재작성만/재정렬만/셋다)로 라운드를 돌려 평균 점수·시간 기록\n  ```\n  라운드 0 (기준선): 평균 ___점\n  라운드 1 (Reranking): 평균 ___점\n  라운드 2 (Metadata Filter): 평균 ___점\n  라운드 3 (Query Rewrite): 평균 ___점\n  라운드 4 (셋 다): 평균 ___점\n  ```\n- [ ] 점수가 이상한 문항 1~2개는 사람이 직접 원문 대조 (채점하는 AI도 가끔 틀립니다)\n\n## 완료 기준\n- [ ] Reranking·Metadata Filter·Query Rewrite 세 처방을 모두 붙여봄\n- [ ] 자동 채점으로 최소 2개 조건 이상을 숫자로 비교함\n- [ ] \"이 증상엔 이 처방\"이라는 결론을 최소 1개 문장으로 정리함\n\n다음: [04-ToolCalling 실습 가이드](실습가이드-04-ToolCalling.md) (새 폴더 `agent-lab`에서 시작)\n"}, {"id": "guide-4", "filename": "실습가이드-04-ToolCalling.md", "category": "guide", "badge": "4", "label": "Tool Calling", "content": "# 실습 가이드 4 · Tool Calling — 도구 설명문이 선택을 좌우한다\n\n목표: AI가 도구를 \"설명문만 보고\" 고른다는 것을 직접 뒤집어보며 확인한다.\n\n원본은 [학습노트 04](04-ToolCalling.md) 참고. 원본은 배부된 `agent-lab.zip`으로 시작하지만, 자습에서는 Claude Code에게 동등한 앱을 만들게 합니다.\n\n## 체크리스트\n\n### 1. 폴더 생성 & 앱 부트스트랩\n```powershell\nmkdir C:\\ai-agent-selfstudy\\04-agent-lab\ncd C:\\ai-agent-selfstudy\\04-agent-lab\nclaude\n```\n```\nTool Calling 실습용 웹앱을 만들어줘. 파이썬(FastAPI 등) + 간단한 웹 UI로, OpenAI 함수 호출(function calling) 사용.\n\n[기능]\n- 메모(note) 저장/조회 도구 3개를 만들어줘: 저장(memo_tool_1), 조회(memo_tool_2), 삭제(memo_tool_3).\n  각 도구는 인자로 text 하나만 받아. 메모는 로컬 JSON 파일(data/notes.json)에 저장해줘.\n- 화면 왼쪽에 도구 목록을 보여줘: 이름 / 설명문(텍스트박스로 직접 수정 가능, [적용] 버튼) / 인자.\n  설명문을 수정하면 코드는 안 건드리고 즉시 그 설명문으로 OpenAI에 전달되게 해줘 (재시작 불필요).\n  [설명문 되돌리기] 버튼도 만들어줘.\n- 화면 왼쪽 아래에 \"역할(시스템 프롬프트)\" 텍스트박스를 만들어줘. 여기 적은 내용이 그대로 시스템 프롬프트로 들어가게 해줘.\n  [되돌리기] 버튼도 만들어줘.\n- 화면 왼쪽 아래에 데이터 파일 경로를 보여주고 수정할 수 있게 해줘 (도구 실패 테스트용).\n- 화면 오른쪽에 \"물어보기\" 입력창과 답변, 그 아래 호출 로그(어떤 도구를 어떤 인자로 불렀는지, 도구가 뭘 반환했는지)를 보여줘.\n- 화면 오른쪽 아래에 현재 저장된 메모 목록을 실시간으로 보여줘. [메모 초기화] 버튼도 만들어줘.\n- .env 에서 OPENAI_API_KEY 를 읽어서 쓰고, .gitignore 에 .env 추가해줘.\n- 다 만들면 실행 방법을 알려주고 서버를 실행해줘.\n```\n- [ ] `.env`에 본인 OpenAI 키 입력\n- [ ] 앱 실행 및 브라우저 접속 확인\n\n### 2. 기본 동작 관찰\n- [ ] `회의 메모 좀 찾아줘` → 어느 도구가 불렸는지 호출 로그 확인\n- [ ] `내일 오후 3시에 품질 회의 있다고 메모해줘` → 어느 도구가 불렸는지 확인\n\n### 3. 설명문 뒤바꾸기 실험\n- [ ] `memo_tool_1`(저장) 설명문 → `\"저장된 메모 중 키워드에 해당하는 것을 찾아 목록으로 보여준다.\"`로 변경\n- [ ] `memo_tool_2`(조회) 설명문 → `\"새 메모를 저장한다.\"`로 변경\n- [ ] 2번의 질문 2개를 다시 던져 **선택이 뒤집히는지** 확인 (코드/앱 재시작 없이)\n- [ ] [설명문 되돌리기]로 원복\n\n### 4. 애매한 설명문 vs 명확한 설명문\n- [ ] 두 도구 설명문을 일부러 애매하게 바꿔보고(\"메모 관련 작업을 처리한다\" 등) 질문 재실행 → 혼동 확인\n- [ ] 직접 \"무엇을 하는지\"가 아니라 \"어떤 경우에 쓰는지\" 기준으로 설명문을 다시 써서 확실히 갈리게 만들기\n\n### 5. 역할 프롬프트로 행동 제한하기\n- [ ] 역할 칸 비운 채 `회의 메모 삭제해줘` → 삭제됨\n- [ ] `메모 초기화` 후, 역할 칸에 `너는 메모 조회 담당이다. 조회만 한다.` 추가 → 삭제 요청 재시도\n- [ ] 표현을 바꿔서(`이제 필요 없어. 정리해줘` 등) 우회되는지 시도\n- [ ] `메모를 수정하거나 삭제하는 일은 어떤 경우에도 하지 않는다.` 문구 추가 후 재시도\n- [ ] 결론: 도구는 계속 존재했다 — 문구만으로 막는 방식의 한계를 한 문장으로 정리\n\n### 6. 도구 하나 추가 (수정 기능)\n```\nmemo_tool_4 를 추가해줘.\n- 파라미터는 다른 도구들과 똑같이 text 하나만 써야 해.\n- 키워드로 메모를 찾아 내용을 새 내용으로 바꾸는 동작이야.\n- 화면 도구 목록에 나타나고, 설명문도 화면에서 고칠 수 있어야 해.\n- 잘못된 인자가 오면 어떤 형태로 넣어야 하는지 알려주는 오류를 돌려줘.\n```\n(서버 재시작) 설명문을 직접 작성해서 `품질 회의 안건 메모의 내용을 '차주 월요일 10시로 변경'으로 바꿔줘` 실행 → 의도대로 동작할 때까지 설명문 다듬기\n\n### 7. 도구 실패 시 관찰\n- [ ] 데이터 파일 경로를 존재하지 않는 값으로 바꾸고 질문 → AI의 대응 관찰\n- [ ] 경로 원복\n\n## 완료 기준\n- [ ] 설명문만 바꿔서 도구 선택이 뒤집히는 걸 직접 확인함\n- [ ] 역할 프롬프트로 막았다가 표현을 바꿔 뚫리는 걸(또는 안 뚫리는 걸) 확인함\n- [ ] 도구 1개를 새로 추가하고 설명문을 다듬어 정확히 동작시킴\n\n다음: [05-MCP 실습 가이드](실습가이드-05-MCP.md) (같은 `agent-lab` 폴더에서 이어서 진행)\n", "cbCount": 20, "contentEasy": "# 실습 가이드 4 · Tool Calling — 도구 설명문이 선택을 좌우한다 (쉬운 설명 버전)\n\n목표: AI가 도구(포토샵 액션 같은 것)를 \"이름표(설명문)만 보고\" 고른다는 걸 직접 뒤집어보며 확인합니다.\n\n원본은 [학습노트 04(쉬운 설명)](../04-ToolCalling.md) 참고. 원본은 미리 만든 앱으로 시작하지만, 자습에서는 Claude Code에게 그 앱을 직접 만들게 합니다.\n\n## 체크리스트\n\n### 1. 폴더 생성 & 앱 만들기\n```powershell\nmkdir C:\\ai-agent-selfstudy\\04-agent-lab\ncd C:\\ai-agent-selfstudy\\04-agent-lab\nclaude\n```\n```\nTool Calling 실습용 웹앱을 만들어줘. 파이썬(FastAPI 등) + 간단한 웹 UI로, OpenAI 함수 호출(function calling) 사용.\n\n[기능]\n- 메모(note) 저장/조회 도구 3개를 만들어줘: 저장(memo_tool_1), 조회(memo_tool_2), 삭제(memo_tool_3).\n  각 도구는 인자로 text 하나만 받아. 메모는 로컬 JSON 파일(data/notes.json)에 저장해줘.\n- 화면 왼쪽에 도구 목록을 보여줘: 이름 / 설명문(텍스트박스로 직접 수정 가능, [적용] 버튼) / 인자.\n  설명문을 수정하면 코드는 안 건드리고 즉시 그 설명문으로 OpenAI에 전달되게 해줘 (재시작 불필요).\n  [설명문 되돌리기] 버튼도 만들어줘.\n- 화면 왼쪽 아래에 \"역할(시스템 프롬프트)\" 텍스트박스를 만들어줘. 여기 적은 내용이 그대로 시스템 프롬프트로 들어가게 해줘.\n  [되돌리기] 버튼도 만들어줘.\n- 화면 왼쪽 아래에 데이터 파일 경로를 보여주고 수정할 수 있게 해줘 (도구 실패 테스트용).\n- 화면 오른쪽에 \"물어보기\" 입력창과 답변, 그 아래 호출 로그(어떤 도구를 어떤 인자로 불렀는지, 도구가 뭘 반환했는지)를 보여줘.\n- 화면 오른쪽 아래에 현재 저장된 메모 목록을 실시간으로 보여줘. [메모 초기화] 버튼도 만들어줘.\n- .env 에서 OPENAI_API_KEY 를 읽어서 쓰고, .gitignore 에 .env 추가해줘.\n- 다 만들면 실행 방법을 알려주고 서버를 실행해줘.\n```\n- [ ] `.env`(API 키 서랍)에 본인 OpenAI 키 입력\n- [ ] 앱 실행 및 브라우저 접속 확인\n\n### 2. 기본 동작 관찰\n- [ ] `회의 메모 좀 찾아줘` → 어느 도구(액션)가 불렸는지 호출 로그 확인\n- [ ] `내일 오후 3시에 품질 회의 있다고 메모해줘` → 어느 도구가 불렸는지 확인\n\n### 3. 이름표(설명문) 뒤바꾸기 실험\n- [ ] `memo_tool_1`(저장) 설명문 → `\"저장된 메모 중 키워드에 해당하는 것을 찾아 목록으로 보여준다.\"`로 변경\n- [ ] `memo_tool_2`(조회) 설명문 → `\"새 메모를 저장한다.\"`로 변경\n- [ ] 2번의 질문 2개를 다시 던져 **선택이 뒤집히는지** 확인 (코드/앱 재시작 없이 — 이름표만 바꿨는데도!)\n- [ ] [설명문 되돌리기]로 원복\n\n### 4. 애매한 이름표 vs 명확한 이름표\n- [ ] 두 도구 설명문을 일부러 애매하게 바꿔보고(\"메모 관련 작업을 처리한다\" 등) 질문 재실행 → AI가 헷갈려하는지 확인\n- [ ] \"무엇을 하는지\"가 아니라 \"어떤 상황에 쓰는지\" 기준으로 설명문을 직접 다시 써서 확실히 갈리게 만들기\n\n### 5. 직무기술서(역할 프롬프트)로 행동 제한하기\n- [ ] 역할 칸 비운 채 `회의 메모 삭제해줘` → 삭제됨\n- [ ] `메모 초기화` 후, 역할 칸에 `너는 메모 조회 담당이다. 조회만 한다.` 추가 → 삭제 요청 재시도\n- [ ] 표현을 바꿔서(`이제 필요 없어. 정리해줘` 등) 우회되는지 시도\n- [ ] `메모를 수정하거나 삭제하는 일은 어떤 경우에도 하지 않는다.` 문구 추가 후 재시도\n- [ ] 결론: 도구(액션)는 계속 그 자리에 있었습니다 — 문구만으로 막는 방식의 한계를 한 문장으로 정리\n\n### 6. 도구(액션) 하나 직접 추가하기 (수정 기능)\n```\nmemo_tool_4 를 추가해줘.\n- 파라미터는 다른 도구들과 똑같이 text 하나만 써야 해.\n- 키워드로 메모를 찾아 내용을 새 내용으로 바꾸는 동작이야.\n- 화면 도구 목록에 나타나고, 설명문도 화면에서 고칠 수 있어야 해.\n- 잘못된 인자가 오면 어떤 형태로 넣어야 하는지 알려주는 오류를 돌려줘.\n```\n(서버 재시작) 설명문을 직접 작성해서 `품질 회의 안건 메모의 내용을 '차주 월요일 10시로 변경'으로 바꿔줘` 실행 → 의도대로 동작할 때까지 설명문 다듬기\n\n### 7. 도구가 실패하면 어떻게 되는지 관찰\n- [ ] 데이터 파일 경로를 존재하지 않는 값으로 바꾸고 질문 → AI의 대응 관찰\n- [ ] 경로 원복\n\n## 완료 기준\n- [ ] 이름표(설명문)만 바꿔서 도구 선택이 뒤집히는 걸 직접 확인함\n- [ ] 직무기술서(역할 프롬프트)로 막았다가 표현을 바꿔 뚫리는 걸(또는 안 뚫리는 걸) 확인함\n- [ ] 도구 1개를 새로 추가하고 설명문을 다듬어 정확히 동작시킴\n\n다음: [05-MCP 실습 가이드](실습가이드-05-MCP.md) (같은 `agent-lab` 폴더에서 이어서 진행)\n"}, {"id": "guide-5", "filename": "실습가이드-05-MCP.md", "category": "guide", "badge": "5", "label": "MCP", "content": "# 실습 가이드 5 · MCP — 서버 연결로 도구 늘리기\n\n목표: 성격이 다른 로컬/원격 MCP 서버를 실제로 연결해보고, 붙이는 절차가 왜 항상 \"버튼 하나\"인지 체감한다. 04에서 만든 `agent-lab`을 이어서 사용.\n\n원본은 [학습노트 05](05-MCP.md) 참고. 원본이 쓰는 사내 전용 \"자료 조사 서버\"는 배포 불가라, **직접 만드는 로컬 MCP 서버**로 대체하고, Microsoft Learn(실재 공개 서버)·Tavily(본인 키)는 원본과 동일하게 진행합니다.\n\n## 체크리스트\n\n### 1. MCP 연결 기능을 앱에 추가\n```\n이 앱에 MCP(Model Context Protocol) 서버 연결 기능을 추가해줘.\n- mcp_catalog.json 파일에 서버 목록(이름, 로컬이면 command/args, 원격이면 url)을 등록하는 구조로 만들어줘.\n- [MCP] 탭을 추가해서 카탈로그의 서버들을 목록으로 보여주고, 각 서버 옆에 [연결]/[끊기] 버튼을 넣어줘.\n- 연결하면 그 서버가 제공하는 도구들을 가져와서 기존 도구 목록에 합쳐줘. 도구 옆에 어느 서버 출신인지 표시해줘.\n- 끊으면 그 서버의 도구가 목록에서 사라지게 해줘.\n- [도구] 탭의 \"지금 쓸 수 있는 도구\" 목록에 MCP로 붙은 도구도 함께 보이게 해줘.\n```\n(서버 재시작)\n\n### 2. 로컬 MCP 서버 직접 만들기 (자료 조사 서버 대체)\n- [ ] 참고할 짧은 문서(md) 2~3개를 `docs/` 폴더에 준비 (본인 관심 주제로 직접 작성해도 됨)\n```\nmcp-servers/doc-search 폴더에 간단한 MCP 서버를 만들어줘 (파이썬, stdio 방식).\n- 도구 이름은 doc_search, 인자는 query(string) 하나.\n- docs/ 폴더의 md 파일들에서 query와 관련된 부분을 찾아 텍스트로 반환해줘.\n- mcp_catalog.json 에 \"자료 조사 서버\"라는 이름으로 등록해줘 (command: python, args: 이 서버 경로).\n```\n(서버 재시작) `[MCP]` 탭에서 연결 → `[도구]` 탭에서 문서 내용 관련 질문 던져보기\n\n### 3. 연결이 곧 프로세스라는 것 확인\n```powershell\nGet-Process python\n```\n- [ ] 자료 조사 서버 연결 상태에서 프로세스 수 확인\n- [ ] `[MCP]` 탭에서 연결 끊고 다시 확인 → 프로세스 수 변화 관찰\n\n### 4. 원격 공개 서버 연결 — Microsoft Learn\n```\nmcp_catalog.json 에 Microsoft Learn 문서 서버를 추가해줘.\nurl은 https://learn.microsoft.com/api/mcp 야. 이름은 \"Microsoft Learn 문서 서버\"로 표시해줘.\n```\n(서버 재시작) 연결 → `Get-Process python`으로 로컬 프로세스 수가 안 느는 것 확인 (원격이라서) → 질문 테스트\n```\nPowerShell 실행 정책을 CurrentUser 만 RemoteSigned 로 바꾸는 명령은?\n```\n\n### 5. 두 서버 갈림길 테스트\n- [ ] 두 서버 모두에 걸릴 법한 질문을 던져 어느 도구가 선택되는지, 왜 그런지 설명문을 비교해 확인\n\n### 6. 원격 API 키 서버 — Tavily 웹 검색\n- [ ] `app.tavily.com`에서 발급받은 키를 `.env`에 추가: `TAVILY_API_KEY=발급받은키`\n```\nmcp_catalog.json 에 Tavily 웹 검색 서버를 추가해 줘.\n- 원격 HTTP 서버이고, 주소 형식은 https://mcp.tavily.com/mcp/?tavilyApiKey=<API키> 야.\n- API 키는 .env 의 TAVILY_API_KEY 에서 읽어서 채워줘. 카탈로그 파일에 키가 그대로 적히면 안 돼.\n- 화면의 서버 목록에 \"Tavily 웹 검색\" 으로 보이게 해 줘.\n```\n(서버 재시작) 연결 → `오늘 주요 뉴스 알려줘` 테스트 → 확인 끝나면 연결 끊어두기\n\n## 완료 기준\n- [ ] 로컬 서버(자체 제작)와 원격 서버(Microsoft Learn) 둘 다 \"버튼 하나\"로 연결/해제됨을 확인\n- [ ] 연결 여부에 따라 로컬 프로세스 수가 달라지는 것을 확인\n- [ ] API 키가 필요한 원격 서버(Tavily)까지 등록해 실제 웹 검색을 성공시킴\n\n다음: [06-MultiAgent 실습 가이드](실습가이드-06-MultiAgent.md) (같은 `agent-lab` 폴더에서 이어서 진행)\n", "cbCount": 8, "contentEasy": "# 실습 가이드 5 · MCP — 서버 연결로 도구 늘리기 (쉬운 설명 버전)\n\n목표: 성격이 다른 \"내 컴퓨터용 플러그인\"과 \"인터넷 저편의 플러그인\"을 실제로 연결해보고, 설치 절차가 왜 항상 \"버튼 하나\"인지 체감합니다. 04에서 만든 `agent-lab`을 이어서 사용.\n\n원본은 [학습노트 05(쉬운 설명)](../05-MCP.md) 참고. 원본이 쓰는 사내 전용 플러그인은 나눠드릴 수 없어서, **직접 만드는 나만의 플러그인**으로 대체하고, Microsoft Learn(실제로 존재하는 공개 서버)·Tavily(본인 키로 발급)는 원본과 동일하게 진행합니다.\n\n## 체크리스트\n\n### 1. 플러그인 연결 기능을 앱에 추가\n```\n이 앱에 MCP(Model Context Protocol) 서버 연결 기능을 추가해줘.\n- mcp_catalog.json 파일에 서버 목록(이름, 로컬이면 command/args, 원격이면 url)을 등록하는 구조로 만들어줘.\n- [MCP] 탭을 추가해서 카탈로그의 서버들을 목록으로 보여주고, 각 서버 옆에 [연결]/[끊기] 버튼을 넣어줘.\n- 연결하면 그 서버가 제공하는 도구들을 가져와서 기존 도구 목록에 합쳐줘. 도구 옆에 어느 서버 출신인지 표시해줘.\n- 끊으면 그 서버의 도구가 목록에서 사라지게 해줘.\n- [도구] 탭의 \"지금 쓸 수 있는 도구\" 목록에 MCP로 붙은 도구도 함께 보이게 해줘.\n```\n(서버 재시작)\n\n### 2. 나만의 플러그인 직접 만들기 (사내 전용 서버 대체)\n- [ ] 참고할 짧은 문서(md) 2~3개를 `docs/` 폴더에 준비 (본인 관심 주제로 직접 써도 됩니다)\n```\nmcp-servers/doc-search 폴더에 간단한 MCP 서버를 만들어줘 (파이썬, stdio 방식).\n- 도구 이름은 doc_search, 인자는 query(string) 하나.\n- docs/ 폴더의 md 파일들에서 query와 관련된 부분을 찾아 텍스트로 반환해줘.\n- mcp_catalog.json 에 \"자료 조사 서버\"라는 이름으로 등록해줘 (command: python, args: 이 서버 경로).\n```\n(서버 재시작) `[MCP]` 탭에서 연결 → `[도구]` 탭에서 문서 내용 관련 질문 던져보기\n\n### 3. \"연결\"은 실제 프로그램이 하나 더 켜지는 것임을 확인\n```powershell\nGet-Process python\n```\n- [ ] 방금 만든 플러그인이 연결된 상태에서 실행 중인 개수 확인\n- [ ] `[MCP]` 탭에서 연결 끊고 다시 확인 → 개수 변화 관찰\n\n### 4. 인터넷 저편의 공개 플러그인 연결 — Microsoft Learn\n```\nmcp_catalog.json 에 Microsoft Learn 문서 서버를 추가해줘.\nurl은 https://learn.microsoft.com/api/mcp 야. 이름은 \"Microsoft Learn 문서 서버\"로 표시해줘.\n```\n(서버 재시작) 연결 → `Get-Process python`으로 개수가 안 느는 것 확인 (인터넷 저편에 있어서 내 컴퓨터엔 새 프로그램이 안 뜸) → 질문 테스트\n```\nPowerShell 실행 정책을 CurrentUser 만 RemoteSigned 로 바꾸는 명령은?\n```\n\n### 5. 두 플러그인 중 뭘 고르는지 테스트\n- [ ] 두 서버 모두에 걸릴 법한 질문을 던져 어느 도구가 선택되는지, 왜 그런지 이름표(설명문)를 비교해 확인\n\n### 6. 인증서(API 키)가 필요한 플러그인 — Tavily 웹 검색\n- [ ] `app.tavily.com`에서 발급받은 키를 `.env`에 추가: `TAVILY_API_KEY=발급받은키`\n```\nmcp_catalog.json 에 Tavily 웹 검색 서버를 추가해 줘.\n- 원격 HTTP 서버이고, 주소 형식은 https://mcp.tavily.com/mcp/?tavilyApiKey=<API키> 야.\n- API 키는 .env 의 TAVILY_API_KEY 에서 읽어서 채워줘. 카탈로그 파일에 키가 그대로 적히면 안 돼.\n- 화면의 서버 목록에 \"Tavily 웹 검색\" 으로 보이게 해 줘.\n```\n(서버 재시작) 연결 → `오늘 주요 뉴스 알려줘` 테스트 → 확인 끝나면 연결 끊어두기\n\n## 완료 기준\n- [ ] 내가 만든 플러그인과 남이 만든 원격 플러그인(Microsoft Learn) 둘 다 \"버튼 하나\"로 연결/해제됨을 확인\n- [ ] 연결 여부에 따라 내 컴퓨터에서 실행 중인 프로그램 개수가 달라지는 것을 확인\n- [ ] 인증서(API 키)가 필요한 원격 플러그인(Tavily)까지 등록해 실제 웹 검색을 성공시킴\n\n다음: [06-MultiAgent 실습 가이드](실습가이드-06-MultiAgent.md) (같은 `agent-lab` 폴더에서 이어서 진행)\n"}, {"id": "guide-6", "filename": "실습가이드-06-MultiAgent.md", "category": "guide", "badge": "6", "label": "Multi-Agent", "content": "# 실습 가이드 6 · Multi-Agent — 역할을 나눠 연구를 맡긴다\n\n목표: 연구책임자·자료조사·실험수행 세 역할이 서로 다른 도구/지시로 협업하는 걸 직접 돌려보고, 왜 나누는지 체감한다. 05에서 만든 `agent-lab`을 이어서 사용.\n\n원본은 [학습노트 06](06-MultiAgent.md) 참고.\n\n## 체크리스트\n\n### 1. 가상 데이터 CSV 준비\n본인 관심 주제로 간단한 시뮬레이션 데이터를 만듭니다. 예: 신제품 출시 후 24개월 손익, 마케팅 예산 대비 매출, 재고 회전율 등. Claude Code에게 바로 만들어 달라고 해도 됩니다.\n```\ndata/research/scenario.csv 파일을 만들어줘. 주제는 [본인 주제 한 줄].\n변수마다 값의 형태를 다르게 넣어줘 — 단일값 하나, 최소/기준/최대 3개짜리, 평균/표준편차 2개짜리를 섞어서.\n그리고 \"값\"이 아니라 \"계산 방식\"을 설명하는 행도 1~2개 넣어줘 (예: 확률변수를 어떻게 뽑을지, 월별로 어떻게 변화하는지).\n```\n\n### 2. Multi-Agent 구조 추가\n```\n이 앱에 Multi-Agent 연구 모드를 추가해줘. [에이전트] 탭을 새로 만들어줘.\n\n- 연구책임자(director), 자료조사 연구원(researcher), 실험수행 연구원(experimenter) 세 역할을 각각\n  별도 프로세스(로컬 서버)로 띄우고, [프로세스] 카드에서 각각 [기동] 버튼으로 켤 수 있게 해줘.\n  각 프로세스가 뜨면 PID와 포트를 보여줘.\n- 연구책임자만 사용자와 대화한다. 연구책임자는 직접 조사하거나 코드를 실행하지 않고,\n  자료조사 연구원과 실험수행 연구원에게 일을 위임하고 결과를 받아 다음 지시를 정한다.\n- 자료조사 연구원은 doc_search 같은 MCP 문서 검색 도구만 가지고, 분석 방법을 설계한다.\n  코드를 짜거나 실행하지 않는다.\n- 실험수행 연구원은 파이썬 코드 실행 도구만 가지고, 넘겨받은 설계를 바탕으로 실제로 코드를 돌려\n  수치를 낸다. 정량 결과는 실제 코드 실행 결과만 사용한다. 판단(결론)을 내리지 않는다.\n- 두 연구원은 서로를 직접 부를 수 없고, 모든 전달은 연구책임자를 거친다.\n- 화면에 \"연구 시작\" 입력창과 [맡기기] 버튼, 그리고 \"Agent 간에 주고받은 정보\" 로그를 시간순으로\n  보여줘 (연구책임자가 맡긴 것 = 파란 상자, 연구원이 돌려준 것 = 회색 상자).\n- 같은 세션에서 \"이어서 물어보기\"가 가능하게 해줘 (연구책임자가 이전 연구를 기억).\n- [프로세스] 카드에 각 역할이 지금 쥐고 있는 도구 목록도 보여줘.\n```\n(서버 재시작 후) `[에이전트]` 탭에서 자료조사·실험수행 각각 `[기동]`\n\n### 3. 도구 분리 확인\n- [ ] 세 역할의 도구 목록을 나란히 읽고, 05에서 붙인 MCP 도구(자료 조사 서버 등)가 어느 역할에게 갔는지 확인\n\n### 4. 동작 확인용 간단 연구\n```\n동전을 10번 던져 앞면이 6번 이상 나올 확률을 구하려고 합니다.\n어떤 방법으로 구할 수 있는지 조사하고, 파이썬으로 실행해 확인하세요.\n정량 결과는 실제 코드 실행 결과를 사용하세요.\n```\n\n### 5. 본 실습 — 본인 시나리오 연구\n- [ ] `scenario.csv`를 근거로 연구 질문 작성 (수치로 답이 나오는 질문으로 좁히기)\n- [ ] \"연구 시작\"에 붙여넣고 `[맡기기]`\n- [ ] 로그를 위에서부터 읽으며 확인:\n  - [ ] 자료조사 연구원이 무엇을 읽고 무엇을 설계했는지\n  - [ ] 연구책임자가 실험수행 연구원에게 보낸 지시문에 앞 단계 결과가 실렸는지\n  - [ ] 실험수행 연구원이 실제로 실행한 코드와 출력\n  - [ ] 각 역할이 자기 역할 밖의 일(계산·판단 등)을 하지 않았는지\n\n### 6. 이어서 물어보기\n- [ ] 조건 하나를 바꿔 재질문 (예: \"○○ 조건이 이렇게 바뀌면 어떻게 되나? 나머지는 그대로 두고 다시 계산해줘\")\n- [ ] `[새 연구로 시작]`은 누르지 않기 (기억이 지워짐)\n- [ ] 수치가 어느 방향으로 움직였는지, 4번과 비교해 기록\n\n## 완료 기준\n- [ ] 세 역할이 각자 다른 도구를 쥐고 있음을 확인\n- [ ] 위임 지시문에 앞 단계 결과가 실려서 전달되는 걸 로그에서 확인\n- [ ] 조건을 바꿔 재질문했을 때 이전 맥락을 기억하고 이어서 답하는 걸 확인\n- [ ] \"왜 이 작업을 나눴는가\"를 한 문장으로 정리\n\n다음: [07-캡스톤 실습 가이드](실습가이드-07-캡스톤.md)\n", "cbCount": 15, "contentEasy": "# 실습 가이드 6 · Multi-Agent — 역할을 나눠 연구를 맡긴다 (쉬운 설명 버전)\n\n목표: 아트디렉터·리서처·실무 담당 세 역할이 서로 다른 도구/지시로 협업하는 걸 직접 돌려보고, 왜 나누는지 체감합니다. 05에서 만든 `agent-lab`을 이어서 사용.\n\n원본은 [학습노트 06(쉬운 설명)](../06-MultiAgent.md) 참고.\n\n## 체크리스트\n\n### 1. 가상 데이터(CSV) 준비\n본인 관심 주제로 간단한 시뮬레이션용 표를 만듭니다. 예: 신제품 출시 후 24개월 손익, 마케팅 예산 대비 매출, 재고 회전율 등. Claude Code에게 바로 만들어 달라고 해도 됩니다.\n```\ndata/research/scenario.csv 파일을 만들어줘. 주제는 [본인 주제 한 줄].\n변수마다 값의 형태를 다르게 넣어줘 — 단일값 하나, 최소/기준/최대 3개짜리, 평균/표준편차 2개짜리를 섞어서.\n그리고 \"값\"이 아니라 \"계산 방식\"을 설명하는 행도 1~2개 넣어줘 (예: 확률변수를 어떻게 뽑을지, 월별로 어떻게 변화하는지).\n```\n\n### 2. 세 역할(팀) 구조 추가\n```\n이 앱에 Multi-Agent 연구 모드를 추가해줘. [에이전트] 탭을 새로 만들어줘.\n\n- 연구책임자(director), 자료조사 연구원(researcher), 실험수행 연구원(experimenter) 세 역할을 각각\n  별도 프로세스(로컬 서버)로 띄우고, [프로세스] 카드에서 각각 [기동] 버튼으로 켤 수 있게 해줘.\n  각 프로세스가 뜨면 PID와 포트를 보여줘.\n- 연구책임자만 사용자와 대화한다. 연구책임자는 직접 조사하거나 코드를 실행하지 않고,\n  자료조사 연구원과 실험수행 연구원에게 일을 위임하고 결과를 받아 다음 지시를 정한다.\n- 자료조사 연구원은 doc_search 같은 MCP 문서 검색 도구만 가지고, 분석 방법을 설계한다.\n  코드를 짜거나 실행하지 않는다.\n- 실험수행 연구원은 파이썬 코드 실행 도구만 가지고, 넘겨받은 설계를 바탕으로 실제로 코드를 돌려\n  수치를 낸다. 정량 결과는 실제 코드 실행 결과만 사용한다. 판단(결론)을 내리지 않는다.\n- 두 연구원은 서로를 직접 부를 수 없고, 모든 전달은 연구책임자를 거친다.\n- 화면에 \"연구 시작\" 입력창과 [맡기기] 버튼, 그리고 \"Agent 간에 주고받은 정보\" 로그를 시간순으로\n  보여줘 (연구책임자가 맡긴 것 = 파란 상자, 연구원이 돌려준 것 = 회색 상자).\n- 같은 세션에서 \"이어서 물어보기\"가 가능하게 해줘 (연구책임자가 이전 연구를 기억).\n- [프로세스] 카드에 각 역할이 지금 쥐고 있는 도구 목록도 보여줘.\n```\n(서버 재시작 후) `[에이전트]` 탭에서 자료조사·실험수행 각각 `[기동]`\n\n### 3. 각자 다른 도구를 쥐고 있는지 확인\n- [ ] 세 역할의 도구 목록을 나란히 읽고, 05에서 붙인 플러그인(문서 검색 등)이 어느 역할에게 갔는지 확인\n\n### 4. 동작 확인용 간단한 연구\n```\n동전을 10번 던져 앞면이 6번 이상 나올 확률을 구하려고 합니다.\n어떤 방법으로 구할 수 있는지 조사하고, 파이썬으로 실행해 확인하세요.\n정량 결과는 실제 코드 실행 결과를 사용하세요.\n```\n\n### 5. 본 실습 — 본인 주제로 연구시키기\n- [ ] `scenario.csv`를 근거로 연구 질문 작성 (숫자로 답이 나오는 질문으로 좁히기)\n- [ ] \"연구 시작\"에 붙여넣고 `[맡기기]`\n- [ ] 로그를 위에서부터 읽으며 확인:\n  - [ ] 자료조사 연구원(리서처)이 무엇을 읽고 무엇을 설계했는지\n  - [ ] 아트디렉터(연구책임자)가 실무 담당에게 보낸 지시문에 앞 단계 결과가 실렸는지\n  - [ ] 실무 담당(실험수행 연구원)이 실제로 실행한 코드와 출력\n  - [ ] 각 역할이 자기 역할 밖의 일(계산·판단 등)을 하지 않았는지\n\n### 6. 이어서 물어보기\n- [ ] 조건 하나를 바꿔 재질문 (예: \"○○ 조건이 이렇게 바뀌면 어떻게 되나? 나머지는 그대로 두고 다시 계산해줘\")\n- [ ] `[새 연구로 시작]`은 누르지 않기 (기억이 지워짐)\n- [ ] 수치가 어느 방향으로 움직였는지, 4번과 비교해 기록\n\n## 완료 기준\n- [ ] 세 역할이 각자 다른 도구를 쥐고 있음을 확인\n- [ ] 위임 지시문에 앞 단계 결과가 실려서 전달되는 걸 로그에서 확인\n- [ ] 조건을 바꿔 재질문했을 때 이전 맥락을 기억하고 이어서 답하는 걸 확인\n- [ ] \"왜 이 작업을 나눴는가\"를 한 문장으로 정리\n\n다음: [07-캡스톤 실습 가이드](실습가이드-07-캡스톤.md)\n"}, {"id": "guide-7", "filename": "실습가이드-07-캡스톤.md", "category": "guide", "badge": "7", "label": "캡스톤", "content": "# 실습 가이드 7 · 캡스톤 — 나만의 프로젝트\n\n목표: 지금까지 배운 RAG·Tool Calling·MCP·Multi-Agent 중 필요한 걸 조합해, 본인 주제로 실제 동작하는 결과물 하나를 완성한다.\n\n원본은 [학습노트 07](07-캡스톤1-기획제작.md)·[08](08-캡스톤2-완성제출.md) 참고. 자습에서는 **정해진 마감 시각과 사내 콘테스트 제출이 없습니다** — 자기 페이스로 진행하고, 결과는 개인 포트폴리오로 남깁니다.\n\n## 체크리스트\n\n### 1. 주제 정하기\n1~6에서 \"이건 내 업무/관심사에 쓰겠는데\" 싶었던 순간이 있으면 그걸 붙잡습니다. 없으면 아래 중 하나를 고릅니다.\n\n- [ ] **자유 주제** — 배운 걸 조합해 만들고 싶은 것\n- [ ] **도구 설계형** — `agent-lab`을 본인 시나리오로 확장 (도구 3종 이상 + 질문 10개 중 8개 이상 정확히 처리되게)\n- [ ] **문서 질답형** — `rag-lab`에 본인 문서를 적재하고, 함정 질문 5개를 스스로 만들어 4개 이상 통과시키기 (표 속 정답 / 유사 항목 혼동 / 조각 경계 / 이중 기준 / 환각 유도 — [학습노트 07의 트랙2 문항 예시](07-캡스톤1-기획제작.md) 패턴 참고)\n- [ ] **조사 리포트형** — `agent-lab`의 Multi-Agent 구조로 본인 주제 연구 리포트 만들기\n\n### 2. 만들기 전 점검 (5~10분만)\n새 폴더에서 Claude Code에게 먼저 물어봅니다.\n```powershell\nmkdir C:\\ai-agent-selfstudy\\07-capstone\ncd C:\\ai-agent-selfstudy\\07-capstone\nclaude\n```\n```\n내 프로젝트 주제를 알려줄게. 만들기 전에 아래를 점검해줘.\n\n주제: [한 줄]\n만들고 싶은 것: [화면 기준으로 구체적으로]\n\n① 범위 — 몇 시간 안에 혼자 만들 수 있는 크기인가? 너무 크면 어디를 잘라야 하는지 알려줘.\n② 기술 매핑 — RAG·Tool Calling·MCP·Multi-Agent 중 무엇을 쓰게 되나?\n③ 데이터 — 어떤 데이터가 필요하고, 없는 건 가상으로 만들어줄 수 있나?\n④ 입력 점검 — 내 설명에 민감한 정보(회사 기밀, 개인정보 등)가 섞여 있으면 짚어주고 가상 버전으로 제안해줘.\n```\n- [ ] 제안받은 범위를 그 자리에서 확정 (이 단계에 너무 오래 쓰지 않기)\n- [ ] 민감 정보가 지적되면 가상 데이터로 교체\n\n### 3. 만들기\n- [ ] 시작할 앱(01/02/04 중 관련된 것)을 이 폴더로 복사해서 작업 (원본은 그대로 둠)\n- [ ] 먼저 **끝까지 도는 최소 버전**부터 완성 (완성도보다 정상 동작이 먼저)\n- [ ] 남는 시간에 기능 추가\n- [ ] 문서/도구 챌린지형이라면: 손대기 전 **라운드 0**(기준선) 먼저 측정 → 한 번에 한 가지씩 고치며 라운드 기록\n  ```\n  라운드 0 (기준선): 통과 ___/___\n  라운드 1 (처방: ______): 통과 ___/___\n  ```\n\n### 4. 결과 페이지 만들기 (선택이지만 권장 — 포트폴리오용)\n```\n프로젝트가 완성됐어. 결과 페이지 report.html을 만들어줘.\n\n[포함할 내용]\n① 프로젝트 제목과 목표/배경 (2~3문장)\n② 주요 기능 설명\n③ 사용한 기술 (RAG·Tool Calling·MCP·Multi-Agent 중 해당 항목과 어디에 쓰였는지)\n④ 동작 시연 mock-up — 핵심 흐름 1개를 화면 3~5장으로, 버튼 클릭으로 넘기는 수준. 데이터는 예시값 하드코딩.\n⑤ 실행 결과 스크린샷 (있으면)\n⑥ (챌린지형이라면) 라운드 기록 표\n⑦ 실무 적용 시 필요한 것 — 어떤 데이터·시스템 연동이 필요한가, 그 데이터를 외부 AI 서비스에 넣어도 되는가\n\n[조건]\n- CSS·JS 전부 파일 안에. 외부 라이브러리·CDN·인터넷 요청 금지 (인터넷 없이도 열려야 함).\n- 이미지는 base64 인라인만.\n```\n- [ ] `report.html`을 인터넷 끊고 열어봐서 정상 표시되는지 확인\n- [ ] 원하면 GitHub Pages, Notion 파일 첨부 등 원하는 곳에 개인적으로 보관/공유\n\n> 원본 8교시의 \"제출 플랫폼 가입·제출\" 섹션은 사내 콘테스트 전용이라 자습에서는 생략합니다. `report.html`은 그 자체로 완결된 포트폴리오 파일입니다.\n\n## 완료 기준\n- [ ] 처음부터 끝까지 실제로 동작하는 결과물 1개\n- [ ] `report.html` 1개 (선택)\n- [ ] 원본 폴더(01/02/04)는 그대로 보존됨\n\n## 전체 완주 체크\n- [ ] 01 웹앱\n- [ ] 02 RAG1\n- [ ] 03 RAG2\n- [ ] 04 Tool Calling\n- [ ] 05 MCP\n- [ ] 06 Multi-Agent\n- [ ] 07 캡스톤\n\n수고하셨습니다. 여기까지 왔다면 RAG 5단계, Tool Calling의 판단 구조, MCP 연결, Multi-Agent 역할 분리까지 전부 손으로 직접 만들어본 것입니다.\n", "cbCount": 22, "contentEasy": "# 실습 가이드 7 · 캡스톤 — 나만의 프로젝트 (쉬운 설명 버전)\n\n목표: 지금까지 배운 것 중 필요한 걸 조합해, 본인 주제로 실제 동작하는 결과물 하나를 완성합니다.\n\n원본은 [학습노트 07](../07-캡스톤1-기획제작.md)·[08](../08-캡스톤2-완성제출.md) 참고. 자습에서는 **정해진 마감 시각과 회사 제출 절차가 없습니다** — 원하는 속도로 진행하고, 결과는 개인 포트폴리오로 남깁니다.\n\n## 체크리스트\n\n### 1. 주제 정하기\n1~6단계에서 \"이건 내 작업에도 쓰겠는데\" 싶었던 순간이 있으면 그걸 붙잡습니다. 없으면 아래 중 하나를 고릅니다.\n\n- [ ] **자유 주제** — 배운 걸 조합해 만들고 싶은 것\n- [ ] **도구 설계형** — `agent-lab`을 본인 시나리오로 확장 (도구 3종 이상 + 질문 10개 중 8개 이상 정확히 처리되게)\n- [ ] **문서 질답형** — `rag-lab`에 본인 문서를 저장하고, 함정 질문 5개를 스스로 만들어 4개 이상 통과시키기 (표 속 정답 / 비슷한 항목 혼동 / 조각 경계 / 이중 기준 / 지어내기 유도 — [학습노트 07의 예시](../07-캡스톤1-기획제작.md) 패턴 참고)\n- [ ] **조사 리포트형** — `agent-lab`의 팀 구조(Multi-Agent)로 본인 주제 연구 리포트 만들기\n\n### 2. 만들기 전 점검 (5~10분만)\n새 폴더에서 Claude Code에게 먼저 물어봅니다.\n```powershell\nmkdir C:\\ai-agent-selfstudy\\07-capstone\ncd C:\\ai-agent-selfstudy\\07-capstone\nclaude\n```\n```\n내 프로젝트 주제를 알려줄게. 만들기 전에 아래를 점검해줘.\n\n주제: [한 줄]\n만들고 싶은 것: [화면 기준으로 구체적으로]\n\n① 범위 — 몇 시간 안에 혼자 만들 수 있는 크기인가? 너무 크면 어디를 잘라야 하는지 알려줘.\n② 기술 매핑 — RAG·Tool Calling·MCP·Multi-Agent 중 무엇을 쓰게 되나?\n③ 데이터 — 어떤 데이터가 필요하고, 없는 건 가상으로 만들어줄 수 있나?\n④ 입력 점검 — 내 설명에 민감한 정보(회사 기밀, 개인정보 등)가 섞여 있으면 짚어주고 가상 버전으로 제안해줘.\n```\n\n디자인 작업으로 치면 \"이 컨셉, 오늘 안에 완성 가능한 볼륨일까요?\"를 미리 물어보는 것과 같습니다.\n\n- [ ] 제안받은 범위를 그 자리에서 확정 (이 단계에 너무 오래 쓰지 않기)\n- [ ] 민감 정보가 지적되면 가상 데이터로 교체\n\n### 3. 만들기\n- [ ] 시작할 앱(01/02/04 중 관련된 것)을 이 폴더로 복사해서 작업 (원본은 그대로 둠)\n- [ ] 먼저 **끝까지 도는 최소 버전**부터 완성 (완성도보다 정상 동작이 먼저)\n- [ ] 남는 시간에 기능 추가\n- [ ] 문서/도구 챌린지형이라면: 손대기 전 **라운드 0**(기준선) 먼저 측정 → 한 번에 한 가지씩 고치며 라운드 기록\n  ```\n  라운드 0 (기준선): 통과 ___/___\n  라운드 1 (처방: ______): 통과 ___/___\n  ```\n\n### 4. 결과 페이지 만들기 (선택이지만 권장 — 포트폴리오용)\n```\n프로젝트가 완성됐어. 결과 페이지 report.html을 만들어줘.\n\n[포함할 내용]\n① 프로젝트 제목과 목표/배경 (2~3문장)\n② 주요 기능 설명\n③ 사용한 기술 (RAG·Tool Calling·MCP·Multi-Agent 중 해당 항목과 어디에 쓰였는지)\n④ 동작 시연 mock-up — 핵심 흐름 1개를 화면 3~5장으로, 버튼 클릭으로 넘기는 수준. 데이터는 예시값 하드코딩.\n⑤ 실행 결과 스크린샷 (있으면)\n⑥ (챌린지형이라면) 라운드 기록 표\n⑦ 실무 적용 시 필요한 것 — 어떤 데이터·시스템 연동이 필요한가, 그 데이터를 외부 AI 서비스에 넣어도 되는가\n\n[조건]\n- CSS·JS 전부 파일 안에. 외부 라이브러리·CDN·인터넷 요청 금지 (인터넷 없이도 열려야 함).\n- 이미지는 base64 인라인만.\n```\n- [ ] `report.html`을 인터넷 끊고 열어봐서 정상 표시되는지 확인\n- [ ] 원하면 GitHub Pages, Notion 파일 첨부 등 원하는 곳에 개인적으로 보관/공유\n\n> 원본 8교시의 \"제출 사이트 가입·제출\" 부분은 회사 행사 전용이라 자습에서는 생략합니다. `report.html`은 그 자체로 완결된 포트폴리오 파일입니다.\n\n## 완료 기준\n- [ ] 처음부터 끝까지 실제로 동작하는 결과물 1개\n- [ ] `report.html` 1개 (선택)\n- [ ] 원본 폴더(01/02/04)는 그대로 보존됨\n\n## 전체 완주 체크\n- [ ] 01 웹앱\n- [ ] 02 RAG1\n- [ ] 03 RAG2\n- [ ] 04 Tool Calling\n- [ ] 05 MCP\n- [ ] 06 Multi-Agent\n- [ ] 07 캡스톤\n\n수고하셨습니다. 여기까지 왔다면 문서를 찾아 답하게 만드는 것부터, AI에게 액션을 쥐여주는 것, 플러그인 연결, 팀처럼 역할을 나누는 것까지 전부 손으로 직접 만들어본 것입니다. Midjourney·Higgsfield에서 하던 \"프롬프트로 원하는 걸 만드는\" 감각을 프로그램 만들기에도 그대로 적용하신 거예요.\n"}];
  var byId = {}, byFilename = {};
  DOCS.forEach(function(d){ byId[d.id]=d; byFilename[d.filename]=d; });

  marked.setOptions({ gfm:true, breaks:false });

  var contentEl = document.getElementById('content');
  var sidebar = document.getElementById('sidebar');
  var menuBtn = document.getElementById('menuBtn');
  var layoutEl = document.getElementById('layout');
  var STORE_KEY = 'agentArchitectProgress_v1';
  var SIDEBAR_KEY = 'agentArchitectSidebarCollapsed_v1';
  var LEVEL_KEY = 'agentArchitectLevel_v1';
  var levelGeneralBtn = document.getElementById('levelGeneralBtn');
  var levelEasyBtn = document.getElementById('levelEasyBtn');
  var level = 'general';
  try{ if(localStorage.getItem(LEVEL_KEY) === 'easy') level = 'easy'; }catch(e){}

  var appEl = document.querySelector('.app');

  function updateLevelButtons(){
    levelGeneralBtn.classList.toggle('active', level === 'general');
    levelEasyBtn.classList.toggle('active', level === 'easy');
    appEl.classList.toggle('theme-easy', level === 'easy');
  }
  function setLevel(l){
    if(l === level) return;
    level = l;
    try{ localStorage.setItem(LEVEL_KEY, level); }catch(e){}
    updateLevelButtons();
    render(location.hash.replace('#/','') || 'overview');
  }
  levelGeneralBtn.addEventListener('click', function(){ setLevel('general'); });
  levelEasyBtn.addEventListener('click', function(){ setLevel('easy'); });

  function loadProgress(){
    try{ return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }catch(e){ return {}; }
  }
  function saveProgress(p){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){}
  }
  var progress = loadProgress();

  function docCheckedCount(doc){
    var n=0;
    for(var i=0;i<doc.cbCount;i++){ if(progress[doc.id+':'+i]) n++; }
    return n;
  }

  function buildSidebar(){
    var noteWrap = document.getElementById('noteItems');
    var guideWrap = document.getElementById('guideItems');
    DOCS.forEach(function(d){
      var a = document.createElement('a');
      a.className = 'nav-item' + (d.id==='overview' ? ' nav-item--overview' : '');
      a.href = '#/' + d.id;
      a.dataset.id = d.id;
      var numHtml = '<span class="nav-num">' + (d.id==='overview' ? '&#9673;' : d.badge) + '</span>';
      var fracHtml = d.cbCount>0 ? '<span class="nav-frac">0/' + d.cbCount + '</span>' : '';
      a.innerHTML = numHtml + '<span class="nav-label">' + d.label + '</span>' + fracHtml;
      (d.category==='note' ? noteWrap : guideWrap).appendChild(a);
    });
  }

  function setupCollapsibleGroups(){
    document.querySelectorAll('.nav-group-head').forEach(function(head){
      var group = head.closest('.nav-group');
      var key = 'navCollapsed_' + head.dataset.group;
      var collapsed = false;
      try{ collapsed = localStorage.getItem(key) === '1'; }catch(e){}
      if(collapsed){ group.classList.add('collapsed'); head.setAttribute('aria-expanded','false'); }
      function toggle(){
        var isCollapsed = group.classList.toggle('collapsed');
        head.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
        try{ localStorage.setItem(key, isCollapsed ? '1' : '0'); }catch(e){}
      }
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); }
      });
    });
  }

  function expandGroupOf(id){
    var item = document.querySelector('.nav-item[data-id="'+id+'"]');
    if(!item) return;
    var group = item.closest('.nav-group');
    if(group && group.classList.contains('collapsed')){
      group.classList.remove('collapsed');
      var head = group.querySelector('.nav-group-head');
      if(head){
        head.setAttribute('aria-expanded','true');
        try{ localStorage.setItem('navCollapsed_'+head.dataset.group, '0'); }catch(e){}
      }
    }
  }

  function render(id){
    var doc = byId[id] || byId['overview'];
    expandGroupOf(doc.id);
    var useEasy = level === 'easy' && doc.contentEasy;
    contentEl.classList.toggle('is-easy', !!useEasy);
    contentEl.innerHTML = marked.parse(useEasy ? doc.contentEasy : doc.content);
    if(useEasy){
      var badge = document.createElement('div');
      badge.className = 'easy-badge';
      badge.textContent = '쉬운 설명 버전';
      contentEl.insertBefore(badge, contentEl.firstChild);
    }

    contentEl.querySelectorAll('a[href]').forEach(function(a){
      var href = a.getAttribute('href');
      var key = href.replace(/^(\.\.?\/)+/, '');
      if(byFilename[key]){
        a.setAttribute('href', '#/' + byFilename[key].id);
      } else if(/^https?:\/\//.test(href)){
        a.setAttribute('target','_blank'); a.setAttribute('rel','noopener');
      }
    });

    contentEl.querySelectorAll('table').forEach(function(t){
      var wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });

    var boxes = contentEl.querySelectorAll('input[type=checkbox]');
    boxes.forEach(function(box, i){
      box.disabled = false;
      var key = doc.id + ':' + i;
      box.checked = !!progress[key];
      var li = box.closest('li');
      if(li){
        li.classList.add('task-list-item');
        li.classList.toggle('checked', box.checked);
        if(!li.querySelector('.task-text')){
          var wrap = document.createElement('span');
          wrap.className = 'task-text';
          while(box.nextSibling){ wrap.appendChild(box.nextSibling); }
          li.appendChild(wrap);
        }
      }
      box.addEventListener('change', function(){
        if(box.checked) progress[key]=true; else delete progress[key];
        saveProgress(progress);
        if(li) li.classList.toggle('checked', box.checked);
        updateAllProgress();
      });
    });

    contentEl.querySelectorAll('pre').forEach(function(pre){
      var btn = document.createElement('button');
      btn.className = 'copy-btn'; btn.type = 'button'; btn.textContent = '복사';
      btn.addEventListener('click', function(){
        var code = pre.querySelector('code');
        var text = code ? code.textContent : pre.textContent;
        navigator.clipboard.writeText(text).then(function(){
          btn.textContent = '복사됨'; btn.classList.add('copied');
          setTimeout(function(){ btn.textContent='복사'; btn.classList.remove('copied'); }, 1400);
        }).catch(function(){});
      });
      pre.appendChild(btn);
    });

    var idx = DOCS.findIndex(function(d){ return d.id===doc.id; });
    var prev = DOCS[idx-1], next = DOCS[idx+1];
    var footer = document.createElement('footer');
    footer.className = 'doc-nav';
    footer.innerHTML =
      (prev ? '<a href="#/'+prev.id+'"><span class="lbl">이전</span>'+prev.label+'</a>' : '<span></span>') +
      (next ? '<a href="#/'+next.id+'" style="text-align:right"><span class="lbl">다음</span>'+next.label+'</a>' : '<span></span>');
    contentEl.appendChild(footer);

    document.querySelectorAll('.nav-item').forEach(function(el){
      el.classList.toggle('active', el.dataset.id === doc.id);
    });
    window.scrollTo(0,0);
    sidebar.classList.remove('open');
  }

  function updateAllProgress(){
    var totalAll=0, checkedAll=0, totalNote=0, checkedNote=0, totalGuide=0, checkedGuide=0;
    DOCS.forEach(function(d){
      var c = docCheckedCount(d);
      totalAll += d.cbCount; checkedAll += c;
      if(d.category==='note'){ totalNote+=d.cbCount; checkedNote+=c; }
      else { totalGuide+=d.cbCount; checkedGuide+=c; }
      var item = document.querySelector('.nav-item[data-id="'+d.id+'"]');
      if(item){
        var frac = item.querySelector('.nav-frac');
        if(frac) frac.textContent = c + '/' + d.cbCount;
        item.classList.toggle('done', d.cbCount>0 && c===d.cbCount);
        item.classList.toggle('partial', c>0 && c<d.cbCount);
      }
    });
    document.getElementById('fracNote').textContent = checkedNote + '/' + totalNote;
    document.getElementById('fracGuide').textContent = checkedGuide + '/' + totalGuide;
    var pct = totalAll ? Math.round(checkedAll/totalAll*100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = checkedAll + ' / ' + totalAll + ' · ' + pct + '%';
  }

  window.addEventListener('hashchange', function(){
    render(location.hash.replace('#/','') || 'overview');
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if(confirm('모든 체크 진행 상황을 초기화할까요? 되돌릴 수 없습니다.')){
      progress = {}; saveProgress(progress);
      render(location.hash.replace('#/','') || 'overview');
      updateAllProgress();
    }
  });
  function applyPersistedSidebarState(){
    var collapsed = false;
    try{ collapsed = localStorage.getItem(SIDEBAR_KEY) === '1'; }catch(e){}
    if(collapsed){
      layoutEl.classList.add('sidebar-collapsed');
      menuBtn.setAttribute('aria-expanded','false');
    }
  }

  menuBtn.addEventListener('click', function(){
    var isCollapsed = layoutEl.classList.toggle('sidebar-collapsed');
    menuBtn.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
    try{ localStorage.setItem(SIDEBAR_KEY, isCollapsed ? '1' : '0'); }catch(e){}
    sidebar.classList.toggle('open');
  });

  buildSidebar();
  setupCollapsibleGroups();
  applyPersistedSidebarState();
  updateLevelButtons();
  render(location.hash.replace('#/','') || 'overview');
  updateAllProgress();
})();
</script>
